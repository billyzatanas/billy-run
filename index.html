<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>🐱 BILLY THE CAT - ULTIMATE EDITION</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', 'Comic Neue', system-ui, sans-serif;
            min-height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #0a0a2a 0%, #050510 100%);
        }

        /* ==================== ANIMACIONES GLOBALES ==================== */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        
        @keyframes floatPet {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        
        @keyframes pulseGold {
            0%, 100% { box-shadow: 0 0 20px gold; transform: scale(1); }
            50% { box-shadow: 0 0 40px #ffaa44; transform: scale(1.02); }
        }
        
        @keyframes bounceIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        
        @keyframes floatUp {
            to { transform: translateY(-60px); opacity: 0; }
        }
        
        @keyframes fadeOutUp {
            to { opacity: 0; transform: translate(-50%, -70%); }
        }
        
        @keyframes rippleAnim {
            to { transform: scale(5); opacity: 0; }
        }
        
        @keyframes twinkle {
            from { opacity: 0.3; transform: scale(1); }
            to { opacity: 1; transform: scale(1.2); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        @keyframes glow {
            from { text-shadow: 0 0 0px orange; }
            to { text-shadow: 0 0 10px #ffaa44; }
        }

        /* ==================== ESTRELLAS ==================== */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite alternate;
        }

        /* ==================== PANTALLA DE REGISTRO ==================== */
        .register-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0a1a, #1a1a2e);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .register-card {
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(20px);
            border-radius: 60px;
            padding: 40px 30px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            border: 2px solid #ffaa44;
            animation: slideUp 0.5s ease;
        }
        
        .register-card img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin-bottom: 20px;
            animation: float 3s infinite;
        }
        
        .register-card h2 {
            color: #FFD966;
            margin-bottom: 20px;
        }
        
        .register-input {
            width: 100%;
            padding: 15px 20px;
            border-radius: 50px;
            border: none;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 18px;
            text-align: center;
            margin-bottom: 15px;
        }
        
        .register-input:focus {
            outline: none;
            border: 1px solid #ffaa44;
        }
        
        .register-btn {
            background: linear-gradient(135deg, #14f195, #9945ff);
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s;
        }
        
        .register-btn:active {
            transform: scale(0.97);
        }
        
        .error-msg {
            color: #ff6b6b;
            font-size: 12px;
            margin-top: 10px;
        }

        /* ==================== MENÚ PRINCIPAL ==================== */
        .main-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #0a0a2a 0%, #050510 100%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
        }
        
        .menu-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }
        
        /* Header de usuario */
        .user-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            border-radius: 60px;
            padding: 12px 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,200,100,0.3);
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .user-avatar {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #fbbf24, #e67e22);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }
        
        .user-details h3 {
            color: #FFD966;
            font-size: 16px;
        }
        
        .user-details p {
            color: rgba(255,255,255,0.6);
            font-size: 11px;
        }
        
        .user-stats {
            display: flex;
            gap: 15px;
        }
        
        .user-stat {
            text-align: center;
        }
        
        .user-stat-value {
            color: #FFD966;
            font-weight: bold;
            font-size: 18px;
        }
        
        .user-stat-label {
            color: rgba(255,255,255,0.5);
            font-size: 10px;
        }
        
        /* Logo */
        .billy-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .billy-logo img {
            width: 140px;
            height: 140px;
            object-fit: contain;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
            animation: float 3s infinite;
        }
        
        .billy-logo h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #FFD966, #FFA500);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-top: 10px;
        }
        
        /* Tarjetas de juegos */
        .game-modes {
            display: flex;
            gap: 20px;
            margin: 25px 0;
        }
        
        .mode-card {
            flex: 1;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid rgba(255,200,100,0.3);
        }
        
        .mode-card:hover {
            transform: translateY(-5px);
            border-color: #ffaa44;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        
        .mode-card:active {
            transform: scale(0.98);
        }
        
        .mode-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        
        .mode-card h3 {
            color: #FFD966;
            font-size: 20px;
        }
        
        .mode-card p {
            color: rgba(255,255,255,0.6);
            font-size: 11px;
            margin-top: 5px;
        }
        
        /* Recursos */
        .resources-bar {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            border-radius: 60px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            margin: 20px 0;
        }
        
        .resource {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .resource-icon {
            font-size: 32px;
        }
        
        .resource-icon img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }
        
        .resource-info {
            text-align: left;
        }
        
        .resource-value {
            font-size: 20px;
            font-weight: bold;
            color: #FFD966;
        }
        
        .resource-label {
            font-size: 10px;
            color: rgba(255,255,255,0.6);
        }
        
        /* Misiones diarias */
        .daily-missions {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 15px;
            margin: 15px 0;
        }
        
        .daily-missions h4 {
            color: #FFD966;
            margin-bottom: 10px;
            font-size: 14px;
        }
        
        .mission-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .mission-name {
            color: #FFD966;
            font-size: 12px;
        }
        
        .mission-reward {
            font-size: 10px;
            color: #aaa;
        }
        
        .mission-progress {
            font-size: 11px;
            color: #FFD966;
        }
        
        .mission-completed {
            color: #22c55e;
            font-size: 12px;
        }
        
        /* Botones del menú */
        .menu-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .menu-btn {
            flex: 1;
            background: rgba(30,41,59,0.9);
            backdrop-filter: blur(5px);
            border: none;
            padding: 12px;
            border-radius: 50px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.1s;
            text-align: center;
            font-size: 13px;
        }
        
        .menu-btn:active {
            transform: scale(0.97);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #fbbf24, #e67e22);
            color: #1e1a2f;
        }
        
        .btn-solana {
            background: linear-gradient(135deg, #14f195, #9945ff);
        }

        /* ==================== CONTENEDORES DE JUEGOS ==================== */
        .game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1100;
            display: none;
            background: radial-gradient(circle at center, #0a0a2a 0%, #050510 100%);
        }
        
        .game-container.active {
            display: block;
        }
        
        .game-header {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            z-index: 50;
        }
        
        .back-btn {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            padding: 10px 20px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            border: none;
        }
        
        .back-btn:active {
            transform: scale(0.95);
        }

        /* ==================== MODAL DE TIENDA ==================== */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }
        
        .modal-content {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-radius: 40px;
            padding: 25px;
            width: 90%;
            max-width: 450px;
            max-height: 85vh;
            overflow-y: auto;
            border: 2px solid #ffaa44;
        }
        
        .modal-content h2 {
            color: #FFD966;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .shop-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .shop-tab {
            flex: 1;
            padding: 8px;
            background: rgba(0,0,0,0.5);
            border-radius: 30px;
            text-align: center;
            cursor: pointer;
            color: white;
            font-size: 12px;
        }
        
        .shop-tab.active {
            background: linear-gradient(135deg, #fbbf24, #e67e22);
            color: #1e1a2f;
        }
        
        .shop-section {
            display: none;
        }
        
        .shop-section.active {
            display: block;
        }
        
        .shop-item {
            background: rgba(0,0,0,0.5);
            border-radius: 20px;
            padding: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,200,100,0.3);
            cursor: pointer;
        }
        
        .shop-item:active {
            transform: scale(0.98);
        }
        
        .shop-item.equipped {
            border: 2px solid #14f195;
            background: rgba(20,241,149,0.1);
        }
        
        .item-info {
            flex: 1;
        }
        
        .item-name {
            font-weight: bold;
            color: white;
        }
        
        .item-desc {
            font-size: 10px;
            color: #FFD966;
        }
        
        .item-price {
            font-size: 11px;
            color: #aaa;
        }
        
        .shop-btn {
            background: linear-gradient(135deg, #fbbf24, #e67e22);
            border: none;
            padding: 6px 15px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            font-size: 11px;
        }
        
        .close-modal {
            margin-top: 20px;
            background: #334155;
            padding: 10px 30px;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            border: none;
            color: white;
        }
        
        /* ==================== MODAL DE PERFIL ==================== */
        .profile-stats {
            margin: 15px 0;
        }
        
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            color: white;
        }
        
        .change-nick {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        .change-nick input {
            flex: 1;
            padding: 10px;
            border-radius: 30px;
            border: none;
            background: rgba(255,255,255,0.1);
            color: white;
        }
        
        /* ==================== ESTILOS DEL JUEGO CLICKER ==================== */
        .top-panel {
            position: fixed;
            top: 70px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            z-index: 30;
        }
        
        .stat-card {
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: bold;
            color: #FFE484;
            border: 1px solid rgba(255,200,100,0.5);
        }
        
        .token-bar {
            position: fixed;
            top: 130px;
            left: 10px;
            right: 10px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            border-radius: 60px;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            z-index: 30;
            cursor: pointer;
            font-weight: bold;
        }
        
        .token-bar:active {
            transform: scale(0.98);
        }
        
        .combo-panel {
            position: fixed;
            top: 180px;
            right: 10px;
            background: rgba(0,0,0,0.85);
            padding: 8px 16px;
            border-radius: 40px;
            font-weight: bold;
            color: #ff884d;
            z-index: 30;
            border: 1px solid #ffaa44;
        }
        
        .pet-panel {
            position: fixed;
            top: 180px;
            left: 10px;
            background: rgba(0,0,0,0.85);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            color: #FFD966;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            z-index: 30;
        }
        
        .records-panel {
            position: fixed;
            top: 230px;
            left: 10px;
            background: rgba(0,0,0,0.85);
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 10px;
            color: #FFD966;
            text-align: center;
            cursor: pointer;
            z-index: 30;
        }
        
        .energy-container {
            position: fixed;
            bottom: 100px;
            left: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            border-radius: 20px;
            padding: 8px 12px;
            z-index: 30;
        }
        
        .energy-bg {
            height: 12px;
            background: #2d2a3e;
            border-radius: 20px;
            overflow: hidden;
        }
        
        .energy-fill {
            height: 100%;
            background: linear-gradient(90deg, #22c55e, #facc15);
            border-radius: 20px;
            transition: width 0.2s;
        }
        
        .challenges-panel {
            position: fixed;
            bottom: 160px;
            left: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            border-radius: 20px;
            padding: 8px;
            z-index: 30;
            display: flex;
            justify-content: space-around;
            gap: 8px;
        }
        
        .challenge-item {
            font-size: 10px;
            color: #FFD966;
            text-align: center;
            flex: 1;
            background: rgba(0,0,0,0.5);
            padding: 4px;
            border-radius: 12px;
        }
        
        .action-buttons {
            position: fixed;
            bottom: 15px;
            left: 10px;
            right: 10px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            z-index: 30;
        }
        
        .btn {
            flex: 1;
            padding: 10px 6px;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 10px;
            cursor: pointer;
            background: linear-gradient(145deg, #1e293b, #0f172a);
            color: white;
            text-align: center;
        }
        
        .btn:active {
            transform: translateY(2px);
        }
        
        .btn-primary {
            background: linear-gradient(145deg, #fbbf24, #e67e22);
            color: #1e1a2f;
        }
        
        /* Billy */
        #billy {
            position: fixed;
            width: 130px;
            height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 20;
            transition: transform 0.05s linear, left 0.1s ease-out, top 0.1s ease-out;
        }
        
        #billy img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 8px 15px rgba(0,0,0,0.4));
        }
        
        #billy:active {
            transform: scale(0.92) !important;
        }
        
        .billy-golden img {
            filter: drop-shadow(0 0 20px gold);
            animation: pulseGold 0.5s infinite;
        }
        
        .pet-follower {
            position: fixed;
            z-index: 18;
            font-size: 32px;
            pointer-events: none;
            animation: floatPet 2s infinite;
        }
        
        #gameArea {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 15;
        }
        
        .game-entity {
            position: fixed;
            cursor: pointer;
            z-index: 25;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            animation: bounceIn 0.3s ease;
        }
        
        .game-entity:active {
            transform: scale(0.95);
        }
        
        .mouse-normal {
            background: radial-gradient(circle, #8B5A2B, #5D3A1A);
            border-radius: 50%;
            border: 2px solid #b97f44;
        }
        
        .mouse-golden {
            background: radial-gradient(circle, #FBBF24, #E67E22);
            border-radius: 50%;
            border: 3px solid gold;
            animation: pulseGold 0.8s infinite;
        }
        
        .mouse-boss {
            background: radial-gradient(circle, #4a2a1a, #2a1a0a);
            border-radius: 50%;
            border: 3px solid #c97e3a;
            font-size: 32px !important;
        }
        
        .bubble {
            background: radial-gradient(circle, #FFE484, #F59E0B);
            border-radius: 50%;
            box-shadow: 0 0 15px gold;
            animation: float 2s infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        
        .notification {
            position: fixed;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #facc15, #f59e0b);
            color: #0c0a1a;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: bold;
            z-index: 200;
            animation: fadeOutUp 1s forwards;
            white-space: nowrap;
        }
        
        .notification.crit {
            background: linear-gradient(135deg, #ff6b6b, #ff4444);
            color: white;
        }
        
        .notification.achievement {
            background: linear-gradient(135deg, #14f195, #9945ff);
            color: white;
        }
        
        .notification.pet {
            background: linear-gradient(135deg, #ec489a, #db2777);
            color: white;
        }
        
        .floating-number {
            position: fixed;
            font-weight: bold;
            font-size: 24px;
            text-shadow: 0 0 5px black;
            pointer-events: none;
            z-index: 150;
            animation: floatUp 0.8s forwards;
            color: white;
        }
        
        .ripple {
            position: fixed;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(251,191,36,0.6), transparent);
            pointer-events: none;
            animation: rippleAnim 0.5s ease-out forwards;
            z-index: 90;
        }
        
        .streak-indicator {
            position: fixed;
            bottom: 180px;
            right: 10px;
            background: rgba(0,0,0,0.85);
            padding: 8px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: bold;
            color: #ffaa44;
            z-index: 30;
        }
        
        /* ==================== ESTILOS DEL MINIJUEGO JUMP ==================== */
        .jump-container {
            position: fixed;

    let t = translations.es;
    
    function updateLanguage() {
        t = translations[currentLang];

        updateDailyMissionsUI();
    }

    // ==================== SISTEMA DE USUARIO ====================
    let currentUser = null;
    
    function createDefaultUser(nickname) {
        return {
            userId: Date.now().toString(),
            nickname: nickname,
            createdAt: Date.now(),
            lastLogin: Date.now(),
            dailyStreak: 1,
            lastPlayDate: new Date().toDateString(),
            language: 'es',
            resources: {
                coins: 500,
                tokens: 100
            },
            clicker: {
                level: 1,
                tapPower: 1,
                energy: 100,
                maxEnergy: 100,
                combo: 0,
                bestCombo: 0,
                totalTaps: 0,
                totalMice: 0,
                totalCrits: 0,
                activePet: null
            },
            jump: {
                bestScore: 0,
                totalJumps: 0
            },
            inventory: {
                skins: [{ id: 'original', name: 'Original', unlocked: true, equipped: true }],
                pets: [],
                skills: { strength: 0, energy: 0, luck: 0, economy: 0 },
                powerups: { shield: 0, magnet: 0, double: 0 }
            },
            dailyMissions: {
                date: new Date().toDateString(),
                missions: [],
                completed: []
            },
            achievements: {
                taps100: false, taps500: false, taps1000: false,
                mice50: false, mice200: false, combo20: false,
                level10: false, crits100: false
            }
        };
    }
    
    function saveUser() {
        if(currentUser) {
            localStorage.setItem('billyUser_' + currentUser.userId, JSON.stringify(currentUser));
            localStorage.setItem('billyCurrentUser', currentUser.userId);
        }
    }
    
    function loadUser(userId) {
        const saved = localStorage.getItem('billyUser_' + userId);
        if(saved) {
            currentUser = JSON.parse(saved);
            return true;
        }
        return false;
    }
    
    function getAllNicknames() {
        const nicknames = [];
        for(let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if(key && key.startsWith('billyUser_')) {
                try {
                    const user = JSON.parse(localStorage.getItem(key));
                    nicknames.push(user.nickname);
                } catch(e) {}
            }
        }
        return nicknames;
    }
    
    function registerUser(nickname) {
        if(nickname.length < 3) {
            document.getElementById('registerError').textContent = t.needMoreChars;
            return false;
        }
        const existingNicknames = getAllNicknames();
        if(existingNicknames.includes(nickname)) {
            document.getElementById('registerError').textContent = t.nicknameExists;
            return false;
        }
        currentUser = createDefaultUser(nickname);
        saveUser();
        document.getElementById('registerError').textContent = '';
        return true;
    }
    
    // ==================== MISIONES DIARIAS ====================
    function generateDailyMissions() {
        const today = new Date().toDateString();
        if(!currentUser.dailyMissions || currentUser.dailyMissions.date !== today) {
            currentUser.dailyMissions = {
                date: today,
                missions: [
                    { id: 'tap', type: 'tap', target: 50, progress: 0, reward: 100, completed: false },
                    { id: 'mice', type: 'mice', target: 20, progress: 0, reward: 150, completed: false },
                    { id: 'combo', type: 'combo', target: 15, progress: 0, reward: 200, completed: false }
                ],
                completed: []
            };
            saveUser();
        }
        updateDailyMissionsUI();
    }
    
    function updateDailyMissionsUI() {
        const container = document.getElementById('missionsList');
        if(!container || !currentUser?.dailyMissions?.missions) return;
        
        container.innerHTML = currentUser.dailyMissions.missions.map(mission => `
            <div class="mission-item">
                <div>
                    <div class="mission-name">
                        ${mission.type === 'tap' ? '👆' : mission.type === 'mice' ? '🐭' : '🔥'} 
                        ${mission.type === 'tap' ? t.missionTap.replace('{count}', mission.target) :
                          mission.type === 'mice' ? t.missionMice.replace('{count}', mission.target) :
                          t.missionCombo.replace('{count}', mission.target)}
                    </div>
                    <div class="mission-reward">${t.reward}: ${mission.reward} 🪙</div>
                </div>
                <div>
                    ${mission.completed ? 
                        `<span class="mission-completed">${t.completed}</span>` :
                        `<span class="mission-progress">${mission.progress}/${mission.target}</span>`
                    }
                </div>
            </div>
        `).join('');
    }
    
    function updateMissionProgress(type, amount = 1) {
        if(!currentUser) return;
        const today = new Date().toDateString();
        if(currentUser.dailyMissions.date !== today) generateDailyMissions();
        
        currentUser.dailyMissions.missions.forEach(mission => {
            if(mission.type === type && !mission.completed) {
                mission.progress += amount;
                if(mission.progress >= mission.target) {
                    mission.completed = true;
                    currentUser.resources.coins += mission.reward;
                    showNotification(`🎉 Misión completada! +${mission.reward} ${t.coins}`, "achievement");
                }
            }
        });
        updateDailyMissionsUI();
        updateMenuResources();
        saveUser();
    }
    
    // ==================== RACHA DIARIA ====================
    function checkDailyStreak() {
        const today = new Date().toDateString();
        const lastPlay = currentUser.lastPlayDate;
        if(lastPlay !== today) {
            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);
            if(lastPlay === yesterday.toDateString()) {
                currentUser.dailyStreak++;
                const bonus = 50 + (currentUser.dailyStreak * 10);
                currentUser.resources.coins += bonus;
                showNotification(t.dailyBonus.replace('{days}', currentUser.dailyStreak).replace('{bonus}', bonus), "achievement");
            } else {
                currentUser.dailyStreak = 1;
            }
            currentUser.lastPlayDate = today;
            saveUser();
        }
        document.getElementById('userStreak').textContent = currentUser.dailyStreak;
        updateMenuResources();
    }
    
    // ==================== FUNCIONES DE UI ====================
    function updateMenuResources() {
        if(currentUser) {
            document.getElementById('menuCoins').textContent = Math.floor(currentUser.resources.coins);
            document.getElementById('menuTokens').textContent = Math.floor(currentUser.resources.tokens);
            document.getElementById('userNickname').textContent = currentUser.nickname;
            document.getElementById('userLevel').textContent = currentUser.clicker.level;
            document.getElementById('userStreak').textContent = currentUser.dailyStreak;
        }
    }
    
    function showNotification(msg, type = "normal") {
        const div = document.createElement('div');
        div.className = `notification ${type}`;
        div.textContent = msg;
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 1500);
    }

                        <div class="item-info"><div class="item-name">🔥 ${t.elite}</div><div class="item-desc">Billy élite</div><div class="item-price">${t.priceTokens.replace('{price}', 1500)}</div></div>
                        <button class="shop-btn">${currentUser.inventory.skins.find(s => s.id === 'elite')?.unlocked ? (currentUser.inventory.skins.find(s => s.id === 'elite')?.equipped ? t.equipped : t.equip) : t.buy}</button>

                    <div class="shop-item" onclick="upgradeSkill('luck')"><div class="item-info"><div class="item-name">🍀 ${t.skillLuck}</div><div class="item-desc">${t.skillLuckDesc} (${currentUser.inventory.skills.luck}/5)</div></div><button class="shop-btn">${currentUser.inventory.skills.luck >= 5 ? t.maxLevel : `${t.upgrade} (${[50,100,200,400,600][currentUser.inventory.skills.luck]} BILLY)`}</button></div>
                    <div class="shop-item" onclick="upgradeSkill('economy')"><div class="item-info"><div class="item-name">💰 ${t.skillEconomy}</div><div class="item-desc">${t.skillEconomyDesc} (${currentUser.inventory.skills.economy}/5)</div></div><button class="shop-btn">${currentUser.inventory.skills.economy >= 5 ? t.maxLevel : `${t.upgrade} (${[40,80,150,300,500][currentUser.inventory.skills.economy]} BILLY)`}</button></div>

                    <div class="shop-item" onclick="buyPowerup('magnet')"><div class="item-info"><div class="item-name">🧲 ${t.powerupMagnet}</div><div class="item-desc">${t.powerupMagnetDesc}</div><div class="item-price">${t.priceTokens.replace('{price}', 150)}</div></div><button class="shop-btn">${t.buy} (${currentUser.inventory.powerups.magnet || 0})</button></div>
                    <div class="shop-item" onclick="buyPowerup('double')"><div class="item-info"><div class="item-name">✨ ${t.powerupDouble}</div><div class="item-desc">${t.powerupDoubleDesc}</div><div class="item-price">${t.priceTokens.replace('{price}', 200)}</div></div><button class="shop-btn">${t.buy} (${currentUser.inventory.powerups.double || 0})</button></div>

                sections[tab.dataset.tab].classList.add('active');

    function buySkin(skinId) {
        const skinPrices = { golden: 500, elite: 1500 };
        const existing = currentUser.inventory.skins.find(s => s.id === skinId);
        if(existing) {
            if(!existing.equipped) {
                currentUser.inventory.skins.forEach(s => s.equipped = false);
                existing.equipped = true;
                showNotification(`${skinId} ${t.equipped}`, "achievement");
                saveUser();
                document.querySelector('.modal')?.remove();
                openShop();
                updateBillySkin();
            }
        } else {
            if(currentUser.resources.tokens >= skinPrices[skinId]) {
                currentUser.resources.tokens -= skinPrices[skinId];
                currentUser.inventory.skins.forEach(s => s.equipped = false);
                currentUser.inventory.skins.push({ id: skinId, name: skinId, unlocked: true, equipped: true });
                showNotification(`${skinId} ${t.buy}ed!`, "achievement");
                saveUser();
                updateMenuResources();
                document.querySelector('.modal')?.remove();
                openShop();
                updateBillySkin();
            } else {
                showNotification(t.notEnoughTokens);
            }
        }
    }
    
    function updateBillySkin() {
        const equippedSkin = currentUser.inventory.skins.find(s => s.equipped);
        const billyImg = document.getElementById('billyMoodImg');
        if(equippedSkin?.id === 'golden') {
            billyImg.style.filter = "drop-shadow(0 0 15px gold)";
        } else if(equippedSkin?.id === 'elite') {
            billyImg.style.filter = "drop-shadow(0 0 15px #ff6b6b)";
        } else {
            billyImg.style.filter = "drop-shadow(0 8px 15px rgba(0,0,0,0.4))";
        }
    }
    
    function buyPet(petId) {
        const petPrices = { dog: 300, owl: 400, bee: 250, dragon: 1000 };
        if(currentUser.inventory.pets.includes(petId)) {
            currentUser.clicker.activePet = petId;
            showNotification(`${petId} ${t.equipped}`, "pet");
            saveUser();
            document.querySelector('.modal')?.remove();
            openShop();
            startPetEffects();
            updatePetFollower();
        } else {
            if(currentUser.resources.tokens >= petPrices[petId]) {
                currentUser.resources.tokens -= petPrices[petId];
                currentUser.inventory.pets.push(petId);
                currentUser.clicker.activePet = petId;
                showNotification(`${petId} ${t.buy}ed!`, "achievement");
                saveUser();
                updateMenuResources();
                document.querySelector('.modal')?.remove();
                openShop();
                startPetEffects();
                updatePetFollower();
            } else {
                showNotification(t.notEnoughTokens);
            }
        }
    }
    
    function upgradeSkill(skillId) {
        const costs = { strength: [40,80,150,300,500], energy: [30,60,120,250,400], luck: [50,100,200,400,600], economy: [40,80,150,300,500] };
        const currentLevel = currentUser.inventory.skills[skillId];
        if(currentLevel < 5) {
            const cost = costs[skillId][currentLevel];
            if(currentUser.resources.tokens >= cost) {
                currentUser.resources.tokens -= cost;
                currentUser.inventory.skills[skillId]++;
                showNotification(`${skillId} ${t.upgrade} a nivel ${currentUser.inventory.skills[skillId]}!`, "achievement");
                saveUser();
                updateMenuResources();
                document.querySelector('.modal')?.remove();
                openShop();
                updateClickerStats();
            } else {
                showNotification(t.notEnoughTokens);
            }
        }
    }
    
    function buyPowerup(powerupId) {
        const prices = { shield: 100, magnet: 150, double: 200 };
        if(currentUser.resources.tokens >= prices[powerupId]) {
            currentUser.resources.tokens -= prices[powerupId];
            currentUser.inventory.powerups[powerupId]++;
            showNotification(`1x ${powerupId} ${t.buy}ed!`, "achievement");
            saveUser();
            updateMenuResources();
            document.querySelector('.modal')?.remove();
            openShop();
        } else {
            showNotification(t.notEnoughTokens);
        }
    }
    
    // ==================== PERFIL Y ESTADÍSTICAS ====================
    function openProfile() {
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="modal-content">
                <h2>👤 ${t.profile}</h2>
                <div class="profile-stats">
                    <div class="stat-row"><span>🐱 Nickname:</span><span>${currentUser.nickname}</span></div>
                    <div class="stat-row"><span>🆔 ID:</span><span>${currentUser.userId.slice(-6)}</span></div>
                    <div class="stat-row"><span>📅 Registro:</span><span>${new Date(currentUser.createdAt).toLocaleDateString()}</span></div>
                    <div class="stat-row"><span>🔥 Racha diaria:</span><span>${currentUser.dailyStreak} días</span></div>
                    <div class="stat-row"><span>👆 Toques totales:</span><span>${currentUser.clicker.totalTaps}</span></div>
                    <div class="stat-row"><span>🐭 Ratones atrapados:</span><span>${currentUser.clicker.totalMice}</span></div>
                    <div class="stat-row"><span>⚡ Mejor combo:</span><span>${currentUser.clicker.bestCombo}</span></div>
                    <div class="stat-row"><span>🦘 Mejor Jump:</span><span>${currentUser.jump.bestScore}</span></div>
                </div>
                <div class="change-nick">
                    <input type="text" id="newNickname" placeholder="Nuevo nickname" maxlength="15">
                    <button class="shop-btn" id="changeNickBtn">${t.changeNickname} (500 BILLY)</button>
                </div>
                <button class="close-modal" onclick="this.closest('.modal').remove()">${t.close}</button>
            </div>
        `;
        document.body.appendChild(modal);
        
        document.getElementById('changeNickBtn').onclick = () => {
            const newNick = document.getElementById('newNickname').value.trim();
            if(newNick.length < 3) {
                showNotification(t.needMoreChars);
                return;
            }
            if(getAllNicknames().includes(newNick) && newNick !== currentUser.nickname) {
                showNotification(t.nicknameExists);
                return;
            }
            if(currentUser.resources.tokens >= 500) {
                currentUser.resources.tokens -= 500;
                currentUser.nickname = newNick;
                saveUser();
                updateMenuResources();
                showNotification(t.nicknameChanged.replace('{name}', newNick), "achievement");
                modal.remove();
            } else {
                showNotification(t.notEnoughTokens);
            }
        };

    function openStats() {
        const critRate = currentUser.clicker.totalTaps > 0 ? ((currentUser.clicker.totalCrits / currentUser.clicker.totalTaps) * 100).toFixed(1) : 0;
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="modal-content">
                <h2>📊 ${t.stats}</h2>
                <div class="profile-stats">
                    <div class="stat-row"><span>${t.totalTaps}:</span><span>${currentUser.clicker.totalTaps}</span></div>
                    <div class="stat-row"><span>${t.totalMice}:</span><span>${currentUser.clicker.totalMice}</span></div>
                    <div class="stat-row"><span>${t.totalCrits}:</span><span>${currentUser.clicker.totalCrits}</span></div>
                    <div class="stat-row"><span>${t.critRate || 'Tasa crítica'}:</span><span>${critRate}%</span></div>
                    <div class="stat-row"><span>${t.bestCombo}:</span><span>${currentUser.clicker.bestCombo}</span></div>
                    <div class="stat-row"><span>${t.jumpBest}:</span><span>${currentUser.jump.bestScore}</span></div>
                    <div class="stat-row"><span>🏆 ${t.achievements}:</span><span></span></div>
                    <div class="stat-row"><span>  100 taps:</span><span>${currentUser.achievements.taps100 ? '✅' : '❌'}</span></div>
                    <div class="stat-row"><span>  500 taps:</span><span>${currentUser.achievements.taps500 ? '✅' : '❌'}</span></div>
                    <div class="stat-row"><span>  1000 taps:</span><span>${currentUser.achievements.taps1000 ? '✅' : '❌'}</span></div>
                    <div class="stat-row"><span>  50 ratones:</span><span>${currentUser.achievements.mice50 ? '✅' : '❌'}</span></div>
                    <div class="stat-row"><span>  200 ratones:</span><span>${currentUser.achievements.mice200 ? '✅' : '❌'}</span></div>
                    <div class="stat-row"><span>  Combo 20:</span><span>${currentUser.achievements.combo20 ? '✅' : '❌'}</span></div>
                    <div class="stat-row"><span>  Nivel 10:</span><span>${currentUser.achievements.level10 ? '✅' : '❌'}</span></div>
                    <div class="stat-row"><span>  100 críticos:</span><span>${currentUser.achievements.crits100 ? '✅' : '❌'}</span></div>
                </div>
                <button class="close-modal" onclick="this.closest('.modal').remove()">${t.close}</button>
            </div>
        `;
        document.body.appendChild(modal);
    }
    
    // ==================== ACTUALIZAR ESTADO DE ÁNIMO DE BILLY ====================
    function updateBillyMood(combo, energy) {
        const billyImg = document.getElementById('billyMoodImg');
        if(!billyImg) return;
        
        if(combo >= 15) {
            billyImg.src = 'billy_happy.png';
            document.getElementById('billy').classList.add('billy-golden');
        } else if(energy <= 20) {
            billyImg.src = 'billy_Triste.png';
            document.getElementById('billy').classList.remove('billy-golden');
        } else if(combo <= 2 && energy > 50) {
            billyImg.src = 'billy_Enfadado.png';
            document.getElementById('billy').classList.remove('billy-golden');
        } else {
            billyImg.src = 'billy_happy.png';
            document.getElementById('billy').classList.remove('billy-golden');
        }
        
        billyImg.onerror = function() {
            this.src = 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%23FFD966%22/%3E%3Ctext x=%2250%22 y=%2270%22 text-anchor=%22middle%22 fill=%22%23FFA500%22 font-size=%2240%22%3E🐱%3C/text%3E%3C/svg%3E';
        };
    }
    
    // ==================== INICIALIZACIÓN ====================
    function generateStars() {
        const starsDiv = document.getElementById('stars');
        for(let i = 0; i < 150; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.width = star.style.height = (1 + Math.random() * 2) + 'px';
            star.style.animationDelay = Math.random() * 2 + 's';
            starsDiv.appendChild(star);
        }
    }
    generateStars();
    
    // Eventos de navegación
    document.getElementById('registerBtn').onclick = () => {
        const nickname = document.getElementById('nicknameInput').value.trim();
        if(registerUser(nickname)) {
            showNotification(t.registered.replace('{name}', nickname), "achievement");
            document.getElementById('registerScreen').style.display = 'none';
            document.getElementById('mainMenu').style.display = 'flex';
            updateMenuResources();
            generateDailyMissions();
            checkDailyStreak();
            updateBillyMood(0, 100);
        }
    };
    
    document.getElementById('selectClickerBtn').onclick = () => {
        document.getElementById('mainMenu').style.display = 'none';
        document.getElementById('clickerContainer').classList.add('active');
        if(typeof startClickerGame === 'function') startClickerGame();
    };
    
    document.getElementById('selectJumpBtn').onclick = () => {
        document.getElementById('mainMenu').style.display = 'none';
        document.getElementById('jumpContainer').classList.add('active');
        if(typeof startJumpGame === 'function') startJumpGame();
    };
    
    document.getElementById('clickerBackBtn').onclick = () => {
        document.getElementById('clickerContainer').classList.remove('active');
        document.getElementById('mainMenu').style.display = 'flex';
        if(typeof saveClickerGame === 'function') saveClickerGame();
        updateMenuResources();
        checkDailyStreak();
    };
    
    document.getElementById('jumpBackBtn').onclick = () => {
        document.getElementById('jumpContainer').classList.remove('active');
        document.getElementById('mainMenu').style.display = 'flex';
        updateMenuResources();
        checkDailyStreak();
    };
    
    document.getElementById('shopBtn').onclick = openShop;
    document.getElementById('profileBtn').onclick = openProfile;
    document.getElementById('statsBtn').onclick = openStats;
    document.getElementById('langEsBtn').onclick = () => { currentLang = 'es'; t = translations.es; updateLanguage(); };
    document.getElementById('langEnBtn').onclick = () => { currentLang = 'en'; t = translations.en; updateLanguage(); };
    
    // Verificar si hay usuario guardado
    const savedUserId = localStorage.getItem('billyCurrentUser');
    if(savedUserId && loadUser(savedUserId)) {
        document.getElementById('registerScreen').style.display = 'none';
        document.getElementById('mainMenu').style.display = 'flex';
        updateMenuResources();
        generateDailyMissions();
        checkDailyStreak();
    }
    
    // Exponer funciones globales
    window.updateMissionProgress = updateMissionProgress;
    window.getUser = () => currentUser;
    window.saveUser = saveUser;
    window.showNotification = showNotification;
    window.updateBillyMood = updateBillyMood;
    window.buySkin = buySkin;
    window.buyPet = buyPet;
    window.upgradeSkill = upgradeSkill;
    window.buyPowerup = buyPowerup;
    window.t = t;
</script>

<script>
    // ==================== JUEGO CLICKER COMPLETO ====================
    let clickerGameActive = false;
    let clickerCoins = 0, clickerTokens = 0, clickerLevel = 1, clickerTapPower = 1;
    let clickerEnergy = 100, clickerMaxEnergy = 100, clickerCombo = 0, clickerBestCombo = 0;
    let clickerTotalTaps = 0, clickerTotalMice = 0, clickerTotalCrits = 0;
    let clickerSuperCombo = false, clickerGoldenHour = false, clickerDoubleEvent = false;
    let clickerComboTimer = null, clickerMouseStreak = 0;
    let clickerMice = [], clickerBubbles = [];
    let clickerTargetX = window.innerWidth/2, clickerTargetY = window.innerHeight/2;
    let clickerBillyX = window.innerWidth/2, clickerBillyY = window.innerHeight/2;
    let clickerPetIntervals = [];
    let noCritCounter = 0;
    
    // Desafíos
    let clickerChallenges = { mice: 0, crits: 0, maxCombo: 0 };
    const weeklyRewards = { mice: 25, crits: 15, combo: 12 };
    
    function getSkillBonus() {
        if(!currentUser) return { strength:0, energy:0, luck:0, economy:0 };
        return currentUser.inventory.skills;
    }
    
    function getActivePet() {
        return currentUser?.clicker.activePet || null;
    }
    
    function getPetEffect(petId) {
        const effects = { dog: [0.3,0.6,1.0], owl: [5,10,15], bee: [5,12,25], dragon: [1.05,1.10,1.20] };
        const petLevel = currentUser?.inventory.pets.includes(petId) ? 1 : 0;
        return effects[petId]?.[petLevel] || 0;
    }
    
    function loadClickerData() {
        if(currentUser) {
            clickerCoins = currentUser.resources.coins;
            clickerTokens = currentUser.resources.tokens;
            clickerLevel = currentUser.clicker.level;
            clickerTapPower = currentUser.clicker.tapPower;
            clickerEnergy = currentUser.clicker.energy;
            clickerMaxEnergy = currentUser.clicker.maxEnergy;
            clickerBestCombo = currentUser.clicker.bestCombo;
            clickerTotalTaps = currentUser.clicker.totalTaps;
            clickerTotalMice = currentUser.clicker.totalMice;
            clickerTotalCrits = currentUser.clicker.totalCrits;
            
            const skills = getSkillBonus();
            clickerMaxEnergy = 100 + Math.floor(clickerLevel / 2) * 5 + (skills.energy * 20);
            if(clickerEnergy > clickerMaxEnergy) clickerEnergy = clickerMaxEnergy;
        }
        updateClickerUI();
    }
    
    function saveClickerData() {
        if(currentUser) {
            currentUser.resources.coins = clickerCoins;
            currentUser.resources.tokens = clickerTokens;
            currentUser.clicker.level = clickerLevel;
            currentUser.clicker.tapPower = clickerTapPower;
            currentUser.clicker.energy = clickerEnergy;
            currentUser.clicker.maxEnergy = clickerMaxEnergy;
            currentUser.clicker.bestCombo = clickerBestCombo;
            currentUser.clicker.totalTaps = clickerTotalTaps;
            currentUser.clicker.totalMice = clickerTotalMice;
            currentUser.clicker.totalCrits = clickerTotalCrits;
            saveUser();
        }
    }
    
    function updateClickerStats() {
        const skills = getSkillBonus();
        clickerMaxEnergy = 100 + Math.floor(clickerLevel / 2) * 5 + (skills.energy * 20);
        updateClickerUI();
    }
    
    function updateClickerUI() {
        document.getElementById('clickerCoins').textContent = Math.floor(clickerCoins);
        document.getElementById('clickerLevel').textContent = clickerLevel;
        document.getElementById('clickerTapPower').textContent = clickerTapPower;
        document.getElementById('clickerCombo').textContent = clickerCombo;
        document.getElementById('clickerEnergy').textContent = Math.floor(clickerEnergy);
        document.getElementById('clickerMaxEnergy').textContent = clickerMaxEnergy;
        document.getElementById('clickerEnergyFill').style.width = (clickerEnergy / clickerMaxEnergy * 100) + '%';
        document.getElementById('clickerTokens').textContent = Math.floor(clickerTokens);
        document.getElementById('clickerBestCombo').textContent = clickerBestCombo;
        
        // Actualizar panel de mascota
        const petPanel = document.getElementById('petPanel');
        const activePet = getActivePet();
        if(activePet) {
            const petNames = { dog: '🐕 Perro', owl: '🦉 Búho', bee: '🐝 Abeja', dragon: '🐉 Dragón' };
            petPanel.innerHTML = `<span>${petNames[activePet]}</span>`;
        } else {
            petPanel.innerHTML = `<span>🐾 Mascota</span>`;
        }
        
        // Actualizar desafíos
        const challengesPanel = document.getElementById('clickerChallenges');
        if(challengesPanel) {
            challengesPanel.innerHTML = `
                <div class="challenge-item">🐭 ${clickerChallenges.mice}/${weeklyRewards.mice}</div>
                <div class="challenge-item">⚡ ${clickerChallenges.crits}/${weeklyRewards.crits}</div>
                <div class="challenge-item">🔥 ${clickerChallenges.maxCombo}/${weeklyRewards.combo}</div>
            `;
        }
        
        updateBillyMood(clickerCombo, clickerEnergy);
    }
    
    function checkAchievements() {
        let newAchievement = false;
        if(!currentUser.achievements.taps100 && clickerTotalTaps >= 100) {
            currentUser.achievements.taps100 = true;
            currentUser.resources.tokens += 100;
            newAchievement = true;
            showNotification("🏆 100 taps! +100 BILLY", "achievement");
        }
        if(!currentUser.achievements.taps500 && clickerTotalTaps >= 500) {
            currentUser.achievements.taps500 = true;
            currentUser.resources.tokens += 300;
            newAchievement = true;
            showNotification("🏆 500 taps! +300 BILLY", "achievement");
        }
        if(!currentUser.achievements.taps1000 && clickerTotalTaps >= 1000) {

    function tapBillyClicker(event) {
        if(!clickerGameActive) return;
        if(clickerEnergy <= 0) {
            showNotification("💤 Sin energía! Espera un momento");
            return;
        }
        
        // Racha rápida
        const now = Date.now();
        if(window.lastTapTime && now - window.lastTapTime < 800) {
            window.quickTapStreak = (window.quickTapStreak || 0) + 1;
            if(window.quickTapStreak > 10) window.quickTapStreak = 10;
        } else {
            window.quickTapStreak = 1;
        }
        window.lastTapTime = now;
        const streakBonus = 1 + ((window.quickTapStreak || 1) * 0.05);
        
        if(window.quickTapStreak >= 5 && window.quickTapStreak % 5 === 0) {
            currentUser.resources.tokens += window.quickTapStreak * 5;
            showNotification(`🔥 Racha rápida! +${window.quickTapStreak * 5} BILLY`, "achievement");
        }
        
        clickerCombo++;
        if(clickerCombo > clickerBestCombo) {
            clickerBestCombo = clickerCombo;
            if(clickerCombo > clickerChallenges.maxCombo) clickerChallenges.maxCombo = clickerCombo;
        }
        clickerTotalTaps++;
        
        const skills = getSkillBonus();
        const activePet = getActivePet();
        
        let critChance = 10 + skills.luck * 2 + Math.floor(clickerCombo / 3);
        if(activePet === 'owl') critChance += 10;
        
        if(noCritCounter >= 8) {
            critChance = 100;
            noCritCounter = 0;
            showNotification("💥 ¡CRÍTICO GARANTIZADO!", "crit");
        }
        
        const isCrit = Math.random() * 100 < critChance;
        if(isCrit) {
            noCritCounter = 0;
            clickerTotalCrits++;
            clickerChallenges.crits++;
        } else {
            noCritCounter++;
        }
        
        let gain = clickerTapPower * (isCrit ? 3 : 1) * (1 + clickerCombo * 0.02) * streakBonus;
        gain *= (1 + skills.strength * 0.05);
        gain *= (1 + skills.economy * 0.1);
        if(activePet === 'dragon') gain *= 1.1;
        if(clickerSuperCombo) gain *= 1.5;
        if(clickerDoubleEvent) gain *= 2;
        gain = Math.floor(Math.max(1, gain));
        
        clickerCoins += gain;
        clickerTokens += Math.floor(gain / 10);
        
        let energyCost = Math.max(1, Math.floor(clickerCombo / 10));
        clickerEnergy = Math.max(0, clickerEnergy - energyCost);
        
        updateClickerUI();
        updateMissionProgress('tap');
        
        if(clickerComboTimer) clearTimeout(clickerComboTimer);
        clickerComboTimer = setTimeout(() => {
            if(clickerCombo >= 3) showNotification(`🔥 Combo de ${clickerCombo} perdido!`);
            clickerCombo = 0;
            clickerSuperCombo = false;
            updateClickerUI();
        }, 2000);
        
        if(clickerCombo >= 12 && !clickerSuperCombo) {
            clickerSuperCombo = true;
            showNotification("✨ SUPER COMBO ACTIVADO! x1.5 ✨");
            setTimeout(() => { clickerSuperCombo = false; }, 5000);
        }
        
        const billyDiv = document.getElementById('billy');
        billyDiv.style.transform = 'scale(0.92)';
        setTimeout(() => billyDiv.style.transform = 'scale(1)', 100);
        
        const clickX = event.clientX || (event.touches ? event.touches[0].clientX : clickerBillyX);
        const clickY = event.clientY || (event.touches ? event.touches[0].clientY : clickerBillyY);
        
        createRipple(clickX, clickY);
        createParticles(clickX, clickY, isCrit ? '#FFD966' : '#A5F0A0');
        createFloatingNumber(gain, clickX, clickY, isCrit);
        
        let neededCoins = 100 * Math.pow(1.28, clickerLevel - 1);
        if(clickerCoins >= neededCoins) {
            clickerLevel++;
            clickerMaxEnergy = 100 + Math.floor(clickerLevel / 2) * 5 + (skills.energy * 20);
            clickerEnergy = Math.min(clickerMaxEnergy, clickerEnergy + 40);
            showNotification(`🎉 NIVEL ${clickerLevel}! +40 energía 🎉`, "achievement");
            updateClickerUI();
            checkAchievements();
        }
        
        checkAchievements();
        updateChallenges();
        saveClickerData();
        updateMenuResources();
        
        playSound(isCrit ? 880 : 660);
    }
    
    function playSound(freq) {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.frequency.value = freq;
            gainNode.gain.value = 0.08;
            osc.start();
            gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.2);
            osc.stop(audioCtx.currentTime + 0.2);
        } catch(e) {}
    }
    
    function createRipple(x, y) {
        const ripple = document.createElement('div');
        ripple.className = 'ripple';
        ripple.style.left = (x - 35) + 'px';
        ripple.style.top = (y - 35) + 'px';
        ripple.style.width = '70px';
        ripple.style.height = '70px';
        document.body.appendChild(ripple);
        setTimeout(() => ripple.remove(), 500);
    }
    
    function createParticles(x, y, color) {
        for(let i = 0; i < 10; i++) {
            const particle = document.createElement('div');
            particle.style.cssText = `position:fixed;left:${x}px;top:${y}px;width:6px;height:6px;background:${color};border-radius:50%;pointer-events:none;z-index:100;`;
            const angle = Math.random() * Math.PI * 2;
            const speed = 2 + Math.random() * 4;
            let vx = Math.cos(angle) * speed;
            let vy = Math.sin(angle) * speed - 2;
            let life = 30;
            document.body.appendChild(particle);
            function animate() {
                life--;
                if(life <= 0) { particle.remove(); return; }
                particle.style.left = (parseFloat(particle.style.left) + vx) + 'px';
                particle.style.top = (parseFloat(particle.style.top) + vy) + 'px';
                particle.style.opacity = life / 30;
                requestAnimationFrame(animate);
            }
            animate();
        }
    }
    
    function createFloatingNumber(value, x, y, isCrit) {
        const div = document.createElement('div');
        div.className = 'floating-number';
        div.textContent = `+${Math.floor(value)}`;
        div.style.left = x + 'px';
        div.style.top = y + 'px';
        div.style.color = isCrit ? '#FFD966' : 'white';
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 700);
    }
    
    function spawnMouse() {
        if(!clickerGameActive || clickerMice.length > 10) return;
        const rand = Math.random();
        let isGolden = clickerGoldenHour ? true : rand < 0.12;
        let isBoss = !isGolden && rand < 0.2 && clickerLevel >= 3;
        
        const size = isBoss ? 65 : 42;
        const yPos = 100 + Math.random() * (window.innerHeight - 200);
        const fromLeft = Math.random() < 0.5;
        const xStart = fromLeft ? -60 : window.innerWidth + 60;
        const dir = fromLeft ? 1 : -1;
        const skills = getSkillBonus();
        let valueMulti = isBoss ? 12 : (isGolden ? 7 : 2.5);
        const value = Math.floor(clickerTapPower * valueMulti * (1 + skills.economy * 0.1));
        
        clickerMice.push({ x: xStart, y: yPos, size, dir, speed: isBoss ? 1 : 1.5 + Math.random() * 0.8, isGolden, isBoss, value });
    }
    
    function updateMice() {
        for(let i = clickerMice.length - 1; i >= 0; i--) {
            clickerMice[i].x += clickerMice[i].speed * clickerMice[i].dir;
            if((clickerMice[i].dir === 1 && clickerMice[i].x > window.innerWidth + 100) || 
               (clickerMice[i].dir === -1 && clickerMice[i].x < -100)) {
                clickerMice.splice(i, 1);
            }
        }
    }
    
    function catchMouse(index, x, y) {
        if(index >= clickerMice.length) return;
        const m = clickerMice[index];
        const gain = Math.floor(m.value);
        clickerCoins += gain;
        clickerTotalMice++;
        clickerChallenges.mice++;
        clickerMouseStreak++;
        
        if(clickerMouseStreak >= 3) {
            let bonus = Math.floor(gain * 0.4);
            clickerCoins += bonus;
            createFloatingNumber(bonus, x, y - 30, false);
            showNotification("🐱 ¡Racha de ratones! +bonus");
            clickerMouseStreak = 0;
        }
        
        createParticles(x, y, m.isGolden ? '#FFD966' : '#F59E0B');
        createFloatingNumber(gain, x, y, m.isGolden);
        clickerTokens += Math.floor(gain / 10);
        
        updateClickerUI();
        updateMissionProgress('mice');
        updateChallenges();
        checkAchievements();
        
        clickerMice.splice(index, 1);
        renderClickerEntities();
        saveClickerData();
        updateMenuResources();
    }
    
    function spawnBubble() {
        if(!clickerGameActive || clickerBubbles.length > 6) return;
        const size = 45 + Math.random() * 30;
        const skills = getSkillBonus();
        clickerBubbles.push({
            x: 40 + Math.random() * (window.innerWidth - size - 40),
            y: 120 + Math.random() * (window.innerHeight - 240),
            size,
            value: Math.floor(clickerTapPower * (2 + Math.random() * 3) * (1 + skills.economy * 0.1)),
            life: 8000, created: Date.now()
        });
    }
    
    function catchBubble(index, x, y) {
        if(index >= clickerBubbles.length) return;
        const b = clickerBubbles[index];
        clickerCoins += b.value;
        createParticles(x, y, '#FFD966');
        createFloatingNumber(b.value, x, y, true);
        clickerTokens += Math.floor(b.value / 10);
        updateClickerUI();
        clickerBubbles.splice(index, 1);
        renderClickerEntities();
        saveClickerData();
        updateMenuResources();
    }
    
    function renderClickerEntities() {
        const container = document.getElementById('gameArea');
        const existing = container.querySelectorAll('.game-entity');
        existing.forEach(el => el.remove());
        
        clickerMice.forEach((m, idx) => {
            const div = document.createElement('div');
            div.className = `game-entity ${m.isBoss ? 'mouse-boss' : (m.isGolden ? 'mouse-golden' : 'mouse-normal')}`;
            div.style.cssText = `left:${m.x - m.size/2}px;top:${m.y - m.size/2}px;width:${m.size}px;height:${m.size}px;font-size:${m.size/2.2}px;`;
            div.textContent = m.isBoss ? '🐀👑' : (m.isGolden ? '🐭✨' : '🐭');
            div.dataset.type = 'mouse';
            div.dataset.idx = idx;
            container.appendChild(div);
        });
        
        clickerBubbles.forEach((b, idx) => {
            const div = document.createElement('div');
            div.className = 'game-entity bubble';
            div.style.cssText = `left:${b.x - b.size/2}px;top:${b.y - b.size/2}px;width:${b.size}px;height:${b.size}px;font-size:${b.size/2}px;`;
            div.textContent = '🎁';
            div.dataset.type = 'bubble';
            div.dataset.idx = idx;
            container.appendChild(div);
        });
    }
    
    function updateBillyPosition() {
        if(!clickerGameActive) return;
        clickerBillyX += (clickerTargetX - clickerBillyX) * 0.12;
        clickerBillyY += (clickerTargetY - clickerBillyY) * 0.12;
        const billy = document.getElementById('billy');
        billy.style.left = (clickerBillyX - billy.offsetWidth/2) + 'px';
        billy.style.top = (clickerBillyY - billy.offsetHeight/2) + 'px';
        
        const activePet = getActivePet();
        if(activePet) {
            const follower = document.getElementById('petFollower');
            const petEmojis = { dog: '🐕', owl: '🦉', bee: '🐝', dragon: '🐉' };
            follower.textContent = petEmojis[activePet];
            follower.style.left = (clickerBillyX - 45) + 'px';
            follower.style.top = (clickerBillyY - 35) + 'px';
            follower.style.display = 'block';
        } else {
            document.getElementById('petFollower').style.display = 'none';
        }
        
        requestAnimationFrame(updateBillyPosition);
    }
    
    function startPetEffects() {
        clickerPetIntervals.forEach(clearInterval);
        clickerPetIntervals = [];
        const activePet = getActivePet();
        if(!activePet) return;
        
        if(activePet === 'dog') {
            const interval = setInterval(() => {
                if(clickerGameActive && clickerMice.length > 0 && Math.random() < 0.5) {
                    const randomMouse = clickerMice[Math.floor(Math.random() * clickerMice.length)];
                    if(randomMouse) {
                        const gain = Math.floor(randomMouse.value);
                        clickerCoins += gain;
                        clickerTotalMice++;
                        showNotification(`🐕 ¡Perrito atrapó un ratón! +${gain}`, "pet");
                        clickerMice = clickerMice.filter(m => m !== randomMouse);
                        renderClickerEntities();
                        updateClickerUI();
                        updateMissionProgress('mice');
                    }
                }
            }, 10000);
            clickerPetIntervals.push(interval);
        }
        
        if(activePet === 'bee') {
            const interval = setInterval(() => {
                if(clickerGameActive) {
                    const skills = getSkillBonus();
                    const gain = Math.floor(15 * (1 + skills.economy * 0.1));
                    clickerCoins += gain;
                    showNotification(`🐝 ¡Abeja generó ${gain} monedas!`, "pet");
                    updateClickerUI();
                }
            }, 30000);
            clickerPetIntervals.push(interval);
        }
        
        if(activePet === 'owl') {
            const interval = setInterval(() => {
                if(clickerGameActive) {
                    showNotification(`🦉 Búho aumenta crítico en +10%`, "pet");
                }
            }, 45000);
            clickerPetIntervals.push(interval);
        }
        
        if(activePet === 'dragon') {
            const interval = setInterval(() => {
                if(clickerGameActive) {
                    showNotification(`🐉 Dragón mejora todas las estadísticas x1.1`, "pet");
                }
            }, 60000);
            clickerPetIntervals.push(interval);
        }
    }
    
    function updatePetFollower() {
        const activePet = getActivePet();
        const follower = document.getElementById('petFollower');
        if(activePet) {
            const petEmojis = { dog: '🐕', owl: '🦉', bee: '🐝', dragon: '🐉' };
            follower.textContent = petEmojis[activePet];
            follower.style.display = 'block';
        } else {
            follower.style.display = 'none';
        }

    function startClickerGame() {
        clickerGameActive = true;
        loadClickerData();
        updateClickerUI();
        startPetEffects();
        updatePetFollower();
        
        document.getElementById('gameArea').innerHTML = '';
        
        const billy = document.getElementById('billy');
        billy.onclick = tapBillyClicker;
        billy.ontouchstart = (e) => { e.preventDefault(); tapBillyClicker(e); };
        
        document.onmousemove = (e) => { clickerTargetX = e.clientX; clickerTargetY = e.clientY; };
        document.ontouchmove = (e) => { e.preventDefault(); const t = e.touches[0]; clickerTargetX = t.clientX; clickerTargetY = t.clientY; };
        
        document.getElementById('gameArea').onclick = (e) => {
            let target = e.target;
            while(target && target !== document.getElementById('gameArea')) {
                if(target.classList?.contains('game-entity')) {
                    const type = target.dataset.type;
                    const idx = parseInt(target.dataset.idx);
                    if(type === 'mouse') catchMouse(idx, e.clientX, e.clientY);
                    else if(type === 'bubble') catchBubble(idx, e.clientX, e.clientY);
                    return;
                }
                target = target.parentElement;
            }
        };
        
        updateBillyPosition();
        
        setInterval(() => spawnMouse(), 3800);
        setInterval(() => spawnBubble(), 6000);
        setInterval(() => { updateMice(); renderClickerEntities(); }, 50);
        
        setInterval(() => {
            if(clickerGameActive) {
                let regen = Math.max(1, Math.floor(clickerCombo / 8));
                clickerEnergy = Math.min(clickerMaxEnergy, clickerEnergy + regen);
                updateClickerUI();
            }
        }, 2000);
        
        setInterval(() => {
            if(clickerGameActive && Math.random() < 0.15 && !clickerGoldenHour) {
                clickerGoldenHour = true;
                showNotification("✨ ¡HORA DORADA! Ratones dorados ✨");
                setTimeout(() => { clickerGoldenHour = false; showNotification("⌛ Hora dorada terminada"); }, 10000);
            }
        }, 35000);
        
        setInterval(() => {
            if(clickerGameActive && Math.random() < 0.1 && !clickerDoubleEvent) {
                clickerDoubleEvent = true;
                showNotification("🎉 ¡EVENTO! Doble monedas por 15s 🎉");
                setTimeout(() => { clickerDoubleEvent = false; showNotification("⌛ Evento terminado"); updateClickerUI(); }, 15000);
                updateClickerUI();
            }
        }, 50000);
        
        setInterval(() => saveClickerData(), 10000);
        
        showNotification("🐱 ¡Toca a Billy para comenzar!");
