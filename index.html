<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>🐱 BILLY THE CAT - Dual Game Mode</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', 'Comic Neue', system-ui, sans-serif;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            background: #0a0a2a;
        }

        /* Animaciones globales */
        @keyframes pulse {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.02); filter: brightness(1.1); }
        }
        
        @keyframes glowPulse {
            0% { box-shadow: 0 0 5px rgba(255,200,100,0.3); }
            100% { box-shadow: 0 0 30px rgba(255,200,100,0.6); }
        }
        
        @keyframes glowRed {
            0% { box-shadow: 0 0 5px rgba(255,100,100,0.3); }
            100% { box-shadow: 0 0 25px rgba(255,100,100,0.5); }
        }
        
        @keyframes glowGreen {
            0% { box-shadow: 0 0 5px rgba(100,255,100,0.3); }
            100% { box-shadow: 0 0 25px rgba(100,255,100,0.5); }
        }
        
        @keyframes bounceIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* Pantalla de selección de juego (MAIN MENU) */
        .game-selector {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 100%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
            overflow-y: auto;
        }
        
        .game-selector::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 30%, rgba(255,200,100,0.08) 0%, transparent 70%);
            pointer-events: none;
        }
        
        .selector-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }
        
        /* Logo principal con GIF animado */
        .main-logo {
            text-align: center;
            margin-bottom: 40px;
            animation: float 3s ease-in-out infinite;
        }
        
        .main-logo img {
            width: 160px;
            height: 160px;
            object-fit: contain;
            filter: drop-shadow(0 10px 25px rgba(0,0,0,0.5));
            transition: all 0.3s;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,200,100,0.2), transparent);
        }
        
        .main-logo h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #FFD966, #FFA500, #FF884D);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-top: 15px;
            letter-spacing: 2px;
        }
        
        /* Tarjetas de juegos */
        .game-cards {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .game-card {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(15px);
            border-radius: 50px;
            padding: 18px 22px;
            display: flex;
            align-items: center;
            gap: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 200, 100, 0.4);
            animation: glowPulse 2s infinite alternate;
        }
        
        .game-card:hover {
            transform: scale(1.02) translateY(-3px);
            border-color: #ffaa44;
            background: rgba(0, 0, 0, 0.9);
        }
        
        .game-card:active {
            transform: scale(0.98);
        }
        
        .game-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, rgba(251,191,36,0.2), rgba(230,126,34,0.2));
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        
        .game-card:hover .game-icon {
            transform: scale(1.05);
        }
        
        .game-icon img {
            width: 55px;
            height: 55px;
            object-fit: contain;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
        }
        
        .game-info {
            flex: 1;
        }
        
        .game-info h2 {
            color: #FFD966;
            font-size: 22px;
            margin-bottom: 5px;
        }
        
        .game-info p {
            color: rgba(255,255,255,0.6);
            font-size: 11px;
        }
        
        .game-stats {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }
        
        .game-stats span {
            background: rgba(0,0,0,0.5);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 10px;
            color: #FFD966;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .game-stats img {
            width: 14px;
            height: 14px;
        }
        
        /* Panel de recursos compartidos */
        .resources-panel {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 60px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            border: 1px solid rgba(255, 200, 100, 0.5);
        }
        
        .resource-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
        }
        
        .resource-item img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }
        
        .resource-value {
            font-size: 20px;
            color: #FFD966;
            font-weight: bold;
        }
        
        .resource-label {
            font-size: 10px;
            color: rgba(255,255,255,0.6);
        }
        
        /* Botones inferiores */
        .menu-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        
        .menu-btn {
            flex: 1;
            background: rgba(30, 41, 59, 0.9);
            border: none;
            padding: 12px;
            border-radius: 50px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(5px);
            font-size: 14px;
        }
        
        .menu-btn:active {
            transform: scale(0.95);
        }
        
        .lang-btn {
            background: linear-gradient(135deg, #fbbf24, #e67e22);
            color: #1e1a2f;
        }
        
        /* Contenedor del juego principal (Clicker) */
        .game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1001;
            display: none;
            background: radial-gradient(circle at center, #0a0a2a 0%, #050510 100%);
        }
        
        .game-container.active {
            display: block;
        }
        
        /* Billy con imágenes de estado de ánimo */
        #billy {
            position: fixed;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 20;
            transition: transform 0.05s linear, left 0.1s ease-out, top 0.1s ease-out;
            will-change: transform, left, top;
            pointer-events: auto;
            background: transparent;
        }
        
        #billy img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 8px 15px rgba(0,0,0,0.4));
            transition: all 0.2s;
        }
        
        #billy:active {
            transform: scale(0.92) !important;
        }
        
        .billy-happy {
            animation: pulse 0.5s ease-in-out;
        }
        
        .billy-sad {
            animation: shake 0.3s ease-in-out;
        }
        
        .billy-angry {
            animation: shake 0.2s ease-in-out;
            filter: drop-shadow(0 0 10px #ff4444);
        }
        
        /* Efecto de combo alto */
        .billy-combo-high {
            animation: glowGreen 0.5s infinite alternate;
        }
        
        /* Estrellas animadas */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite alternate;
        }
        
        @keyframes twinkle {
            from { opacity: 0.3; transform: scale(1); }
            to { opacity: 1; transform: scale(1.2); }
        }
        
        /* Botones con imágenes */
        .btn-icon {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        .btn-icon img {
            width: 18px;
            height: 18px;
            object-fit: contain;
        }
        
        /* Estilos del minijuego (BILLY JUMP) */
        .jump-game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #0a0a2a 0%, #1a2a3a 100%);
            z-index: 1100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        
        .jump-game-canvas {
            background: linear-gradient(180deg, #1a2a3a 0%, #2a3a4a 100%);
            border-radius: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            cursor: pointer;
            border: 3px solid #FFD966;
        }
        
        .jump-stats {
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1101;
        }
        
        .jump-score {
            background: rgba(0,0,0,0.8);
            padding: 10px 20px;
            border-radius: 40px;
            color: #FFD966;
            font-weight: bold;
            font-size: 20px;
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .jump-score img {
            width: 28px;
            height: 28px;
        }
        
        .jump-exit {
            background: rgba(0,0,0,0.8);
            padding: 10px 20px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.1s;
            backdrop-filter: blur(5px);
        }
        
        .jump-exit:active {
            transform: scale(0.95);
        }
        
        .jump-instruction {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(255,255,255,0.8);
            font-size: 14px;
            background: rgba(0,0,0,0.5);
            padding: 8px;
            margin: 0 20px;
            border-radius: 30px;
        }
        
        /* Responsive */
        @media (max-width: 600px) {
            .main-logo img { width: 120px; height: 120px; }
            .game-card { padding: 12px 16px; }
            .game-icon { width: 55px; height: 55px; }
            .game-icon img { width: 45px; height: 45px; }
            .game-info h2 { font-size: 18px; }
            .resource-value { font-size: 16px; }
            .resource-item img { width: 24px; height: 24px; }
            #billy { width: 100px; height: 100px; }
            .jump-score { font-size: 16px; padding: 6px 12px; }
        }
        
        @media (min-width: 601px) {
            #billy { width: 150px; height: 150px; }
        }
    </style>
</head>
<body>

<div class="stars" id="stars"></div>

<!-- Pantalla de selección de juego (MAIN MENU) -->
<div class="game-selector" id="gameSelector">
    <div class="selector-container">
        <div class="main-logo">
            <img src="billy.gif" alt="Billy" id="mainLogoImg" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%23FFD966%22/%3E%3Ctext x=%2250%22 y=%2270%22 text-anchor=%22middle%22 fill=%22%23FFA500%22 font-size=%2240%22%3E🐱%3C/text%3E%3C/svg%3E'">
            <h1>BILLY THE CAT</h1>
        </div>
        
        <div class="game-cards">
            <div class="game-card clicker-card" id="selectClickerBtn">
                <div class="game-icon">
                    <img src="billy_happy.png" alt="Clicker" id="clickerIconImg" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%23FFD966%22/%3E%3Ctext x=%2250%22 y=%2270%22 text-anchor=%22middle%22 fill=%22%23FFA500%22 font-size=%2240%22%3E🐱%3C/text%3E%3C/svg%3E'">
                </div>
                <div class="game-info">
                    <h2>🐱 BILLY CLICKER</h2>
                    <p>Toca a Billy, atrapa ratones, mejora habilidades y consigue mascotas</p>
                    <div class="game-stats">
                        <span>🎯 Clicker</span>
                        <span>⚡ Combos</span>
                        <span>🐾 Mascotas</span>
                    </div>
                </div>
            </div>
            
            <div class="game-card jump-card" id="selectJumpBtn">
                <div class="game-icon">
                    <img src="billy_coins.png" alt="Jump" id="jumpIconImg" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%2314f195%22/%3E%3Ctext x=%2250%22 y=%2270%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2240%22%3E🦘%3C/text%3E%3C/svg%3E'">
                </div>
                <div class="game-info">
                    <h2>🦘 BILLY JUMP</h2>
                    <p>Salta obstáculos con el gato negro, consigue puntuaciones récord</p>
                    <div class="game-stats">
                        <span>🦘 Saltos</span>
                        <span>⚡ Velocidad</span>
                        <span>🏆 Récords</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="resources-panel">
            <div class="resource-item">
                <img src="billy_coins.png" alt="Coins" id="coinIconImg" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%23fbbf24%22/%3E%3Ctext x=%2250%22 y=%2270%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2240%22%3E💰%3C/text%3E%3C/svg%3E'">
                <div>
                    <div class="resource-value" id="menuCoins">0</div>
                    <div class="resource-label">Monedas</div>
                </div>
            </div>
            <div class="resource-item">
                <img src="billy_happy.png" alt="Tokens" id="tokenIconImg" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%239945ff%22/%3E%3Ctext x=%2250%22 y=%2270%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2240%22%3E⭐%3C/text%3E%3C/svg%3E'">
                <div>
                    <div class="resource-value" id="menuTokens">0</div>
                    <div class="resource-label">BILLY Tokens</div>
                </div>
            </div>
        </div>
        
        <div class="menu-buttons">
            <button class="menu-btn lang-btn" id="langEsBtn">🇪🇸 Español</button>
            <button class="menu-btn lang-btn" id="langEnBtn">🇺🇸 English</button>
        </div>
    </div>
</div>

<!-- Contenedor del juego Clicker -->
<div class="game-container" id="clickerGameContainer">
    <div id="gameArea"></div>
    <div id="billy">
        <img src="billy_happy.png" id="billyMoodImg" alt="Billy" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%23FFD966%22/%3E%3Ctext x=%2250%22 y=%2270%22 text-anchor=%22middle%22 fill=%22%23FFA500%22 font-size=%2240%22%3E🐱%3C/text%3E%3C/svg%3E'">
    </div>
    <div class="pet-follower" id="petFollower"></div>
</div>

<script>
    // ==================== IDIOMAS ====================
    let currentLang = localStorage.getItem('billyLang') || 'es';
    
    const translations = {
        es: {
            clickerTitle: "BILLY CLICKER",
            jumpTitle: "BILLY JUMP",
            clickerDesc: "Toca a Billy, atrapa ratones",
            jumpDesc: "Salta obstáculos con el gato negro",
            coins: "Monedas",
            tokens: "Tokens",
            back: "VOLVER",
            jumpScore: "Puntuación",
            jumpBest: "Récord",
            jumpInstructions: "¡Toca la pantalla para saltar! Evita los obstáculos",
            jumpReward: "🎉 ¡Has ganado {reward} monedas!",
            gameOver: "GAME OVER",
            restart: "Toca para reiniciar"
        },
        en: {
            clickerTitle: "BILLY CLICKER",
            jumpTitle: "BILLY JUMP",
            clickerDesc: "Tap Billy, catch mice",
            jumpDesc: "Jump obstacles with the black cat",
            coins: "Coins",
            tokens: "Tokens",
            back: "BACK",
            jumpScore: "Score",
            jumpBest: "Best",
            jumpInstructions: "Tap to jump! Avoid obstacles",
            jumpReward: "🎉 You earned {reward} coins!",
            gameOver: "GAME OVER",
            restart: "Tap to restart"
        }
    };
    
    let t = translations[currentLang];
    
    function setLanguage(lang) {
        currentLang = lang;
        t = translations[currentLang];
        localStorage.setItem('billyLang', currentLang);
        updateMenuTexts();
    }
    
    function updateMenuTexts() {
        document.querySelector('#selectClickerBtn .game-info h2').innerHTML = `🐱 ${t.clickerTitle}`;
        document.querySelector('#selectClickerBtn .game-info p').textContent = t.clickerDesc;
        document.querySelector('#selectJumpBtn .game-info h2').innerHTML = `🦘 ${t.jumpTitle}`;
        document.querySelector('#selectJumpBtn .game-info p').textContent = t.jumpDesc;
        document.querySelector('.resource-item:first-child .resource-label').textContent = t.coins;
        document.querySelector('.resource-item:last-child .resource-label').textContent = t.tokens;
    }
    
    // ==================== VARIABLES COMPARTIDAS ====================
    let globalCoins = 0;
    let globalTokens = 0;
    
    // Cargar datos guardados
    function loadGlobalData() {
        const saved = localStorage.getItem('billyGlobalData');
        if(saved) {
            try {
                const data = JSON.parse(saved);
                globalCoins = data.coins || 0;
                globalTokens = data.tokens || 0;
            } catch(e) {}
        }
        updateMenuResources();
    }
    
    function saveGlobalData() {
        localStorage.setItem('billyGlobalData', JSON.stringify({
            coins: globalCoins,
            tokens: globalTokens
        }));
    }
    
    function updateMenuResources() {
        document.getElementById('menuCoins').textContent = Math.floor(globalCoins);
        document.getElementById('menuTokens').textContent = Math.floor(globalTokens);
    }
    
    function addCoins(amount) {
        globalCoins += amount;
        updateMenuResources();
        saveGlobalData();
    }
    
    function addTokens(amount) {
        globalTokens += amount;
        updateMenuResources();
        saveGlobalData();
    }
    
    // ==================== FUNCIONES DE IMÁGENES Y ESTADO DE ÁNIMO ====================
    function updateBillyMood(combo, energy) {
        const billyImg = document.getElementById('billyMoodImg');
        if(!billyImg) return;
        
        if(combo >= 15) {
            billyImg.src = 'billy_happy.png';
            billyImg.parentElement.classList.add('billy-combo-high');
            document.getElementById('billy').classList.add('billy-happy');
            setTimeout(() => document.getElementById('billy').classList.remove('billy-happy'), 500);
        } else if(energy <= 20) {
            billyImg.src = 'billy_Triste.png';
            document.getElementById('billy').classList.add('billy-sad');
            setTimeout(() => document.getElementById('billy').classList.remove('billy-sad'), 500);
        } else if(combo <= 2 && energy > 50) {
            billyImg.src = 'billy_Enfadado.png';
            document.getElementById('billy').classList.add('billy-angry');
            setTimeout(() => document.getElementById('billy').classList.remove('billy-angry'), 500);
        } else {
            billyImg.src = 'billy_happy.png';
        }
        
        // Manejar error de carga de imagen
        billyImg.onerror = function() {
            this.src = 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%23FFD966%22/%3E%3Ctext x=%2250%22 y=%2270%22 text-anchor=%22middle%22 fill=%22%23FFA500%22 font-size=%2240%22%3E🐱%3C/text%3E%3C/svg%3E';
        };
    }
    
    // ==================== MINIJUEGO BILLY JUMP ====================
    let jumpGameActive = false;
    let jumpGame = {
        canvas: null,
        ctx: null,
        width: 0,
        height: 0,
        player: { x: 80, y: 0, width: 35, height: 35, vy: 0, gravity: 0.8, jumpPower: -11, grounded: true },
        obstacles: [],
        score: 0,
        bestScore: 0,
        gameOver: false,
        animationId: null,
        spawnCounter: 0
    };
    
    function initJumpGame() {
        jumpGame.width = Math.min(window.innerWidth - 40, 380);
        jumpGame.height = 500;
        jumpGame.player.y = jumpGame.height - 80;
        jumpGame.player.width = 32;
        jumpGame.player.height = 32;
        jumpGame.obstacles = [];
        jumpGame.score = 0;
        jumpGame.gameOver = false;
        jumpGame.spawnCounter = 0;
        
        const savedBest = localStorage.getItem('billyJumpBest');
        jumpGame.bestScore = savedBest ? parseInt(savedBest) : 0;
        
        const container = document.createElement('div');
        container.className = 'jump-game-container';
        container.id = 'jumpGameContainer';
        container.innerHTML = `
            <div class="jump-stats">
                <div class="jump-score">
                    <img src="billy_coins.png" onerror="this.style.display='none'"> 
                    <span id="jumpScore">0</span>
                </div>
                <div class="jump-score">
                    🏆 <span id="jumpBest">${jumpGame.bestScore}</span>
                </div>
                <div class="jump-exit" id="jumpExitBtn">✖️ ${t.back}</div>
            </div>
            <canvas id="jumpCanvas" class="jump-game-canvas" width="${jumpGame.width}" height="${jumpGame.height}"></canvas>
            <div class="jump-instruction" id="jumpInstruction">${t.jumpInstructions}</div>
        `;
        document.body.appendChild(container);
        
        jumpGame.canvas = document.getElementById('jumpCanvas');
        jumpGame.ctx = jumpGame.canvas.getContext('2d');
        
        document.getElementById('jumpExitBtn').onclick = closeJumpGame;
        jumpGame.canvas.addEventListener('click', () => jumpAction());
        jumpGame.canvas.addEventListener('touchstart', (e) => { e.preventDefault(); jumpAction(); });
        
        jumpGame.animationId = requestAnimationFrame(updateJumpGame);
    }
    
    function jumpAction() {
        if(!jumpGame.gameOver && jumpGame.player.grounded) {
            jumpGame.player.vy = jumpGame.player.jumpPower;
            jumpGame.player.grounded = false;
            if(window.navigator && window.navigator.vibrate) window.navigator.vibrate(30);
        } else if(jumpGame.gameOver) {
            restartJumpGame();
        }
    }
    
    function updateJumpGame() {
        if(!jumpGame.canvas) return;
        
        const ctx = jumpGame.ctx;
        const w = jumpGame.width;
        const h = jumpGame.height;
        
        ctx.clearRect(0, 0, w, h);
        
        // Fondo con gradiente
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#1a2a3a');
        grad.addColorStop(1, '#2a3a4a');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
        
        // Dibujar suelo con efecto de profundidad
        ctx.fillStyle = '#5D3A1A';
        ctx.fillRect(0, h - 45, w, 45);
        ctx.fillStyle = '#8B5A2B';
        ctx.fillRect(0, h - 48, w, 3);
        ctx.fillStyle = '#C97E3A';
        for(let i = 0; i < 10; i++) {
            ctx.fillRect(i * 40, h - 50, 15, 5);
        }
        
        // Dibujar estrellas decorativas
        ctx.fillStyle = 'rgba(255,255,200,0.5)';
        for(let i = 0; i < 30; i++) {
            if(jumpGame.frameCount % 60 === i % 60) {
                ctx.fillRect((i * 37) % w, (i * 23) % (h - 100), 2, 2);
            }
        }
        
        if(!jumpGame.gameOver) {
            // Física del jugador
            jumpGame.player.vy += jumpGame.player.gravity;
            jumpGame.player.y += jumpGame.player.vy;
            
            if(jumpGame.player.y >= h - 45 - jumpGame.player.height) {
                jumpGame.player.y = h - 45 - jumpGame.player.height;
                jumpGame.player.vy = 0;
                jumpGame.player.grounded = true;
            }
            if(jumpGame.player.y < 0) {
                jumpGame.player.y = 0;
                if(jumpGame.player.vy < 0) jumpGame.player.vy = 0;
            }
            
            // Spawn de obstáculos
            jumpGame.spawnCounter++;
            let spawnRate = Math.max(35, 55 - Math.floor(jumpGame.score / 25));
            if(jumpGame.spawnCounter > spawnRate) {
                jumpGame.spawnCounter = 0;
                const obstacleType = Math.random() > 0.7 ? 'bird' : 'rock';
                jumpGame.obstacles.push({
                    x: w,
                    y: h - 45 - (obstacleType === 'rock' ? 35 : 40),
                    width: obstacleType === 'rock' ? 28 : 32,
                    height: obstacleType === 'rock' ? 35 : 32,
                    type: obstacleType
                });
            }
            
            // Actualizar obstáculos
            for(let i = 0; i < jumpGame.obstacles.length; i++) {
                const obs = jumpGame.obstacles[i];
                obs.x -= 4.5 + Math.floor(jumpGame.score / 120);
                
                if(obs.x + obs.width < 0) {
                    jumpGame.obstacles.splice(i, 1);
                    jumpGame.score++;
                    document.getElementById('jumpScore').textContent = jumpGame.score;
                    i--;
                }
                
                // Colisión
                if(obs.x < jumpGame.player.x + jumpGame.player.width &&
                    obs.x + obs.width > jumpGame.player.x &&
                    obs.y < jumpGame.player.y + jumpGame.player.height &&
                    obs.y + obs.height > jumpGame.player.y) {
                    jumpGame.gameOver = true;
                    if(jumpGame.score > jumpGame.bestScore) {
                        jumpGame.bestScore = jumpGame.score;
                        localStorage.setItem('billyJumpBest', jumpGame.bestScore);
                        document.getElementById('jumpBest').textContent = jumpGame.bestScore;
                    }
                    const reward = Math.floor(jumpGame.score * 5);
                    addCoins(reward);
                    showJumpNotification(t.jumpReward.replace("{reward}", reward));
                    document.getElementById('jumpInstruction').textContent = t.gameOver + " - " + t.restart;
                }
            }
        }
        
        // Dibujar obstáculos
        for(const obs of jumpGame.obstacles) {
            if(obs.type === 'rock') {
                ctx.fillStyle = '#6B4E2E';
                ctx.shadowBlur = 5;
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                ctx.fillStyle = '#4A2A1A';
                ctx.fillRect(obs.x + 5, obs.y + 8, 6, 12);
                ctx.fillRect(obs.x + 15, obs.y + 5, 6, 15);
            } else {
                ctx.fillStyle = '#4A4A4A';
                ctx.beginPath();
                ctx.ellipse(obs.x + obs.width/2, obs.y + obs.height/2, obs.width/2, obs.height/2, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#2D2D2D';
                ctx.beginPath();
                ctx.ellipse(obs.x + obs.width/2 - 6, obs.y + obs.height/2 - 4, 3, 3, 0, 0, Math.PI * 2);
                ctx.ellipse(obs.x + obs.width/2 + 6, obs.y + obs.height/2 - 4, 3, 3, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#FF6B6B';
                ctx.beginPath();
                ctx.moveTo(obs.x + obs.width/2, obs.y + obs.height/2 + 5);
                ctx.lineTo(obs.x + obs.width/2 - 5, obs.y + obs.height/2 + 12);
                ctx.lineTo(obs.x + obs.width/2 + 5, obs.y + obs.height/2 + 12);
                ctx.fill();
            }
        }
        
        ctx.shadowBlur = 0;
        
        // Dibujar jugador (gato negro estilo Uni Jump)
        ctx.fillStyle = '#1a1a2a';
        ctx.shadowBlur = 3;
        ctx.beginPath();
        ctx.ellipse(jumpGame.player.x + jumpGame.player.width/2, jumpGame.player.y + jumpGame.player.height/2, 
                    jumpGame.player.width/2, jumpGame.player.height/2, 0, 0, Math.PI * 2);
        ctx.fill();
        
        // Orejas
        ctx.fillStyle = '#0a0a1a';
        ctx.beginPath();
        ctx.moveTo(jumpGame.player.x + 6, jumpGame.player.y + 8);
        ctx.lineTo(jumpGame.player.x + 14, jumpGame.player.y - 5);
        ctx.lineTo(jumpGame.player.x + 22, jumpGame.player.y + 8);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(jumpGame.player.x + jumpGame.player.width - 6, jumpGame.player.y + 8);
        ctx.lineTo(jumpGame.player.x + jumpGame.player.width - 14, jumpGame.player.y - 5);
        ctx.lineTo(jumpGame.player.x + jumpGame.player.width - 22, jumpGame.player.y + 8);
        ctx.fill();
        
        // Ojos
        ctx.fillStyle = '#FFD966';
        ctx.beginPath();
        ctx.ellipse(jumpGame.player.x + jumpGame.player.width/2 - 8, jumpGame.player.y + jumpGame.player.height/2 - 4, 4, 5, 0, 0, Math.PI * 2);
        ctx.ellipse(jumpGame.player.x + jumpGame.player.width/2 + 8, jumpGame.player.y + jumpGame.player.height/2 - 4, 4, 5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.ellipse(jumpGame.player.x + jumpGame.player.width/2 - 8, jumpGame.player.y + jumpGame.player.height/2 - 5, 2, 2.5, 0, 0, Math.PI * 2);
        ctx.ellipse(jumpGame.player.x + jumpGame.player.width/2 + 8, jumpGame.player.y + jumpGame.player.height/2 - 5, 2, 2.5, 0, 0, Math.PI * 2);
        ctx.fill();
        
        // Bigotes
        ctx.strokeStyle = 'white';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(jumpGame.player.x + jumpGame.player.width/2 - 12, jumpGame.player.y + jumpGame.player.height/2 - 2);
        ctx.lineTo(jumpGame.player.x + jumpGame.player.width/2 - 22, jumpGame.player.y + jumpGame.player.height/2 - 5);
        ctx.moveTo(jumpGame.player.x + jumpGame.player.width/2 - 12, jumpGame.player.y + jumpGame.player.height/2);
        ctx.lineTo(jumpGame.player.x + jumpGame.player.width/2 - 22, jumpGame.player.y + jumpGame.player.height/2);
        ctx.moveTo(jumpGame.player.x + jumpGame.player.width/2 - 12, jumpGame.player.y + jumpGame.player.height/2 + 2);
        ctx.lineTo(jumpGame.player.x + jumpGame.player.width/2 - 22, jumpGame.player.y + jumpGame.player.height/2 + 5);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(jumpGame.player.x + jumpGame.player.width/2 + 12, jumpGame.player.y + jumpGame.player.height/2 - 2);
        ctx.lineTo(jumpGame.player.x + jumpGame.player.width/2 + 22, jumpGame.player.y + jumpGame.player.height/2 - 5);
        ctx.moveTo(jumpGame.player.x + jumpGame.player.width/2 + 12, jumpGame.player.y + jumpGame.player.height/2);
        ctx.lineTo(jumpGame.player.x + jumpGame.player.width/2 + 22, jumpGame.player.y + jumpGame.player.height/2);
        ctx.moveTo(jumpGame.player.x + jumpGame.player.width/2 + 12, jumpGame.player.y + jumpGame.player.height/2 + 2);
        ctx.lineTo(jumpGame.player.x + jumpGame.player.width/2 + 22, jumpGame.player.y + jumpGame.player.height/2 + 5);
        ctx.stroke();
        
        ctx.shadowBlur = 0;
        
        // Game Over
        if(jumpGame.gameOver) {
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0, 0, w, h);
            ctx.fillStyle = 'white';
            ctx.font = 'bold 28px "Segoe UI"';
            ctx.textAlign = 'center';
            ctx.fillText(t.gameOver, w/2, h/2 - 30);
            ctx.font = '16px "Segoe UI"';
            ctx.fillText(t.restart, w/2, h/2 + 30);
            ctx.fillText(`🏆 ${jumpGame.score} pts`, w/2, h/2 + 70);
        }
        
        jumpGame.frameCount = (jumpGame.frameCount || 0) + 1;
        jumpGame.animationId = requestAnimationFrame(updateJumpGame);
    }
    
    function restartJumpGame() {
        jumpGame.player.y = jumpGame.height - 80;
        jumpGame.player.vy = 0;
        jumpGame.player.grounded = true;
        jumpGame.obstacles = [];
        jumpGame.score = 0;
        jumpGame.gameOver = false;
        jumpGame.spawnCounter = 0;
        document.getElementById('jumpScore').textContent = 0;
        document.getElementById('jumpInstruction').textContent = t.jumpInstructions;
    }
    
    function closeJumpGame() {
        if(jumpGame.animationId) cancelAnimationFrame(jumpGame.animationId);
        const container = document.getElementById('jumpGameContainer');
        if(container) container.remove();
        jumpGameActive = false;
        document.getElementById('gameSelector').style.display = 'flex';
    }
    
    function showJumpNotification(msg) {
        const div = document.createElement('div');
        div.className = 'notification';
        div.textContent = msg;
        div.style.cssText = 'position:fixed;top:45%;left:50%;transform:translate(-50%,-50%);background:linear-gradient(135deg,#14f195,#9945ff);color:white;padding:12px24px;border-radius:50px;z-index:1200;animation:fadeOutUp1sforwards;';
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 1200);
    }
    
    function openJumpGame() {
        if(jumpGameActive) return;
        jumpGameActive = true;
        document.getElementById('gameSelector').style.display = 'none';
        initJumpGame();
    }
    
    // ==================== FUNCIONES DE NAVEGACIÓN ====================
    function openClickerGame() {
        document.getElementById('gameSelector').style.display = 'none';
        document.getElementById('clickerGameContainer').classList.add('active');
        if(typeof startClickerGame === 'function') startClickerGame();
    }
    
    function backToMenu() {
        document.getElementById('gameSelector').style.display = 'flex';
        document.getElementById('clickerGameContainer').classList.remove('active');
        if(typeof saveClickerGame === 'function') saveClickerGame();
    }
    
    // ==================== INICIALIZACIÓN ====================
    function init() {
        loadGlobalData();
        updateMenuResources();
        updateMenuTexts();
        
        document.getElementById('selectClickerBtn').onclick = openClickerGame;
        document.getElementById('selectJumpBtn').onclick = openJumpGame;
        document.getElementById('langEsBtn').onclick = () => setLanguage('es');
        document.getElementById('langEnBtn').onclick = () => setLanguage('en');
        
        generateStars();
    }
    
    function generateStars() {
        const starsDiv = document.getElementById('stars');
        for(let i = 0; i < 150; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.width = star.style.height = (1 + Math.random() * 2) + 'px';
            star.style.animationDelay = Math.random() * 2 + 's';
            starsDiv.appendChild(star);
        }
    }
    
    // Estilo adicional para notificaciones
    const style = document.createElement('style');
    style.textContent = `
        .notification {
            position: fixed;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #facc15, #f59e0b);
            color: #0c0a1a;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 16px;
            z-index: 1200;
            white-space: nowrap;
            animation: fadeOutUp 1s forwards;
            box-shadow: 0 4px 15px black;
            pointer-events: none;
        }
        @keyframes fadeOutUp {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.9); }
            100% { opacity: 0; transform: translate(-50%, -70%) scale(1.1); }
        }
    `;
    document.head.appendChild(style);
    
    init();
    
    // Exponer funciones globales para el juego clicker
    window.addCoins = addCoins;
    window.addTokens = addTokens;
    window.updateBillyMood = updateBillyMood;
    window.getGlobalCoins = () => globalCoins;
    window.getGlobalTokens = () => globalTokens;
    window.backToMenu = backToMenu;
</script>

<!-- Script del juego Clicker (versión simplificada pero funcional) -->
<script>
    // ==================== VARIABLES DEL CLICKER ====================
    let clickerGameStarted = false;
    let clickerCoins = 0;
    let clickerLevel = 1;
    let clickerMultiplier = 1;
    let clickerTapPower = 1;
    let clickerEnergy = 100;
    let clickerMaxEnergy = 100;
    let clickerCombo = 0;
    let clickerBestCombo = 0;
    let clickerTokens = 0;
    let clickerTotalTaps = 0;
    let clickerTotalMice = 0;
    let clickerTotalCrits = 0;
    let clickerComboTimer = null;
    let clickerSuperCombo = false;
    let clickerGoldenHour = false;
    let clickerDoubleEvent = false;
    
    let clickerMice = [];
    let clickerBubbles = [];
    let clickerMouseStreak = 0;
    
    // Habilidades
    let clickerSkills = {
        strength: 0, energy: 0, luck: 0, economy: 0
    };
    
    // Mascotas
    let clickerPets = {
        dog: { unlocked: false, level: 0, equipped: false },
        owl: { unlocked: false, level: 0, equipped: false },
        bee: { unlocked: false, level: 0, equipped: false },
        dragon: { unlocked: false, level: 0, equipped: false }
    };
    let clickerActivePet = null;
    
    // Skins
    let clickerSkins = [
        { name: "Original", unlocked: true, price: 0 },
        { name: "Golden", unlocked: false, price: 500 },
        { name: "Elite", unlocked: false, price: 1500 }
    ];
    let clickerCurrentSkin = 0;
    
    // Desafíos
    let clickerChallenges = { mice: 0, crits: 0, maxCombo: 0 };
    
    // Posición de Billy
    let clickerTargetX = window.innerWidth / 2;
    let clickerTargetY = window.innerHeight / 2;
    let clickerBillyX = window.innerWidth / 2;
    let clickerBillyY = window.innerHeight / 2;
    
    function startClickerGame() {
        clickerGameStarted = true;
        loadClickerData();
        updateClickerUI();
        setupClickerEvents();
        startClickerIntervals();
        showClickerNotification("🐱 ¡Toca a Billy para comenzar!");
    }
    
    function loadClickerData() {
        const saved = localStorage.getItem('billyClickerData');
        if(saved) {
            try {
                const data = JSON.parse(saved);
                clickerCoins = data.coins || 0;
                clickerLevel = data.level || 1;
                clickerTapPower = data.tapPower || 1;
                clickerTokens = data.tokens || 0;
                clickerBestCombo = data.bestCombo || 0;
                clickerTotalMice = data.totalMice || 0;
                clickerTotalCrits = data.totalCrits || 0;
                clickerSkills = data.skills || clickerSkills;
                clickerPets = data.pets || clickerPets;
                clickerActivePet = data.activePet || null;
                clickerSkins = data.skins || clickerSkins;
                clickerCurrentSkin = data.currentSkin || 0;
            } catch(e) {}
        }
        clickerMultiplier = 1 + Math.floor(clickerLevel / 4);
        clickerMaxEnergy = 100 + Math.floor(clickerLevel / 2) * 5 + (clickerSkills.energy * 20);
        clickerEnergy = clickerMaxEnergy;
        updateClickerUI();
    }
    
    function saveClickerData() {
        localStorage.setItem('billyClickerData', JSON.stringify({
            coins: clickerCoins, level: clickerLevel, tapPower: clickerTapPower,
            tokens: clickerTokens, bestCombo: clickerBestCombo,
            totalMice: clickerTotalMice, totalCrits: clickerTotalCrits,
            skills: clickerSkills, pets: clickerPets, activePet: clickerActivePet,
            skins: clickerSkins, currentSkin: clickerCurrentSkin
        }));
    }
    
    function updateClickerUI() {
        document.getElementById('clickerCoins').textContent = Math.floor(clickerCoins);
        document.getElementById('clickerLevel').textContent = clickerLevel;
        document.getElementById('clickerMultiplier').textContent = clickerMultiplier;
        document.getElementById('clickerTapPower').textContent = clickerTapPower;
        document.getElementById('clickerCombo').textContent = clickerCombo;
        document.getElementById('clickerEnergy').textContent = Math.floor(clickerEnergy);
        document.getElementById('clickerMaxEnergy').textContent = clickerMaxEnergy;
        document.getElementById('clickerEnergyFill').style.width = (clickerEnergy / clickerMaxEnergy * 100) + '%';
        document.getElementById('clickerTokens').textContent = Math.floor(clickerTokens);
        document.getElementById('clickerBestCombo').textContent = clickerBestCombo;
        
        // Actualizar estado de ánimo
        updateBillyMood(clickerCombo, clickerEnergy);
        
        // Actualizar recursos globales
        window.addCoins(0);
        window.addTokens(clickerTokens);
    }
    
    function tapBillyClicker(event) {
        if(!clickerGameStarted || clickerEnergy <= 0) {
            if(clickerEnergy <= 0) showClickerNotification("💤 ¡Sin energía!");
            return;
        }
        
        clickerCombo++;
        if(clickerCombo > clickerBestCombo) clickerBestCombo = clickerBestCombo;
        clickerTotalTaps++;
        
        // Crítico
        let critChance = 10 + clickerSkills.luck * 2 + Math.floor(clickerCombo / 3);
        if(clickerActivePet === 'owl') critChance += 10;
        const isCrit = Math.random() * 100 < critChance;
        if(isCrit) clickerTotalCrits++;
        
        // Ganancia
        let gain = clickerTapPower * clickerMultiplier * (isCrit ? 3 : 1) * (1 + clickerCombo * 0.02);
        if(clickerActivePet === 'dragon') gain *= (1 + clickerPets.dragon.level * 0.05);
        if(clickerSuperCombo) gain *= 1.3;
        if(clickerDoubleEvent) gain *= 2;
        gain = Math.floor(gain);
        
        clickerCoins += gain;
        clickerTokens += Math.floor(gain / 10);
        
        // Energía
        let energyCost = Math.max(1, Math.floor(clickerCombo / 10));
        clickerEnergy = Math.max(0, clickerEnergy - energyCost);
        
        updateClickerUI();
        
        // Reset combo timer
        if(clickerComboTimer) clearTimeout(clickerComboTimer);
        clickerComboTimer = setTimeout(() => {
            if(clickerCombo >= 3) showClickerNotification("🔥 Combo perdido!");
            clickerCombo = 0;
            clickerSuperCombo = false;
            updateClickerUI();
        }, 2000);
        
        // Super combo
        if(clickerCombo >= 12 && !clickerSuperCombo) {
            clickerSuperCombo = true;
            showClickerNotification("✨ SUPER COMBO! x1.3 ✨");
            setTimeout(() => { clickerSuperCombo = false; }, 5000);
        }
        
        // Efectos visuales
        const billyDiv = document.getElementById('billy');
        billyDiv.style.transform = 'scale(0.92)';
        setTimeout(() => billyDiv.style.transform = 'scale(1)', 100);
        
        const clickX = event.clientX || (event.touches ? event.touches[0].clientX : clickerBillyX);
        const clickY = event.clientY || (event.touches ? event.touches[0].clientY : clickerBillyY);
        createClickerRipple(clickX, clickY);
        createClickerParticles(clickX, clickY, isCrit ? '#FFD966' : '#A5F0A0');
        createClickerFloatingNumber(gain, clickX, clickY, isCrit);
        
        // Nivel up
        let neededCoins = 100 * Math.pow(1.3, clickerLevel - 1);
        if(clickerCoins >= neededCoins) {
            clickerLevel++;
            clickerMultiplier = 1 + Math.floor(clickerLevel / 4);
            clickerMaxEnergy = 100 + Math.floor(clickerLevel / 2) * 5 + (clickerSkills.energy * 20);
            clickerEnergy = Math.min(clickerMaxEnergy, clickerEnergy + 40);
            showClickerNotification(`🎉 NIVEL ${clickerLevel}! +40 energía 🎉`);
            updateClickerUI();
        }
        
        saveClickerData();
    }
    
    function createClickerRipple(x, y) {
        const ripple = document.createElement('div');
        ripple.style.cssText = `position:fixed;left:${x-35}px;top:${y-35}px;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,rgba(251,191,36,0.6) 0%,rgba(251,191,36,0) 80%);pointer-events:none;z-index:90;animation:rippleAnim 0.5s ease-out forwards;`;
        document.body.appendChild(ripple);
        setTimeout(() => ripple.remove(), 500);
    }
    
    function createClickerParticles(x, y, color) {
        for(let i = 0; i < 8; i++) {
            const particle = document.createElement('div');
            particle.style.cssText = `position:fixed;left:${x}px;top:${y}px;width:6px;height:6px;background:${color};border-radius:50%;pointer-events:none;z-index:100;`;
            const angle = Math.random() * Math.PI * 2;
            const speed = 2 + Math.random() * 4;
            let vx = Math.cos(angle) * speed;
            let vy = Math.sin(angle) * speed - 2;
            let life = 30;
            document.body.appendChild(particle);
            function animate() {
                life--;
                if(life <= 0) { particle.remove(); return; }
                particle.style.left = (parseFloat(particle.style.left) + vx) + 'px';
                particle.style.top = (parseFloat(particle.style.top) + vy) + 'px';
                particle.style.opacity = life / 30;
                requestAnimationFrame(animate);
            }
            animate();
        }
    }
    
    function createClickerFloatingNumber(value, x, y, isCrit) {
        const div = document.createElement('div');
        div.style.cssText = `position:fixed;left:${x}px;top:${y}px;font-weight:bold;font-size:${isCrit ? '32px' : '28px'};color:${isCrit ? '#FFD966' : 'white'};text-shadow:0 0 5px black;pointer-events:none;z-index:150;animation:floatUp 0.8s forwards;`;
        div.textContent = `+${Math.floor(value)}`;
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 700);
    }
    
    function showClickerNotification(msg) {
        const div = document.createElement('div');
        div.className = 'notification';
        div.textContent = msg;
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 1200);
    }
    
    function setupClickerEvents() {
        const billyDiv = document.getElementById('billy');
        billyDiv.addEventListener('click', tapBillyClicker);
        billyDiv.addEventListener('touchstart', (e) => { e.preventDefault(); tapBillyClicker(e); });
        
        document.addEventListener('mousemove', (e) => { clickerTargetX = e.clientX; clickerTargetY = e.clientY; });
        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const t = e.touches[0];
            clickerTargetX = t.clientX; clickerTargetY = t.clientY;
        }, { passive: false });
        
        function updateBillyPosition() {
            if(!clickerGameStarted) return;
            clickerBillyX += (clickerTargetX - clickerBillyX) * 0.12;
            clickerBillyY += (clickerTargetY - clickerBillyY) * 0.12;
            const billyDiv = document.getElementById('billy');
            billyDiv.style.left = (clickerBillyX - billyDiv.offsetWidth / 2) + 'px';
            billyDiv.style.top = (clickerBillyY - billyDiv.offsetHeight / 2) + 'px';
            requestAnimationFrame(updateBillyPosition);
        }
        updateBillyPosition();
        
        // Botón de volver
        const backBtn = document.createElement('button');
        backBtn.className = 'menu-btn';
        backBtn.style.position = 'fixed';
        backBtn.style.bottom = '15px';
        backBtn.style.left = '15px';
        backBtn.style.zIndex = '100';
        backBtn.style.padding = '8px 16px';
        backBtn.style.background = 'rgba(0,0,0,0.7)';
        backBtn.innerHTML = '← VOLVER';
        backBtn.onclick = () => {
            clickerGameStarted = false;
            saveClickerData();
            backToMenu();
        };
        document.getElementById('clickerGameContainer').appendChild(backBtn);
    }
    
    function startClickerIntervals() {
        setInterval(() => {
            if(clickerGameStarted) {
                let regen = Math.max(1, Math.floor(clickerCombo / 8)) + clickerSkills.energy;
                clickerEnergy = Math.min(clickerMaxEnergy, clickerEnergy + regen);
                updateClickerUI();
            }
        }, 2000);
        
        setInterval(() => {
            if(clickerGameStarted && Math.random() < 0.1 && !clickerGoldenHour) {
                clickerGoldenHour = true;
                showClickerNotification("✨ ¡HORA DORADA! Ratones dorados ✨");
                setTimeout(() => { clickerGoldenHour = false; }, 10000);
            }
        }, 35000);
        
        setInterval(() => saveClickerData(), 10000);
    }
    
    // Crear UI del clicker
    function createClickerUI() {
        const container = document.getElementById('clickerGameContainer');
        const uiHTML = `
            <div style="position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;z-index:30;">
                <div class="stat-card">😺 Nv <span id="clickerLevel">1</span></div>
                <div class="stat-card">💰 <span id="clickerCoins">0</span></div>
                <div class="stat-card">⚡ x<span id="clickerMultiplier">1</span></div>
                <div class="stat-card">💪 <span id="clickerTapPower">1</span></div>
            </div>
            <div style="position:fixed;top:70px;left:10px;right:10px;background:linear-gradient(135deg,#fbbf24,#f59e0b);border-radius:60px;padding:8px 16px;display:flex;justify-content:space-between;z-index:30;cursor:pointer;font-weight:bold;" id="clickerTokenBar">
                <span>🐱 BILLY Tokens</span>
                <span><span id="clickerTokens">0</span> BILLY</span>
            </div>
            <div class="combo-panel" style="top:120px;">🔥 <span id="clickerCombo">0</span> COMBO</div>
            <div class="records-panel" style="top:180px;">🏆 Mejor Combo: <span id="clickerBestCombo">0</span></div>
            <div class="energy-container" style="bottom:150px;">
                <div style="display:flex;justify-content:space-between;margin-bottom:5px;">
                    <span>⚡ Energía</span>
                    <span><span id="clickerEnergy">100</span>/<span id="clickerMaxEnergy">100</span></span>
                </div>
                <div class="energy-bg"><div class="energy-fill" id="clickerEnergyFill"></div></div>
            </div>
        `;
        container.insertAdjacentHTML('beforeend', uiHTML);
        
        document.getElementById('clickerTokenBar').onclick = () => {
            showClickerNotification(`💰 ${Math.floor(clickerTokens)} BILLY tokens`);
        };
    }
    
    createClickerUI();
    
    // Añadir animación de ripple al estilo
    const rippleStyle = document.createElement('style');
    rippleStyle.textContent = `
        @keyframes rippleAnim {
            0% { transform: scale(0); opacity: 0.7; }
            100% { transform: scale(5); opacity: 0; }
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0px); }
            100% { opacity: 0; transform: translateY(-70px); }
        }
        .stat-card {
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: bold;
            color: #FFE484;
            border: 1px solid rgba(255,200,100,0.5);
        }
        .combo-panel {
            position: fixed;
            right: 10px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 18px;
            font-weight: bold;
            color: #ff884d;
            border: 1px solid #ffaa44;
        }
        .records-panel {
            position: fixed;
            left: 10px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 11px;
            color: #FFD966;
            text-align: center;
        }
        .energy-container {
            position: fixed;
            left: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            border-radius: 20px;
            padding: 8px 12px;
            backdrop-filter: blur(5px);
        }
        .energy-bg {
            height: 12px;
            background: #2d2a3e;
            border-radius: 20px;
            overflow: hidden;
        }
        .energy-fill {
            height: 100%;
            background: linear-gradient(90deg, #22c55e, #facc15);
            border-radius: 20px;
            transition: width 0.2s;
        }
    `;
    document.head.appendChild(rippleStyle);
    
    window.startClickerGame = startClickerGame;
    window.saveClickerData = saveClickerData;
</script>
</body>
</html>
