<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>🐈‍⬛ BILLY JUMP - La venganza del gato negro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', 'Comic Neue', system-ui, sans-serif;
            min-height: 100vh;
            overflow: hidden;
            background: linear-gradient(180deg, #0a0a2a 0%, #1a1a3e 50%, #0a0a1a 100%);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        @keyframes bounceIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes floatUp {
            to { transform: translateY(-60px); opacity: 0; }
        }

        @keyframes fadeOutUp {
            to { opacity: 0; transform: translate(-50%, -70%); }
        }

        @keyframes squash {
            0% { transform: scale(1); }
            50% { transform: scale(1.2, 0.8); }
            100% { transform: scale(1); }
        }

        @keyframes blinkPlatform {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Pantalla de inicio */
        .start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #0a0a2a 0%, #050510 100%);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .start-logo {
            text-align: center;
            margin-bottom: 20px;
            animation: float 3s infinite;
        }

        .start-logo img {
            width: 260px;
            max-width: 80%;
            filter: drop-shadow(0 10px 30px rgba(0,0,0,0.5));
        }

        .start-title {
            font-size: 36px;
            background: linear-gradient(135deg, #FFD966, #FF6B6B);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 2px;
        }

        .start-card {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(20px);
            border-radius: 50px;
            padding: 25px;
            text-align: center;
            width: 90%;
            max-width: 350px;
            border: 2px solid rgba(255,200,100,0.5);
            margin-top: 20px;
        }

        .register-input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 50px;
            border: none;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 16px;
            text-align: center;
            margin-bottom: 12px;
        }

        .register-input:focus {
            outline: none;
            border: 1px solid #ffaa44;
        }

        .register-btn {
            background: linear-gradient(135deg, #14f195, #9945ff);
            border: none;
            padding: 14px 35px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s;
        }

        .register-btn:active {
            transform: scale(0.97);
        }

        .error-msg {
            color: #ff6b6b;
            font-size: 12px;
            margin-top: 10px;
        }

        /* Menú principal */
        .main-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #0a0a2a 0%, #050510 100%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
        }

        .menu-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .user-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            padding: 10px 18px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,200,100,0.3);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #fbbf24, #e67e22);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .user-details h3 {
            color: #FFD966;
            font-size: 14px;
        }

        .user-details p {
            color: rgba(255,255,255,0.5);
            font-size: 10px;
        }

        .user-stats {
            display: flex;
            gap: 12px;
        }

        .user-stat {
            text-align: center;
        }

        .user-stat-value {
            color: #FFD966;
            font-weight: bold;
            font-size: 16px;
        }

        .user-stat-label {
            color: rgba(255,255,255,0.5);
            font-size: 9px;
        }

        .game-modes {
            display: flex;
            gap: 15px;
            margin: 20px 0;
        }

        .mode-card {
            flex: 1;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            border-radius: 35px;
            padding: 18px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid rgba(255,200,100,0.3);
        }

        .mode-card:hover {
            transform: translateY(-3px);
            border-color: #ffaa44;
        }

        .mode-card:active {
            transform: scale(0.98);
        }

        .mode-icon {
            font-size: 40px;
            margin-bottom: 8px;
        }

        .mode-card h3 {
            color: #FFD966;
            font-size: 18px;
        }

        .mode-card p {
            color: rgba(255,255,255,0.5);
            font-size: 10px;
            margin-top: 5px;
        }

        .resources-bar {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            margin: 15px 0;
        }

        .resource {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .resource-icon {
            font-size: 28px;
        }

        .resource-info {
            text-align: left;
        }

        .resource-value {
            font-size: 18px;
            font-weight: bold;
            color: #FFD966;
        }

        .resource-label {
            font-size: 9px;
            color: rgba(255,255,255,0.5);
        }

        .menu-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .menu-btn {
            flex: 1;
            background: rgba(30,41,59,0.9);
            backdrop-filter: blur(5px);
            border: none;
            padding: 10px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }

        .menu-btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: linear-gradient(135deg, #fbbf24, #e67e22);
            color: #1e1a2f;
        }

        /* Contenedor del juego */
        .game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1100;
            display: none;
            background: linear-gradient(180deg, #0a0a2a 0%, #1a1a3e 100%);
        }

        .game-container.active {
            display: block;
        }

        .game-header {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            z-index: 50;
        }

        .back-btn {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            padding: 8px 18px;
            border-radius: 35px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            border: none;
            font-size: 12px;
        }

        .back-btn:active {
            transform: scale(0.95);
        }

        /* JUEGO JUMP - VERSIÓN ÉPICA */
        .jump-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .jump-canvas {
            display: block;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        .jump-ui {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 60;
            pointer-events: none;
        }

        .jump-score-card {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 30px;
            color: #FFD966;
            font-weight: bold;
            font-size: 14px;
            border: 1px solid rgba(255,200,100,0.5);
        }

        .jump-lives {
            display: flex;
            gap: 8px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 30px;
        }

        .life-heart {
            font-size: 20px;
        }

        .jump-combo {
            position: fixed;
            top: 120px;
            right: 15px;
            background: rgba(0,0,0,0.8);
            padding: 8px 16px;
            border-radius: 30px;
            color: #FF6B6B;
            font-weight: bold;
            font-size: 18px;
            z-index: 60;
            border: 1px solid #FF6B6B;
            pointer-events: none;
        }

        .powerup-indicator {
            position: fixed;
            top: 120px;
            left: 15px;
            background: rgba(0,0,0,0.8);
            padding: 6px 12px;
            border-radius: 30px;
            color: white;
            font-size: 12px;
            z-index: 60;
            pointer-events: none;
        }

        .game-over-screen {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(15px);
            border-radius: 40px;
            padding: 25px;
            text-align: center;
            z-index: 200;
            min-width: 280px;
            border: 2px solid #ffaa44;
        }

        .game-over-screen h2 {
            color: #FF6B6B;
            margin-bottom: 15px;
        }

        .game-over-screen p {
            color: white;
            margin-bottom: 20px;
        }

        .restart-btn {
            background: linear-gradient(135deg, #fbbf24, #e67e22);
            border: none;
            padding: 12px 25px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
        }

        .menu-restart-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            padding: 12px 25px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
            color: white;
        }

        .floating-number {
            position: fixed;
            font-weight: bold;
            font-size: 20px;
            text-shadow: 0 0 5px black;
            pointer-events: none;
            z-index: 150;
            animation: floatUp 0.8s forwards;
            color: #FFD966;
        }

        .notification {
            position: fixed;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #facc15, #f59e0b);
            color: #0c0a1a;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: bold;
            z-index: 200;
            animation: fadeOutUp 1s forwards;
            white-space: nowrap;
            font-size: 14px;
        }

        .sound-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            font-size: 22px;
            border: 1px solid #ffaa44;
        }

        @media (max-width: 600px) {
            .mode-card { padding: 12px; }
            .mode-icon { font-size: 32px; }
            .mode-card h3 { font-size: 14px; }
            .resource-icon { font-size: 22px; }
            .resource-value { font-size: 14px; }
            .menu-btn { font-size: 10px; padding: 8px; }
            .jump-score-card { font-size: 11px; padding: 6px 12px; }
            .jump-combo { font-size: 14px; top: 110px; }
            .powerup-indicator { font-size: 10px; top: 110px; }
        }
    </style>
</head>
<body>

<div class="sound-toggle" id="soundToggle">🔊</div>

<!-- Pantalla de inicio -->
<div class="start-screen" id="startScreen">
    <div class="start-logo">
        <img src="billy_inicio.png" alt="Billy" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 200%22%3E%3Ccircle cx=%22100%22 cy=%22100%22 r=%2290%22 fill=%22%23FFD966%22/%3E%3Ctext x=%22100%22 y=%22140%22 text-anchor=%22middle%22 fill=%22%23FFA500%22 font-size=%2280%22%3E🐱%3C/text%3E%3C/svg%3E'">
        <h1 class="start-title">BILLY JUMP</h1>
        <p class="start-subtitle">🐈‍⬛ La venganza del gato negro 🐈‍⬛</p>
    </div>
    <div class="start-card">
        <input type="text" class="register-input" id="nicknameInput" placeholder="Tu nombre" maxlength="15">
        <button class="register-btn" id="startBtn">🎮 COMENZAR AVENTURA</button>
        <div id="startError" class="error-msg"></div>
    </div>
</div>

<!-- Menú principal -->
<div class="main-menu" id="mainMenu" style="display: none;">
    <div class="menu-container">
        <div class="user-header">
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">🐱</div>
                <div class="user-details">
                    <h3 id="userNickname">Jugador</h3>
                    <p>🐈‍⬛ BILLY JUMP</p>
                </div>
            </div>
            <div class="user-stats">
                <div class="user-stat"><div class="user-stat-value" id="userLevel">1</div><div class="user-stat-label">Nivel</div></div>
                <div class="user-stat"><div class="user-stat-value" id="userLives">3</div><div class="user-stat-label">Vidas</div></div>
            </div>
        </div>
        <div class="game-modes">
            <div class="mode-card" id="playJumpBtn">
                <div class="mode-icon">🐈‍⬛</div>
                <h3>BILLY JUMP</h3>
                <p>Salta, aplasta monstruos, sube</p>
            </div>
            <div class="mode-card" id="clickerBtn" style="opacity:0.7">
                <div class="mode-icon">💰</div>
                <h3>BILLY CLICKER</h3>
                <p>Próximamente...</p>
            </div>
        </div>
        <div class="resources-bar">
            <div class="resource"><div class="resource-icon">⭐</div><div class="resource-info"><div class="resource-value" id="menuTokens">0</div><div class="resource-label">BILLY Tokens</div></div></div>
            <div class="resource"><div class="resource-icon">🏆</div><div class="resource-info"><div class="resource-value" id="menuRecord">0</div><div class="resource-label">Récord</div></div></div>
        </div>
        <div class="menu-buttons">
            <button class="menu-btn" id="statsBtn">📊 Estadísticas</button>
            <button class="menu-btn btn-primary" id="shopBtn">🛒 Tienda</button>
        </div>
    </div>
</div>

<!-- Contenedor del juego Jump -->
<div class="game-container" id="jumpContainer">
    <div class="game-header">
        <button class="back-btn" id="jumpBackBtn">← MENÚ</button>
    </div>
    <div class="jump-ui">
        <div class="jump-score-card">⭐ SCORE: <span id="jumpScore">0</span></div>
        <div class="jump-lives" id="jumpLivesContainer"></div>
    </div>
    <div class="jump-combo" id="jumpComboDisplay" style="display: none;">🔥 x<span id="comboMultiplier">1</span></div>
    <div class="powerup-indicator" id="powerupIndicator" style="display: none;"></div>
    <div class="jump-container" id="jumpGameArea"></div>
    <div id="gameOverModal" style="display: none;"></div>
</div>

<script>
    // ==================== CONFIGURACIÓN ====================
    let soundEnabled = true;
    let currentUser = null;
    
    // Sistema de sonidos (Web Audio)
    let audioCtx = null;
    
    function initAudio() {
        if(!audioCtx && soundEnabled) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }
    
    function playSound(freq, duration = 0.12, type = 'sine') {
        if(!soundEnabled) return;
        try {
            initAudio();
            if(!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            osc.type = type;
            gain.gain.value = 0.12;
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, now + duration);
            osc.stop(now + duration);
        } catch(e) {}
    }
    
    function playJumpSound() { playSound(523, 0.1, 'sine'); }
    function playLandSound() { playSound(330, 0.08, 'triangle'); }
    function playStompSound() { playSound(220, 0.15, 'sawtooth'); }
    function playHitSound() { playSound(164, 0.2, 'sawtooth'); }
    function playPowerUpSound() { playSound(880, 0.15, 'sine'); playSound(1046, 0.15, 'sine'); }
    function playGameOverSound() { playSound(220, 0.3, 'sawtooth'); playSound(164, 0.3, 'sawtooth'); }
    function playClickSound() { playSound(440, 0.05, 'sine'); }
    
    document.getElementById('soundToggle').onclick = () => {
        soundEnabled = !soundEnabled;
        document.getElementById('soundToggle').innerHTML = soundEnabled ? '🔊' : '🔇';
        if(soundEnabled && audioCtx) audioCtx.resume();
        playClickSound();
    };
    
    // ==================== USUARIO ====================
    function createDefaultUser(nickname) {
        return {
            userId: Date.now().toString(),
            nickname: nickname,
            createdAt: Date.now(),
            resources: { tokens: 100 },
            jump: {
                bestScore: 0,
                totalJumps: 0,
                totalStomps: 0,
                totalPowerups: 0,
                lives: 3
            },
            shop: {
                extraLives: 0,
                jumpPower: 0,
                magnetRange: 0
            },
            stats: {
                gamesPlayed: 0,
                totalScore: 0
            }
        };
    }
    
    function saveUser() {
        if(currentUser) {
            localStorage.setItem('billyUser_' + currentUser.userId, JSON.stringify(currentUser));
            localStorage.setItem('billyCurrentUser', currentUser.userId);
        }
    }
    
    function loadUser(userId) {
        const saved = localStorage.getItem('billyUser_' + userId);
        if(saved) {
            currentUser = JSON.parse(saved);
            return true;
        }
        return false;
    }
    
    function getAllNicknames() {
        const nicknames = [];
        for(let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if(key && key.startsWith('billyUser_')) {
                try {
                    const user = JSON.parse(localStorage.getItem(key));
                    nicknames.push(user.nickname);
                } catch(e) {}
            }
        }
        return nicknames;
    }
    
    function registerUser(nickname) {
        if(nickname.length < 3) {
            document.getElementById('startError').textContent = "El nombre debe tener al menos 3 caracteres";
            return false;
        }
        if(getAllNicknames().includes(nickname)) {
            document.getElementById('startError').textContent = "Este nombre ya existe";
            return false;
        }
        currentUser = createDefaultUser(nickname);
        saveUser();
        document.getElementById('startError').textContent = '';
        return true;
    }
    
    function updateMenuUI() {
        if(currentUser) {
            document.getElementById('userNickname').textContent = currentUser.nickname;
            document.getElementById('userLevel').textContent = Math.floor(currentUser.jump.bestScore / 100) + 1;
            document.getElementById('userLives').textContent = currentUser.jump.lives;
            document.getElementById('menuTokens').textContent = Math.floor(currentUser.resources.tokens);
            document.getElementById('menuRecord').textContent = currentUser.jump.bestScore;
        }
    }
    
    function showNotification(msg, type = "normal") {
        const div = document.createElement('div');
        div.className = 'notification';
        div.textContent = msg;
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 1500);
    }
    
    function createFloatingNumber(value, x, y, isCrit = true) {
        const div = document.createElement('div');
        div.className = 'floating-number';
        div.textContent = `+${value}`;
        div.style.left = x + 'px';
        div.style.top = y + 'px';
        div.style.color = isCrit ? '#FFD966' : 'white';
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 700);
    }
    
    // ==================== BILLY JUMP - VERSIÓN ÉPICA ====================
    let jumpGameActive = false;
    let jumpAnimationId = null;
    let jumpCanvas = null;
    let jumpCtx = null;
    let jumpWidth = 380;
    let jumpHeight = 600;
    
    // Estado del juego
    let score = 0;
    let lives = 3;
    let gameOver = false;
    let gamePaused = false;
    
    // Jugador
    let player = {
        x: jumpWidth / 2 - 20,
        y: jumpHeight - 120,
        width: 40,
        height: 40,
        vx: 0,
        vy: 0,
        gravity: 0.6,
        jumpPower: -10,
        grounded: true,
        lastGroundY: 0,
        state: 'idle' // idle, jump, fall, hit, stomp
    };
    
    // Plataformas
    let platforms = [];
    let monsters = [];
    let powerups = [];
    let particles = [];
    
    // Sistema de combo
    let combo = 1;
    let comboCounter = 0;
    let lastPlatformY = 0;
    
    // Power-ups activos
    let activePowerups = {
        jetpack: 0,
        shield: 0,
        magnet: 0,
        slowmo: 0
    };
    
    // Scroll de cámara
    let cameraY = 0;
    let scrollSpeed = 0;
    
    // Imágenes de Billy
    let billyImages = {
        normal: null, jump: null, fall: null, happy: null, angry: null, run: null, sad: null, relax: null, surprised: null
    };
    let starImage = null;
    let imagesLoaded = false;
    let imagesToLoad = 10;
    let imagesLoadedCount = 0;
    
    function loadBillyImages() {
        billyImages.normal = new Image(); billyImages.normal.src = 'billy-normal.png';
        billyImages.jump = new Image(); billyImages.jump.src = 'bylli-jumpin.png';
        billyImages.fall = new Image(); billyImages.fall.src = 'billy-abajo.png';
        billyImages.happy = new Image(); billyImages.happy.src = 'bylli-alegre.png';
        billyImages.angry = new Image(); billyImages.angry.src = 'bylli-enojado.png';
        billyImages.run = new Image(); billyImages.run.src = 'bylli-hacia-delante.png';
        billyImages.sad = new Image(); billyImages.sad.src = 'bylli-llorando.png';
        billyImages.relax = new Image(); billyImages.relax.src = 'bylli-relax.png';
        billyImages.surprised = new Image(); billyImages.surprised.src = 'bylli-sorprendido.png';
        starImage = new Image(); starImage.src = 'estrella.png';
        
        const checkLoad = () => {
            imagesLoadedCount++;
            if(imagesLoadedCount >= imagesToLoad) imagesLoaded = true;
        };
        
        Object.values(billyImages).forEach(img => { if(img) img.onload = checkLoad; });
        if(starImage) starImage.onload = checkLoad;
    }
    
    function getBillySprite() {
        if(!imagesLoaded) return null;
        if(activePowerups.shield > 0) return billyImages.surprised;
        if(player.state === 'hit') return billyImages.angry;
        if(!player.grounded) {
            if(player.vy < 0) return billyImages.jump;
            return billyImages.fall;
        }
        if(Math.abs(player.vx) > 1) return billyImages.run;
        if(combo >= 3) return billyImages.happy;
        if(combo === 0 && score > 0) return billyImages.relax;
        return billyImages.normal;
    }
    
    // Tipos de plataformas
    // 0: normal (verde), 1: rompible (roja), 2: rebote (azul), 3: aceleradora (amarilla), 4: desaparece (naranja)
    function generatePlatforms() {
        platforms = [];
        // Plataforma base
        platforms.push({
            x: jumpWidth/2 - 40,
            y: jumpHeight - 30,
            width: 80,
            height: 15,
            type: 0,
            originalY: jumpHeight - 30,
            blinkCounter: 0
        });
        
        // Generar plataformas hacia arriba
        let lastY = jumpHeight - 80;
        for(let i = 0; i < 18; i++) {
            let type = Math.random();
            let platformType = 0;
            if(type < 0.6) platformType = 0;
            else if(type < 0.75) platformType = 1;
            else if(type < 0.85) platformType = 2;
            else if(type < 0.93) platformType = 3;
            else platformType = 4;
            
            let x = 20 + Math.random() * (jumpWidth - 100);
            let y = lastY - (40 + Math.random() * 50);
            lastY = y;
            
            platforms.push({
                x: x,
                y: y,
                width: 65,
                height: 12,
                type: platformType,
                originalY: y,
                blinkCounter: 0,
                breaking: false
            });
        }
    }
    
    function generateMonster(platform) {
        if(monsters.length > 8) return;
        if(Math.random() < 0.35) {
            monsters.push({
                x: platform.x + platform.width/2 - 15,
                y: platform.y - 25,
                width: 30,
                height: 25,
                type: 'monster',
                platformIndex: platforms.indexOf(platform),
                patrolDirection: Math.random() > 0.5 ? 1 : -1,
                patrolX: platform.x + platform.width/2 - 15
            });
        }
    }
    
    function generatePowerup(platform) {
        if(powerups.length > 3) return;
        if(Math.random() < 0.2) {
            const types = ['jetpack', 'shield', 'magnet', 'slowmo'];
            powerups.push({
                x: platform.x + platform.width/2 - 12,
                y: platform.y - 28,
                width: 24,
                height: 24,
                type: types[Math.floor(Math.random() * types.length)],
                floatOffset: 0
            });
        }
    }
    
    function resetJumpGame() {
        score = 0;
        lives = currentUser?.jump.lives || 3;
        gameOver = false;
        gamePaused = false;
        combo = 1;
        comboCounter = 0;
        activePowerups = { jetpack: 0, shield: 0, magnet: 0, slowmo: 0 };
        
        player = {
            x: jumpWidth / 2 - 20,
            y: jumpHeight - 120,
            width: 40,
            height: 40,
            vx: 0,
            vy: 0,
            gravity: 0.6,
            jumpPower: -10,
            grounded: true,
            lastGroundY: 0,
            state: 'idle'
        };
        
        scrollSpeed = 0;
        cameraY = 0;
        monsters = [];
        powerups = [];
        particles = [];
        
        generatePlatforms();
        
        // Añadir monstruos y power-ups a plataformas
        platforms.forEach((platform, idx) => {
            if(idx > 0) {
                generateMonster(platform);
                generatePowerup(platform);
            }
        });
        
        updateJumpUI();
    }
    
    function updateJumpUI() {
        document.getElementById('jumpScore').textContent = score;
        const livesContainer = document.getElementById('jumpLivesContainer');
        livesContainer.innerHTML = '';
        for(let i = 0; i < lives; i++) {
            const heart = document.createElement('span');
            heart.className = 'life-heart';
            heart.textContent = '❤️';
            livesContainer.appendChild(heart);
        }
        
        const comboDisplay = document.getElementById('jumpComboDisplay');
        if(combo > 1) {
            comboDisplay.style.display = 'block';
            document.getElementById('comboMultiplier').textContent = combo;
        } else {
            comboDisplay.style.display = 'none';
        }
        
        const powerIndicator = document.getElementById('powerupIndicator');
        if(activePowerups.jetpack > 0) powerIndicator.innerHTML = '🚀 JETPACK';
        else if(activePowerups.shield > 0) powerIndicator.innerHTML = '🛡️ ESCUDO';
        else if(activePowerups.magnet > 0) powerIndicator.innerHTML = '🧲 IMÁN';
        else if(activePowerups.slowmo > 0) powerIndicator.innerHTML = '⏱️ CÁMARA LENTA';
        else powerIndicator.style.display = 'none';
        
        if(activePowerups.jetpack > 0 || activePowerups.shield > 0 || activePowerups.magnet > 0 || activePowerups.slowmo > 0) {
            powerIndicator.style.display = 'block';
        }
    }
    
    function applyDamage() {
        if(activePowerups.shield > 0) {
            activePowerups.shield = 0;
            showNotification("🛡️ Escudo roto!", "normal");
            return;
        }
        
        lives--;
        updateJumpUI();
        player.state = 'hit';
        playHitSound();
        
        // Vibrar si soporta
        if(navigator.vibrate) navigator.vibrate(50);
        
        // Efecto de partículas de daño
        for(let i = 0; i < 8; i++) {
            particles.push({
                x: player.x + player.width/2,
                y: player.y + player.height/2,
                vx: (Math.random() - 0.5) * 5,
                vy: (Math.random() - 0.5) * 5 - 2,
                life: 30,
                color: '#ff4444'
            });
        }
        
        if(lives <= 0) {
            gameOver = true;
            playGameOverSound();
            if(score > (currentUser?.jump.bestScore || 0)) {
                currentUser.jump.bestScore = score;
                currentUser.resources.tokens += Math.floor(score / 10);
                showNotification(`🏆 NUEVO RÉCORD! +${Math.floor(score/10)} BILLY`, "achievement");
                saveUser();
                updateMenuUI();
            }
            currentUser.stats.gamesPlayed++;
            currentUser.stats.totalScore += score;
            saveUser();
            showGameOverModal();
        } else {
            // Respawnear al jugador
            player.x = jumpWidth / 2 - 20;
            player.y = jumpHeight - 120;
            player.vy = 0;
            player.vx = 0;
            player.grounded = true;
            cameraY = 0;
            combo = 1;
            comboCounter = 0;
            
            // Regenerar plataformas
            generatePlatforms();
            monsters = [];
            powerups = [];
            platforms.forEach((platform, idx) => {
                if(idx > 0) {
                    generateMonster(platform);
                    generatePowerup(platform);
                }
            });
        }
        setTimeout(() => { if(player.state === 'hit') player.state = 'idle'; }, 300);
    }
    
    function showGameOverModal() {
        const modal = document.getElementById('gameOverModal');
        modal.innerHTML = `
            <div class="game-over-screen">
                <h2>💀 GAME OVER 💀</h2>
                <p>⭐ Puntuación: ${score}</p>
                <p>🏆 Récord: ${currentUser?.jump.bestScore || 0}</p>
                <button class="restart-btn" id="restartGameBtn">🔄 REINTENTAR</button>
                <button class="menu-restart-btn" id="menuAfterGameBtn">🏠 MENÚ</button>
            </div>
        `;
        modal.style.display = 'flex';
        document.getElementById('restartGameBtn').onclick = () => {
            modal.style.display = 'none';
            resetJumpGame();
        };
        document.getElementById('menuAfterGameBtn').onclick = () => {
            modal.style.display = 'none';
            jumpGameActive = false;
            if(jumpAnimationId) cancelAnimationFrame(jumpAnimationId);
            document.getElementById('jumpContainer').classList.remove('active');
            document.getElementById('mainMenu').style.display = 'flex';
            updateMenuUI();
        };
    }
    
    function updateJumpGame() {
        if(!jumpCanvas || !jumpCtx || gameOver || gamePaused) {
            if(jumpAnimationId) requestAnimationFrame(updateJumpGame);
            return;
        }
        
        const ctx = jumpCtx;
        const w = jumpWidth;
        const h = jumpHeight;
        
        // Limpiar canvas
        ctx.clearRect(0, 0, w, h);
        
        // Fondo con gradiente y estrellas
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#0a0a2a');
        grad.addColorStop(1, '#1a1a3e');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
        
        // Estrellas de fondo
        for(let i = 0; i < 50; i++) {
            ctx.fillStyle = `rgba(255,255,200,${0.2 + Math.sin(Date.now()/1000 + i)*0.1})`;
            ctx.beginPath();
            ctx.arc((i * 37) % w, 30 + (i * 13) % 80, 1.5, 0, Math.PI*2);
            ctx.fill();
        }
        
        // === ACTUALIZAR FÍSICA ===
        let deltaSpeed = 1;
        if(activePowerups.slowmo > 0) deltaSpeed = 0.5;
        
        // Aplicar gravedad
        player.vy += player.gravity * deltaSpeed;
        if(activePowerups.jetpack > 0) {
            player.vy = -5 * deltaSpeed;
            activePowerups.jetpack -= deltaSpeed;
            if(activePowerups.jetpack <= 0) showNotification("⌛ Jetpack terminado", "normal");
        }
        
        player.y += player.vy * deltaSpeed;
        
        // Movimiento horizontal
        if(player.vx !== 0) {
            player.x += player.vx * deltaSpeed;
            player.vx *= 0.98;
        }
        
        // Colisión con bordes
        if(player.x < 0) player.x = 0;
        if(player.x + player.width > w) player.x = w - player.width;
        
        // Scroll de cámara
        let targetCameraY = 0;
        if(player.y < h * 0.4) {
            targetCameraY = Math.min(0, player.y - h * 0.4);
        }
        cameraY += (targetCameraY - cameraY) * 0.1;
        
        // Colisiones con plataformas
        player.grounded = false;
        let landedOnPlatform = false;
        
        for(let i = 0; i < platforms.length; i++) {
            const p = platforms[i];
            const platformY = p.y + cameraY;
            
            // Actualizar plataformas que desaparecen
            if(p.type === 4 && p.breaking) {
                p.blinkCounter++;
                if(p.blinkCounter > 30) {
                    platforms.splice(i, 1);
                    i--;
                    continue;
                }
            }
            
            if(player.vy >= 0 && 
               player.x + player.width > p.x && 
               player.x < p.x + p.width &&
               player.y + player.height > platformY &&
               player.y + player.height < platformY + p.height + 10 &&
               player.y + player.height - player.vy <= platformY + p.height) {
                
                player.y = platformY - player.height;
                player.vy = 0;
                player.grounded = true;
                player.lastGroundY = player.y;
                landedOnPlatform = true;
                
                // Efecto squash al aterrizar
                if(player.vy > 5) {
                    playLandSound();
                    for(let s = 0; s < 5; s++) {
                        particles.push({
                            x: player.x + player.width/2,
                            y: player.y + player.height,
                            vx: (Math.random() - 0.5) * 3,
                            vy: -Math.random() * 3,
                            life: 20,
                            color: '#aaa'
                        });
                    }
                }
                
                // Combo por saltos seguidos
                if(p.y < lastPlatformY - 30) {
                    comboCounter++;
                    if(comboCounter >= 3) {
                        combo = Math.min(5, Math.floor(comboCounter / 3) + 1);
                        showNotification(`🔥 COMBO x${combo}! 🔥`, "normal");
                    }
                } else {
                    comboCounter = Math.max(0, comboCounter - 1);
                }
                lastPlatformY = p.y;
                
                // Efectos según tipo de plataforma
                switch(p.type) {
                    case 1: // Rompible
                        platforms.splice(i, 1);
                        i--;
                        break;
                    case 2: // Rebote
                        player.vy = -14;
                        playJumpSound();
                        break;
                    case 3: // Aceleradora
                        player.vx = Math.sign(player.vx || 1) * 4;
                        break;
                    case 4: // Desaparece
                        p.breaking = true;
                        break;
                }
                
                // Añadir puntuación
                let points = 10 * combo;
                if(activePowerups.double) points *= 2;
                score += points;
                createFloatingNumber(points, player.x + player.width/2, player.y, true);
                updateJumpUI();
                break;
            }
        }
        
        if(player.grounded) {
            player.state = 'idle';
        } else {
            player.state = 'fall';
        }
        
        // Caída al vacío
        if(player.y > h + 100) {
            applyDamage();
            if(lives > 0) {
                player.y = jumpHeight - 120;
                player.vy = 0;
            }
        }
        
        // Actualizar monstruos
        for(let i = 0; i < monsters.length; i++) {
            const m = monsters[i];
            m.x += (m.patrolDirection * 1.5) * deltaSpeed;
            // Patrullaje
            if(m.x < m.patrolX - 25) m.patrolDirection = 1;
            if(m.x > m.patrolX + 25) m.patrolDirection = -1;
            
            // Colisión con jugador
            if(player.x + player.width > m.x && 
               player.x < m.x + m.width &&
               player.y + player.height > m.y + cameraY &&
               player.y < m.y + m.height + cameraY) {
                
                // Aplastar si viene de arriba
                if(player.vy > 0 && player.y + player.height < m.y + cameraY + m.height/2) {
                    // APLASTAR MONSTRUO (como Mario)
                    monsters.splice(i, 1);
                    i--;
                    player.vy = -8;
                    score += 50 * combo;
                    updateJumpUI();
                    playStompSound();
                    createFloatingNumber(50 * combo, m.x + m.width/2, m.y + cameraY, true);
                    
                    // Partículas de muerte
                    for(let s = 0; s < 8; s++) {
                        particles.push({
                            x: m.x + m.width/2,
                            y: m.y + cameraY + m.height/2,
                            vx: (Math.random() - 0.5) * 4,
                            vy: (Math.random() - 0.5) * 4,
                            life: 25,
                            color: '#ff6666'
                        });
                    }
                } else {
                    // Daño por contacto lateral
                    applyDamage();
                }
            }
        }
        
        // Actualizar power-ups flotantes
        for(let i = 0; i < powerups.length; i++) {
            const p = powerups[i];
            p.floatOffset = (p.floatOffset || 0) + 0.05;
            const floatY = Math.sin(p.floatOffset) * 3;
            
            if(player.x + player.width > p.x && 
               player.x < p.x + p.width &&
               player.y + player.height > p.y + cameraY + floatY &&
               player.y < p.y + p.height + cameraY + floatY) {
                
                // Activar power-up
                switch(p.type) {
                    case 'jetpack':
                        activePowerups.jetpack = 180;
                        break;
                    case 'shield':
                        activePowerups.shield = 300;
                        break;
                    case 'magnet':
                        activePowerups.magnet = 360;
                        break;
                    case 'slowmo':
                        activePowerups.slowmo = 240;
                        break;
                }
                powerups.splice(i, 1);
                i--;
                playPowerUpSound();
                showNotification(`🎁 POWER-UP: ${p.type.toUpperCase()}!`, "achievement");
                
                if(currentUser) currentUser.jump.totalPowerups++;
                updateJumpUI();
            }
        }
        
        // Actualizar power-ups activos (temporizadores)
        if(activePowerups.jetpack > 0) activePowerups.jetpack -= deltaSpeed;
        if(activePowerups.shield > 0) activePowerups.shield -= deltaSpeed;
        if(activePowerups.magnet > 0) activePowerups.magnet -= deltaSpeed;
        if(activePowerups.slowmo > 0) activePowerups.slowmo -= deltaSpeed;
        updateJumpUI();
        
        // Imán atrae power-ups
        if(activePowerups.magnet > 0) {
            for(let p of powerups) {
                const dx = (player.x + player.width/2) - (p.x + p.width/2);
                const dy = (player.y + player.height/2) - (p.y + cameraY + p.height/2);
                const dist = Math.sqrt(dx*dx + dy*dy);
                if(dist < 80) {
                    p.x += dx * 0.1;
                    p.y += dy * 0.1;
                }
            }
        }
        
        // Actualizar partículas
        for(let i = 0; i < particles.length; i++) {
            particles[i].x += particles[i].vx;
            particles[i].y += particles[i].vy;
            particles[i].life--;
            if(particles[i].life <= 0) {
                particles.splice(i, 1);
                i--;
            }
        }
        
        // === DIBUJAR ===
        // Plataformas
        for(const p of platforms) {
            const y = p.y + cameraY;
            if(y > h + 100 || y < -100) continue;
            
            // Color según tipo
            switch(p.type) {
                case 0: ctx.fillStyle = '#4CAF50'; break;
                case 1: ctx.fillStyle = '#f44336'; break;
                case 2: ctx.fillStyle = '#2196F3'; break;
                case 3: ctx.fillStyle = '#FFC107'; break;
                case 4: ctx.fillStyle = '#FF9800'; break;
                default: ctx.fillStyle = '#4CAF50';
            }
            
            if(p.type === 4 && p.breaking) {
                ctx.globalAlpha = 0.5 + Math.sin(Date.now() * 0.01) * 0.3;
            }
            
            // Sombra de plataforma
            ctx.shadowBlur = 5;
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.fillRect(p.x, y, p.width, p.height);
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.fillRect(p.x, y, p.width, 3);
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1;
        }
        
        // Power-ups flotantes
        for(const p of powerups) {
            const floatY = Math.sin(p.floatOffset || 0) * 3;
            const y = p.y + cameraY + floatY;
            
            if(starImage && starImage.complete && starImage.naturalWidth > 0) {
                ctx.drawImage(starImage, p.x, y, p.width, p.height);
            } else {
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.ellipse(p.x + p.width/2, y + p.height/2, p.width/2, p.height/2, 0, 0, Math.PI*2);
                ctx.fill();
            }
            
            ctx.fillStyle = 'white';
            ctx.font = `${p.width-6}px "Segoe UI"`;
            ctx.fillText(p.type === 'jetpack' ? '🚀' : (p.type === 'shield' ? '🛡️' : (p.type === 'magnet' ? '🧲' : '⏱️')), p.x + 4, y + p.height - 4);
        }
        
        // Monstruos
        for(const m of monsters) {
            const y = m.y + cameraY;
            ctx.fillStyle = '#6B2E2E';
            ctx.beginPath();
            ctx.ellipse(m.x + m.width/2, y + m.height/2, m.width/2, m.height/2, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#4A1A1A';
            ctx.beginPath();
            ctx.ellipse(m.x + m.width - 8, y + m.height/2 - 4, 4, 5, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(m.x + 8, y + m.height/2 - 4, 4, 5, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#FF4444';
            ctx.beginPath();
            ctx.ellipse(m.x + m.width - 9, y + m.height/2 - 5, 2, 2, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(m.x + 7, y + m.height/2 - 5, 2, 2, 0, 0, Math.PI*2);
            ctx.fill();
            // cejas enojadas
            ctx.fillStyle = '#2A0A0A';
            ctx.fillRect(m.x + m.width - 13, y + m.height/2 - 12, 8, 2);
            ctx.fillRect(m.x + 5, y + m.height/2 - 12, 8, 2);
        }
        
        // Partículas
        for(const p of particles) {
            ctx.fillStyle = p.color || '#FFD966';
            ctx.fillRect(p.x, p.y, 3, 3);
        }
        
        // DIBUJAR BILLY
        const billySprite = getBillySprite();
        if(billySprite && billySprite.complete && billySprite.naturalWidth > 0) {
            ctx.drawImage(billySprite, player.x, player.y, player.width, player.height);
        } else {
            // Fallback
            ctx.fillStyle = '#1a1a1a';
            ctx.beginPath();
            ctx.ellipse(player.x + player.width/2, player.y + player.height/2 - 5, player.width/2.2, player.height/2.5, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#FFD966';
            ctx.beginPath();
            ctx.arc(player.x + player.width/2 - 8, player.y + player.height/2 - 12, 4, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(player.x + player.width/2 + 8, player.y + player.height/2 - 12, 4, 0, Math.PI*2);
            ctx.fill();
        }
        
        // Escudo visual si está activo
        if(activePowerups.shield > 0) {
            ctx.beginPath();
            ctx.arc(player.x + player.width/2, player.y + player.height/2, player.width/2 + 5, 0, Math.PI*2);
            ctx.strokeStyle = '#4CAF50';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(player.x + player.width/2, player.y + player.height/2, player.width/2 + 8, 0, Math.PI*2);
            ctx.strokeStyle = 'rgba(76,175,80,0.5)';
            ctx.stroke();
        }
        
        jumpAnimationId = requestAnimationFrame(updateJumpGame);
    }
    
    function startJumpGame() {
        if(jumpGameActive) return;
        jumpGameActive = true;
        
        loadBillyImages();
        
        jumpWidth = Math.min(window.innerWidth - 30, 400);
        jumpHeight = Math.min(window.innerHeight - 100, 620);
        
        const container = document.getElementById('jumpGameArea');
        container.innerHTML = `<canvas id="jumpMainCanvas" width="${jumpWidth}" height="${jumpHeight}" class="jump-canvas"></canvas>`;
        jumpCanvas = document.getElementById('jumpMainCanvas');
        jumpCtx = jumpCanvas.getContext('2d');
        
        resetJumpGame();
        updateJumpUI();
        
        // Eventos táctiles
        jumpCanvas.onclick = () => {
            if(!gameOver && player.grounded && !activePowerups.jetpack) {
                player.vy = player.jumpPower;
                player.grounded = false;
                playJumpSound();
                if(currentUser) currentUser.jump.totalJumps++;
                player.state = 'jump';
            }
        };
        jumpCanvas.ontouchstart = (e) => {
            e.preventDefault();
            if(!gameOver && player.grounded && !activePowerups.jetpack) {
                player.vy = player.jumpPower;
                player.grounded = false;
                playJumpSound();
                if(currentUser) currentUser.jump.totalJumps++;
                player.state = 'jump';
            }
        };
        
        // Movimiento horizontal con teclado (opcional)
        window.onkeydown = (e) => {
            if(e.key === 'ArrowLeft') player.vx = -4;
            if(e.key === 'ArrowRight') player.vx = 4;
        };
        
        jumpAnimationId = requestAnimationFrame(updateJumpGame);
    }
    
    // ==================== INICIALIZACIÓN ====================
    document.getElementById('startBtn').onclick = () => {
        const nickname = document.getElementById('nicknameInput').value.trim();
        if(registerUser(nickname)) {
            showNotification(`🎉 Bienvenido ${nickname}!`, "achievement");
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('mainMenu').style.display = 'flex';
            updateMenuUI();
            playClickSound();
        }
    };
    
    document.getElementById('playJumpBtn').onclick = () => {
        document.getElementById('mainMenu').style.display = 'none';
        document.getElementById('jumpContainer').classList.add('active');
        startJumpGame();
        playClickSound();
    };
    
    document.getElementById('jumpBackBtn').onclick = () => {
        jumpGameActive = false;
        if(jumpAnimationId) cancelAnimationFrame(jumpAnimationId);
        document.getElementById('jumpContainer').classList.remove('active');
        document.getElementById('mainMenu').style.display = 'flex';
        updateMenuUI();
        playClickSound();
    };
    
    document.getElementById('statsBtn').onclick = () => {
        if(!currentUser) return;
        showNotification(`📊 Partidas: ${currentUser.stats.gamesPlayed} | 🏆 Total: ${currentUser.stats.totalScore} | 💀 Aplastados: ${currentUser.jump.totalStomps}`, "normal");
    };
    
    document.getElementById('shopBtn').onclick = () => {
        showNotification("🛒 Tienda próximamente! Por ahora gana tokens jugando", "normal");
    };
    
    const savedUserId = localStorage.getItem('billyCurrentUser');
    if(savedUserId && loadUser(savedUserId)) {
        document.getElementById('startScreen').style.display = 'none';
        document.getElementById('mainMenu').style.display = 'flex';
        updateMenuUI();
    }
</script>
</body>
</html>
