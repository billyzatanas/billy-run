        document.querySelectorAll('.resource-label')[0].textContent = t.coins;
        document.querySelectorAll('.resource-label')[1].textContent = t.tokens;
    }
    
    // ==================== VARIABLES COMPARTIDAS ====================
    let globalCoins = 0;
    let globalTokens = 0;
    
    function loadGlobalData() {
        const saved = localStorage.getItem('billyGlobalData');
        if(saved) {
            try {
                const data = JSON.parse(saved);
                globalCoins = data.coins || 0;
                globalTokens = data.tokens || 0;
            } catch(e) {}
        }
        updateMenuResources();
    }
    
    function saveGlobalData() {
        localStorage.setItem('billyGlobalData', JSON.stringify({
            coins: globalCoins,
            tokens: globalTokens
        }));
    }
    
    function updateMenuResources() {
        document.getElementById('menuCoins').textContent = Math.floor(globalCoins);
        document.getElementById('menuTokens').textContent = Math.floor(globalTokens);
    }
    
    function addCoins(amount) {
        globalCoins += amount;
        updateMenuResources();
        saveGlobalData();
    }
    
    function addTokens(amount) {
        globalTokens += amount;
        updateMenuResources();
        saveGlobalData();
    }
    
    // ==================== GENERAR ESTRELLAS ====================
    function generateStars() {
        const starsDiv = document.getElementById('stars');
        for(let i = 0; i < 200; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.width = star.style.height = (1 + Math.random() * 2) + 'px';
            star.style.animationDelay = Math.random() * 2 + 's';
            starsDiv.appendChild(star);
        }
    }
    generateStars();
    
    // ==================== MINIJUEGO BILLY JUMP MEJORADO ====================
    let jumpGameActive = false;
    let jumpGame = {
        canvas: null,
        ctx: null,
        width: 0,
        height: 0,
        player: { x: 80, y: 0, width: 35, height: 35, vy: 0, gravity: 0.8, jumpPower: -11, grounded: true },
        obstacles: [],
        score: 0,
        bestScore: 0,
        gameOver: false,
        animationId: null,
        spawnCounter: 0,
        frameCount: 0
    };
    
    function initJumpGame() {
        jumpGame.width = Math.min(window.innerWidth - 40, 380);
        jumpGame.height = 520;
        jumpGame.player.y = jumpGame.height - 80;
        jumpGame.player.width = 34;
        jumpGame.player.height = 34;
        jumpGame.obstacles = [];
        jumpGame.score = 0;
        jumpGame.gameOver = false;
        jumpGame.spawnCounter = 0;
        jumpGame.frameCount = 0;
        
        const savedBest = localStorage.getItem('billyJumpBest');
        jumpGame.bestScore = savedBest ? parseInt(savedBest) : 0;
        
        const container = document.createElement('div');
        container.className = 'jump-game-container';
        container.id = 'jumpGameContainer';
        container.innerHTML = `
            <div class="jump-stats">
                <div class="jump-score">🏆 ${t.jumpBest}: <span id="jumpBest">${jumpGame.bestScore}</span></div>
                <div class="jump-score">⭐ ${t.jumpScore}: <span id="jumpScore">0</span></div>
                <div class="jump-exit" id="jumpExitBtn">✖️ ${t.back}</div>
            </div>
            <canvas id="jumpCanvas" class="jump-game-canvas" width="${jumpGame.width}" height="${jumpGame.height}"></canvas>
            <div class="jump-instruction" id="jumpInstruction">${t.jumpInstructions}</div>
        `;
        document.body.appendChild(container);
        
        jumpGame.canvas = document.getElementById('jumpCanvas');
        jumpGame.ctx = jumpGame.canvas.getContext('2d');
        
        document.getElementById('jumpExitBtn').onclick = closeJumpGame;
        jumpGame.canvas.addEventListener('click', () => jumpAction());
        jumpGame.canvas.addEventListener('touchstart', (e) => { e.preventDefault(); jumpAction(); });
        
        jumpGame.animationId = requestAnimationFrame(updateJumpGame);
    }
    
    function jumpAction() {
        if(!jumpGame.gameOver && jumpGame.player.grounded) {
            jumpGame.player.vy = jumpGame.player.jumpPower;
            jumpGame.player.grounded = false;
            if(window.navigator && window.navigator.vibrate) window.navigator.vibrate(30);
        } else if(jumpGame.gameOver) {
            restartJumpGame();
        }
    }
    
    function updateJumpGame() {
        if(!jumpGame.canvas) return;
        
        const ctx = jumpGame.ctx;
        const w = jumpGame.width;
        const h = jumpGame.height;
        
        ctx.clearRect(0, 0, w, h);
        
        // Fondo con gradiente dinámico según puntuación
        const intensity = Math.min(0.5, jumpGame.score / 200);
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, `rgb(26, 42, 58)`);
        grad.addColorStop(1, `rgb(42, 58, 74)`);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
        
        // Suelo con efecto de profundidad
        ctx.fillStyle = '#5D3A1A';
        ctx.fillRect(0, h - 45, w, 45);
        ctx.fillStyle = '#8B5A2B';
        ctx.fillRect(0, h - 48, w, 3);
        
        // Decoración del suelo
        ctx.fillStyle = '#C97E3A';
        for(let i = 0; i < 15; i++) {
            ctx.fillRect((i * 35 + jumpGame.frameCount) % w, h - 52, 12, 4);
        }
        
        if(!jumpGame.gameOver) {
            // Física del jugador
            jumpGame.player.vy += jumpGame.player.gravity;
            jumpGame.player.y += jumpGame.player.vy;
            
            if(jumpGame.player.y >= h - 45 - jumpGame.player.height) {
                jumpGame.player.y = h - 45 - jumpGame.player.height;
                jumpGame.player.vy = 0;
                jumpGame.player.grounded = true;
            }
            if(jumpGame.player.y < 0) {
                jumpGame.player.y = 0;
                if(jumpGame.player.vy < 0) jumpGame.player.vy = 0;
            }
            
            // Spawn de obstáculos (más difícil con la puntuación)
            jumpGame.spawnCounter++;
            let spawnRate = Math.max(40, 60 - Math.floor(jumpGame.score / 20));
            if(jumpGame.spawnCounter > spawnRate) {
                jumpGame.spawnCounter = 0;
                const obstacleType = Math.random() > 0.7 ? 'bird' : 'rock';
                jumpGame.obstacles.push({
                    x: w,
                    y: h - 45 - (obstacleType === 'rock' ? 38 : 42),
                    width: obstacleType === 'rock' ? 30 : 34,
                    height: obstacleType === 'rock' ? 38 : 34,
                    type: obstacleType
                });
            }
            
            // Actualizar obstáculos
            for(let i = 0; i < jumpGame.obstacles.length; i++) {
                const obs = jumpGame.obstacles[i];
                obs.x -= 4.8 + Math.floor(jumpGame.score / 100);
                
                if(obs.x + obs.width < 0) {
                    jumpGame.obstacles.splice(i, 1);
                    jumpGame.score++;
                    document.getElementById('jumpScore').textContent = jumpGame.score;
                    i--;
                }
                
                // Colisión mejorada
                if(obs.x < jumpGame.player.x + jumpGame.player.width &&
                    obs.x + obs.width > jumpGame.player.x &&
                    obs.y < jumpGame.player.y + jumpGame.player.height &&
                    obs.y + obs.height > jumpGame.player.y) {
                    jumpGame.gameOver = true;
                    if(jumpGame.score > jumpGame.bestScore) {
                        jumpGame.bestScore = jumpGame.score;
                        localStorage.setItem('billyJumpBest', jumpGame.bestScore);
                        document.getElementById('jumpBest').textContent = jumpGame.bestScore;
                    }
                    const reward = Math.floor(jumpGame.score * 6);
                    addCoins(reward);
                    showJumpNotification(t.jumpReward.replace("{reward}", reward));
                    document.getElementById('jumpInstruction').innerHTML = `${t.gameOver} - ${t.restart}`;
                }
            }
        }
        
        // Dibujar obstáculos con estilo mejorado
        for(const obs of jumpGame.obstacles) {
            if(obs.type === 'rock') {
                ctx.fillStyle = '#6B4E2E';
                ctx.shadowBlur = 4;
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                ctx.fillStyle = '#4A2A1A';
                ctx.fillRect(obs.x + 6, obs.y + 10, 6, 12);
                ctx.fillRect(obs.x + 16, obs.y + 6, 6, 16);
            } else {
                ctx.fillStyle = '#4A4A4A';
                ctx.beginPath();
                ctx.ellipse(obs.x + obs.width/2, obs.y + obs.height/2, obs.width/2, obs.height/2, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#2D2D2D';
                ctx.beginPath();
                ctx.ellipse(obs.x + obs.width/2 - 7, obs.y + obs.height/2 - 5, 3, 3, 0, 0, Math.PI * 2);
                ctx.ellipse(obs.x + obs.width/2 + 7, obs.y + obs.height/2 - 5, 3, 3, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#FF6B6B';
                ctx.beginPath();
                ctx.moveTo(obs.x + obs.width/2, obs.y + obs.height/2 + 6);
                ctx.lineTo(obs.x + obs.width/2 - 6, obs.y + obs.height/2 + 14);
                ctx.lineTo(obs.x + obs.width/2 + 6, obs.y + obs.height/2 + 14);
                ctx.fill();
            }
        }
        
        ctx.shadowBlur = 0;
        
        // Dibujar jugador (gato negro con animación de salto)
        ctx.fillStyle = '#1a1a2a';
        ctx.shadowBlur = 4;
        ctx.beginPath();
        ctx.ellipse(jumpGame.player.x + jumpGame.player.width/2, jumpGame.player.y + jumpGame.player.height/2, 
                    jumpGame.player.width/2, jumpGame.player.height/2, 0, 0, Math.PI * 2);
        ctx.fill();
        
        // Orejas
        ctx.fillStyle = '#0a0a1a';
        ctx.beginPath();
        ctx.moveTo(jumpGame.player.x + 7, jumpGame.player.y + 8);
        ctx.lineTo(jumpGame.player.x + 15, jumpGame.player.y - 6);
        ctx.lineTo(jumpGame.player.x + 23, jumpGame.player.y + 8);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(jumpGame.player.x + jumpGame.player.width - 7, jumpGame.player.y + 8);
        ctx.lineTo(jumpGame.player.x + jumpGame.player.width - 15, jumpGame.player.y - 6);
        ctx.lineTo(jumpGame.player.x + jumpGame.player.width - 23, jumpGame.player.y + 8);
        ctx.fill();
        
        // Ojos brillantes
        ctx.fillStyle = '#FFD966';
        ctx.beginPath();
        ctx.ellipse(jumpGame.player.x + jumpGame.player.width/2 - 8, jumpGame.player.y + jumpGame.player.height/2 - 4, 4, 5, 0, 0, Math.PI * 2);
        ctx.ellipse(jumpGame.player.x + jumpGame.player.width/2 + 8, jumpGame.player.y + jumpGame.player.height/2 - 4, 4, 5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.ellipse(jumpGame.player.x + jumpGame.player.width/2 - 8, jumpGame.player.y + jumpGame.player.height/2 - 5, 2, 2.5, 0, 0, Math.PI * 2);
        ctx.ellipse(jumpGame.player.x + jumpGame.player.width/2 + 8, jumpGame.player.y + jumpGame.player.height/2 - 5, 2, 2.5, 0, 0, Math.PI * 2);
        ctx.fill();
        
        // Bigotes
        ctx.strokeStyle = 'white';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(jumpGame.player.x + jumpGame.player.width/2 - 12, jumpGame.player.y + jumpGame.player.height/2 - 2);
        ctx.lineTo(jumpGame.player.x + jumpGame.player.width/2 - 24, jumpGame.player.y + jumpGame.player.height/2 - 5);
        ctx.moveTo(jumpGame.player.x + jumpGame.player.width/2 - 12, jumpGame.player.y + jumpGame.player.height/2);
        ctx.lineTo(jumpGame.player.x + jumpGame.player.width/2 - 24, jumpGame.player.y + jumpGame.player.height/2);
        ctx.moveTo(jumpGame.player.x + jumpGame.player.width/2 - 12, jumpGame.player.y + jumpGame.player.height/2 + 2);
        ctx.lineTo(jumpGame.player.x + jumpGame.player.width/2 - 24, jumpGame.player.y + jumpGame.player.height/2 + 5);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(jumpGame.player.x + jumpGame.player.width/2 + 12, jumpGame.player.y + jumpGame.player.height/2 - 2);
        ctx.lineTo(jumpGame.player.x + jumpGame.player.width/2 + 24, jumpGame.player.y + jumpGame.player.height/2 - 5);
        ctx.moveTo(jumpGame.player.x + jumpGame.player.width/2 + 12, jumpGame.player.y + jumpGame.player.height/2);
        ctx.lineTo(jumpGame.player.x + jumpGame.player.width/2 + 24, jumpGame.player.y + jumpGame.player.height/2);
        ctx.moveTo(jumpGame.player.x + jumpGame.player.width/2 + 12, jumpGame.player.y + jumpGame.player.height/2 + 2);
        ctx.lineTo(jumpGame.player.x + jumpGame.player.width/2 + 24, jumpGame.player.y + jumpGame.player.height/2 + 5);
        ctx.stroke();
        
        ctx.shadowBlur = 0;
        
        // Efecto de velocidad al fondo
        if(jumpGame.score > 30) {
            ctx.fillStyle = `rgba(255,255,200,${Math.min(0.3, jumpGame.score / 300)})`;
            for(let i = 0; i < 10; i++) {
                ctx.fillRect((jumpGame.frameCount * 3 + i * 50) % w, h - 70, 3, 8);
            }
        }
        
        // Game Over
        if(jumpGame.gameOver) {
            ctx.fillStyle = 'rgba(0,0,0,0.75)';
            ctx.fillRect(0, 0, w, h);
            ctx.fillStyle = 'white';
            ctx.font = 'bold 28px "Segoe UI"';
            ctx.textAlign = 'center';
            ctx.fillText(t.gameOver, w/2, h/2 - 30);
            ctx.font = '16px "Segoe UI"';
            ctx.fillText(t.restart, w/2, h/2 + 30);
            ctx.fillStyle = '#FFD966';
            ctx.fillText(`🏆 ${jumpGame.score} pts`, w/2, h/2 + 80);
        }
        
        jumpGame.frameCount++;
        jumpGame.animationId = requestAnimationFrame(updateJumpGame);
    }
    
    function restartJumpGame() {
        jumpGame.player.y = jumpGame.height - 80;
        jumpGame.player.vy = 0;
        jumpGame.player.grounded = true;
        jumpGame.obstacles = [];
        jumpGame.score = 0;
        jumpGame.gameOver = false;
        jumpGame.spawnCounter = 0;
        document.getElementById('jumpScore').textContent = 0;
        document.getElementById('jumpInstruction').innerHTML = t.jumpInstructions;
    }
    
    function closeJumpGame() {
        if(jumpGame.animationId) cancelAnimationFrame(jumpGame.animationId);
        const container = document.getElementById('jumpGameContainer');
        if(container) container.remove();
        jumpGameActive = false;
        document.getElementById('startScreen').style.display = 'flex';
    }
    
    function showJumpNotification(msg) {
        const div = document.createElement('div');
        div.className = 'notification achievement';
        div.textContent = msg;
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 1200);
    }
    
    function openJumpGame() {
        if(jumpGameActive) return;
        jumpGameActive = true;
        document.getElementById('startScreen').style.display = 'none';
        initJumpGame();
    }
    
    // ==================== NAVEGACIÓN ====================
    function openClickerGame() {
        document.getElementById('startScreen').style.display = 'none';
        document.getElementById('clickerGameContainer').classList.add('active');
        if(typeof startClickerGame === 'function') startClickerGame();
    }
    
    function backToMenu() {
        document.getElementById('startScreen').style.display = 'flex';
        document.getElementById('clickerGameContainer').classList.remove('active');
        if(typeof saveClickerGame === 'function') saveClickerGame();
    }
    
    // ==================== INICIALIZACIÓN ====================
    document.getElementById('selectClickerBtn').onclick = openClickerGame;
    document.getElementById('selectJumpBtn').onclick = openJumpGame;
    document.getElementById('langEsBtn').onclick = () => setLanguage('es');
    document.getElementById('langEnBtn').onclick = () => setLanguage('en');
    
    loadGlobalData();
    updateMenuTexts();
</script>

<!-- Script del juego Clicker (Todas las funcionalidades anteriores) -->
<script>
    // ==================== VARIABLES DEL CLICKER ====================
    let gameStarted = false;
    let coins = 0;
    let level = 1;
    let multiplier = 1;
    let tapPower = 1;
    let energy = 100;
    let maxEnergy = 100;
    let combo = 0;
    let bestCombo = 0;
    let highScore = 0;
    let comboTimer = null;
    let billyTokens = 0;
    let totalTaps = 0;
    let totalMiceCaught = 0;
    let totalCrits = 0;
    let noCritCounter = 0;
    let superComboActive = false;
    let goldenBilly = false;
    let musicEnabled = true;
    
    let quickTapStreak = 0;
    let lastTapTime = 0;
    let streakBonusMultiplier = 1;
    
    // Árbol de habilidades
    let skills = {
        strength: { level: 0, maxLevel: 5, bonus: 0, cost: [50, 150, 400, 1000, 2500] },
        energy: { level: 0, maxLevel: 5, bonus: 0, cost: [40, 120, 300, 800, 2000] },
        luck: { level: 0, maxLevel: 5, bonus: 0, cost: [60, 180, 450, 1200, 3000] },
        economy: { level: 0, maxLevel: 5, bonus: 0, cost: [50, 150, 400, 1000, 2500] }
    };
    
    // Mascotas con funcionalidad real
    let pets = {
        dog: { id: 'dog', unlocked: false, level: 0, maxLevel: 3, equipped: false, name: '🐕 Perrito', effect: 0, effectValue: [0.3, 0.6, 1.0], cost: [300, 800, 2000] },
        owl: { id: 'owl', unlocked: false, level: 0, maxLevel: 3, equipped: false, name: '🦉 Búho', effect: 0, effectValue: [5, 10, 15], cost: [400, 1000, 2500] },
        bee: { id: 'bee', unlocked: false, level: 0, maxLevel: 3, equipped: false, name: '🐝 Abeja', effect: 0, effectValue: [5, 12, 25], cost: [250, 600, 1500] },
        dragon: { id: 'dragon', unlocked: false, level: 0, maxLevel: 3, equipped: false, name: '🐉 Dragón', effect: 0, effectValue: [1.05, 1.10, 1.20], cost: [1000, 2500, 6000] }
    };
    let activePet = null;
    let petIntervals = [];
    
    // Skins
    let skins = [
        { name: "Original", nameEn: "Original", nameEs: "Original", unlocked: true, price: 0, emoji: "🐱" },
        { name: "Golden", nameEn: "Golden", nameEs: "Dorado", unlocked: false, price: 500, emoji: "🐱✨" },
        { name: "Elite", nameEn: "Elite", nameEs: "Élite", unlocked: false, price: 1500, emoji: "🐱🔥" }
    ];
    let currentSkin = 0;
    
    // Desafíos
    let challenges = { mice: 0, crits: 0, maxCombo: 0 };
    let weeklyRewards = { mice: 25, crits: 15, combo: 12 };
    
    // Logros
    let achievements = {
        taps100: false, taps500: false, taps1000: false,
        mice50: false, mice200: false, combo20: false,
        level10: false, crits100: false
    };
    
    // Entidades
    let mice = [];
    let bubbles = [];
    let mouseStreak = 0;
    
    // Eventos
    let goldenHourActive = false;
    let doubleEventActive = false;
    
    // Posición de Billy
    let targetX = window.innerWidth / 2;
    let targetY = window.innerHeight / 2;
    let billyX = window.innerWidth / 2;
    let billyY = window.innerHeight / 2;
    
    // ==================== FUNCIONES DE HABILIDADES ====================
    function updateSkillBonuses() {
        skills.strength.bonus = skills.strength.level * 0.5;
        skills.energy.bonus = skills.energy.level * 20;
        skills.luck.bonus = skills.luck.level * 3;
        skills.economy.bonus = 1 + (skills.economy.level * 0.1);
        
        maxEnergy = 100 + Math.floor(level / 2) * 5 + skills.energy.bonus;
        if(energy > maxEnergy) energy = maxEnergy;
        return skills;
    }
    
    function getLuckBonus() { return skills.luck.bonus; }
    function getEconomyBonus() { return skills.economy.bonus; }
    function getTapPowerBonus() { return 1 + (skills.strength.bonus / 10); }
    function getDragonBonus() { return activePet === 'dragon' ? pets.dragon.effect : 1; }
    
    function upgradeSkill(skillId) {
        const skill = skills[skillId];
        if(skill.level < skill.maxLevel) {
            const cost = skill.cost[skill.level];
            if(billyTokens >= cost) {
                billyTokens -= cost;
                skill.level++;
                updateSkillBonuses();
                updateUI();
                saveGame();
                showNotification(`${t.skillUpgrade} ${skillId} ${skill.level}/${skill.maxLevel}`, "achievement");
                return true;
            } else {
                showNotification(t.needTokens.replace("{cost}", cost - billyTokens));
            }
        }
        return false;
    }
    
    // ==================== MASCOTAS FUNCIONALES ====================
    function startPetEffects() {
        petIntervals.forEach(clearInterval);
        petIntervals = [];
        if(!activePet) return;
        
        const pet = pets[activePet];
        
        if(activePet === 'dog') {
            const interval = setInterval(() => {
                if(gameStarted && mice.length > 0 && Math.random() < pet.effect * 0.5) {
                    const randomMouse = mice[Math.floor(Math.random() * mice.length)];
                    if(randomMouse) {
                        const gain = Math.floor(randomMouse.value);
                        coins += gain;
                        totalMiceCaught++;
                        showNotification(t.petCollect.replace("{value}", gain), "pet");
                        mice = mice.filter(m => m !== randomMouse);
                        renderEntities();
                        updateUI();
                        updateLevel();
                    }
                }
            }, 8000);
            petIntervals.push(interval);
        }
        
        if(activePet === 'bee') {
            const interval = setInterval(() => {
                if(gameStarted) {
                    const gain = Math.floor(pet.effect * getEconomyBonus());
                    coins += gain;
                    floatingNumber(gain, billyX, billyY - 30, false);
                    showNotification(t.petGenerate.replace("{value}", gain), "pet");
                    updateUI();
                    updateLevel();
                }
            }, 30000);
            petIntervals.push(interval);
        }
        
        if(activePet === 'owl') {
            const interval = setInterval(() => {
                if(gameStarted) showNotification(`🦉 ${t.petCrit} +${pet.effect}%`, "pet");
            }, 45000);
            petIntervals.push(interval);
        }
        
        if(activePet === 'dragon') {
            const interval = setInterval(() => {
                if(gameStarted) showNotification(`🐉 ${t.petDragonDesc} x${pet.effect}`, "pet");
            }, 60000);
            petIntervals.push(interval);
        }
    }
    
    function unlockPet(petId) {
        const pet = pets[petId];
        if(!pet.unlocked) {
            const cost = pet.cost[0];
            if(billyTokens >= cost) {
                billyTokens -= cost;
                pet.unlocked = true;
                pet.level = 1;
                pet.effect = pet.effectValue[0];
                updateUI();
                saveGame();
                showNotification(`🐾 ${pet.name} ${t.petUnlock}ed!`, "achievement");
                return true;
            } else {
                showNotification(t.needTokens.replace("{cost}", cost - billyTokens));
            }
        }
        return false;
    }
    
    function upgradePet(petId) {
        const pet = pets[petId];
        if(pet.unlocked && pet.level < pet.maxLevel) {
            const cost = pet.cost[pet.level];
            if(billyTokens >= cost) {
                billyTokens -= cost;
                pet.level++;
                pet.effect = pet.effectValue[pet.level - 1];
                updateUI();
                saveGame();
                showNotification(`🐾 ${pet.name} ${t.petUpgrade} ${pet.level}/${pet.maxLevel}`, "achievement");
                if(activePet === petId) startPetEffects();
                return true;
            } else {
                showNotification(t.needTokens.replace("{cost}", cost - billyTokens));
            }
        }
        return false;
    }
    
    function equipPet(petId) {
        if(activePet) pets[activePet].equipped = false;
        if(pets[petId].unlocked) {
            activePet = petId;
            pets[petId].equipped = true;
            updateUI();
            saveGame();
            startPetEffects();
            showNotification(`🐾 ${pets[petId].name} ${t.equip}ed!`, "pet");
            updatePetFollower();
        }
    }
    
    // ==================== TIENDA UNIFICADA ====================
    function openShop() {
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="modal-content">
                <h2>${t.shopTitle}</h2>
                <div class="shop-tabs">
                    <div class="shop-tab active" data-tab="skins">${t.skinsTab}</div>
                    <div class="shop-tab" data-tab="pets">${t.petsTab}</div>
                    <div class="shop-tab" data-tab="skills">${t.skillsTab}</div>
                </div>
                <div id="skinsSection" class="shop-section active">
                    ${skins.map((skin, idx) => `
                        <div class="skin-item ${currentSkin === idx ? 'equipped' : ''}" onclick="equipSkin(${idx})">
                            <div class="skin-info">
                                <div class="skin-name">${skin[currentLang === 'es' ? 'nameEs' : 'nameEn']} ${skin.emoji}</div>
                                ${!skin.unlocked ? `<div class="skin-price">${t.priceTokens.replace("{price}", skin.price)}</div>` : ''}
                            </div>
                            ${!skin.unlocked ? 
                                `<button class="buy-btn" onclick="event.stopPropagation(); buySkin(${idx})">${t.buy}</button>` :
                                `<button class="equip-btn" style="background:#22c55e;" onclick="event.stopPropagation(); equipSkin(${idx})">${currentSkin === idx ? t.equipped : t.equip}</button>`
                            }
                        </div>
                    `).join('')}
                </div>
                <div id="petsSection" class="shop-section">
                    ${Object.entries(pets).map(([id, pet]) => `
                        <div class="pet-card ${activePet === id ? 'equipped' : ''}">
                            <div class="pet-info">
                                <div class="pet-name">${pet.name}</div>
                                <div class="pet-desc">${pet.id === 'dog' ? t.petDogDesc : pet.id === 'owl' ? t.petOwlDesc : pet.id === 'bee' ? t.petBeeDesc : t.petDragonDesc}</div>
                                ${pet.unlocked ? `<div class="pet-price">${t.petLevel.replace("{level}", `${pet.level}/${pet.maxLevel}`)} - ${pet.id === 'dog' ? `${pet.effect*100}%` : pet.id === 'bee' ? `${pet.effect} mon/min` : pet.id === 'owl' ? `+${pet.effect}%` : `x${pet.effect}`}</div>` : `<div class="pet-price">${t.priceTokens.replace("{price}", pet.cost[0])}</div>`}
                            </div>
                            <div>
                                ${!pet.unlocked ? 
                                    `<button class="buy-btn" onclick="unlockPet('${id}')">${t.petUnlock}</button>` :
                                    pet.level < pet.maxLevel ?
                                    `<button class="upgrade-btn" onclick="upgradePet('${id}')">${t.petUpgrade} (${pet.cost[pet.level]} BILLY)</button>` : ''
                                }
                                ${pet.unlocked && activePet !== id ? 
                                    `<button class="equip-btn" onclick="equipPet('${id}')">${t.equip}</button>` :
                                    activePet === id ? `<button class="equip-btn" disabled style="opacity:0.5;background:#22c55e;">${t.equipped}</button>` : ''
                                }
                            </div>
                        </div>
                    `).join('')}
                </div>
                <div id="skillsSection" class="shop-section">
                    ${Object.entries(skills).map(([id, skill]) => `
                        <div class="skill-branch">
                            <div class="skin-info">
                                <div class="skin-name">${t[`skill${id.charAt(0).toUpperCase() + id.slice(1)}`] || id}</div>
                                <div class="skin-price">${t[`skill${id.charAt(0).toUpperCase() + id.slice(1)}Desc`] || ''} (${skill.level}/${skill.maxLevel})</div>
                            </div>
                            <button class="buy-btn" onclick="upgradeSkill('${id}')" ${skill.level >= skill.maxLevel ? 'disabled' : ''}>
                                ${skill.level >= skill.maxLevel ? t.skillMax : `${t.skillUpgrade} (${skill.cost[skill.level]} BILLY)`}
                            </button>
                        </div>
                    `).join('')}
                </div>
                <button class="close-modal" onclick="this.closest('.modal').remove()">${t.close}</button>
            </div>
        `;
        document.body.appendChild(modal);
        
        // Tabs functionality
        const tabs = modal.querySelectorAll('.shop-tab');
        const sections = { skins: modal.querySelector('#skinsSection'), pets: modal.querySelector('#petsSection'), skills: modal.querySelector('#skillsSection') };
        tabs.forEach(tab => {
            tab.onclick = () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                Object.keys(sections).forEach(s => sections[s].classList.remove('active'));
                sections[tab.dataset.tab].classList.add('active');
            };
        });
    }
    
    function buySkin(skinIndex) {
        const skin = skins[skinIndex];
        if(billyTokens >= skin.price) {
            billyTokens -= skin.price;
            skins[skinIndex].unlocked = true;
            currentSkin = skinIndex;
            updateUI();
            showNotification(t.skinUnlocked.replace("{skin}", skin[currentLang === 'es' ? 'nameEs' : 'nameEn']), "achievement");
            saveGame();
            document.querySelector('.modal')?.remove();
            openShop();
        } else {
            showNotification(t.needTokens.replace("{cost}", skin.price - billyTokens));
        }
    }
    
    function equipSkin(skinIndex) {
        if(skins[skinIndex].unlocked) {
            currentSkin = skinIndex;
            updateUI();
            showNotification(t.skinEquipped.replace("{skin}", skins[skinIndex][currentLang === 'es' ? 'nameEs' : 'nameEn']), "achievement");
            saveGame();
            document.querySelector('.modal')?.remove();
            openShop();
        }
    }
    
    // ==================== FUNCIONES UI ====================
    function updateUI() {
        document.getElementById('level').textContent = level;
        document.getElementById('coins').textContent = Math.floor(coins);
        document.getElementById('multiplier').textContent = multiplier;
        document.getElementById('tapPower').textContent = tapPower;
        document.getElementById('comboCount').textContent = combo;
        document.getElementById('energyCurrent').textContent = Math.floor(energy);
        document.getElementById('energyMax').textContent = maxEnergy;
        document.getElementById('energyFill').style.width = (energy / maxEnergy * 100) + '%';
        document.getElementById('billyTokens').textContent = Math.floor(billyTokens);
        document.getElementById('bestCombo').textContent = bestCombo;
        document.getElementById('highScore').textContent = highScore;
        
        const petPanel = document.getElementById('petPanel');
        if(activePet && pets[activePet]) {
            petPanel.innerHTML = `<div class="pet-avatar">${pets[activePet].name.split(' ')[0]}</div><span>${pets[activePet].name} Lv${pets[activePet].level}</span>`;
        } else {
            petPanel.innerHTML = `<div class="pet-avatar">🐾</div><span>${t.pets}</span>`;
        }
        
        if(coins > highScore) highScore = Math.floor(coins);
        
        const streakEl = document.getElementById('streakIndicator');
        if(streakEl && quickTapStreak > 1) {
            streakEl.innerHTML = `⚡ ${t.tapStreak || 'Racha'} ${quickTapStreak}x`;
            streakEl.style.display = 'block';
        } else if(streakEl) streakEl.style.display = 'none';
        
        const billyDiv = document.getElementById('billy');
        if(currentSkin === 1) billyDiv.style.background = 'radial-gradient(circle, #FFD700, #FFA500)';
        else if(currentSkin === 2) billyDiv.style.background = 'radial-gradient(circle, #FF6B6B, #FF4444)';
        else billyDiv.style.background = 'radial-gradient(circle, #FFD966, #FFA500)';
        
        if(goldenBilly || superComboActive) billyDiv.classList.add('billy-golden');
        else billyDiv.classList.remove('billy-golden');
        
        updatePetFollower();
    }
    
    function updatePetFollower() {
        const follower = document.getElementById('petFollower');
        if(activePet) {
            let emoji = '';
            switch(activePet) {
                case 'dog': emoji = '🐕'; break;
                case 'owl': emoji = '🦉'; break;
                case 'bee': emoji = '🐝'; break;
                case 'dragon': emoji = '🐉'; break;
            }
            follower.textContent = emoji;
            follower.style.display = 'block';
        } else {
            follower.style.display = 'none';
        }
    }
    
    function showNotification(msg, type = "normal") {
        const div = document.createElement('div');
        div.className = `notification ${type}`;
        div.textContent = msg;
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 1200);
    }
    
    function floatingNumber(value, x, y, isCrit = false) {
        const div = document.createElement('div');
        div.className = 'floating-number';
        div.textContent = `+${Math.floor(value)}`;
        div.style.left = x + 'px';
        div.style.top = y + 'px';
        div.style.color = isCrit ? '#FFD966' : '#FFFFFF';
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 700);
    }
    
    function createRipple(x, y) {
        const ripple = document.createElement('div');
        ripple.className = 'ripple';
        ripple.style.left = (x - 35) + 'px';
        ripple.style.top = (y - 35) + 'px';
        document.body.appendChild(ripple);
        setTimeout(() => ripple.remove(), 500);
    }
    
    function createParticles(x, y, color) {
        for(let i = 0; i < 12; i++) {
            const particle = document.createElement('div');
            particle.style.cssText = `position:fixed;left:${x}px;top:${y}px;width:6px;height:6px;background:${color};border-radius:50%;pointer-events:none;z-index:100;`;
            const angle = Math.random() * Math.PI * 2;
            const speed = 2 + Math.random() * 5;
            let vx = Math.cos(angle) * speed;
            let vy = Math.sin(angle) * speed - 2;
            let life = 30;
            document.body.appendChild(particle);
            function animate() {
                life--;
                if(life <= 0) { particle.remove(); return; }
                particle.style.left = (parseFloat(particle.style.left) + vx) + 'px';
                particle.style.top = (parseFloat(particle.style.top) + vy) + 'px';
                particle.style.opacity = life / 30;
                requestAnimationFrame(animate);
            }
            animate();
        }
    }
    
    // ==================== SISTEMA DE COMBO ====================
    function addCombo() {
        combo++;
        if(combo > bestCombo) {
            bestCombo = combo;
            if(combo > challenges.maxCombo) challenges.maxCombo = combo;
        }
        
        const comboEl = document.getElementById('comboCount');
        comboEl.style.animation = 'none';
        comboEl.offsetHeight;
        comboEl.style.animation = 'glow 0.3s ease';
        setTimeout(() => comboEl.style.animation = '', 300);
        
        if(combo >= 12 && !superComboActive) {
            superComboActive = true;
            goldenBilly = true;
            showNotification(t.superCombo);
            setTimeout(() => {
                if(combo < 12) { goldenBilly = false; superComboActive = false; }
            }, 5000);
        }
        
        clearTimeout(comboTimer);
        comboTimer = setTimeout(() => {
            if(combo >= 3) showNotification(t.comboLost);
            combo = 0;
            superComboActive = false;
            goldenBilly = false;
            updateUI();
        }, 2000);
        
        updateUI();
        updateChallenges();
    }
    
    function updateQuickTapStreak() {
        const now = Date.now();
        if(now - lastTapTime < 800) {
            quickTapStreak++;
            if(quickTapStreak > 10) quickTapStreak = 10;
            streakBonusMultiplier = 1 + (quickTapStreak * 0.05);
        } else {
            quickTapStreak = 1;
            streakBonusMultiplier = 1;
        }
        lastTapTime = now;
        
        if(quickTapStreak >= 5 && quickTapStreak % 5 === 0) {
            showNotification(`${t.streakBonus || '🔥 RACHA RÁPIDA!'} +${Math.floor(quickTapStreak * 5)} BILLY`, "achievement");
            billyTokens += quickTapStreak * 5;
            updateUI();
        }
        return streakBonusMultiplier;
    }
    
    // ==================== SISTEMA DE NIVEL ====================
    function updateLevel() {
        let needed = 120 * Math.pow(1.28, level - 1);
        if(coins >= needed) {
            level++;
            multiplier = 1 + Math.floor(level / 4);
            updateSkillBonuses();
            energy = Math.min(maxEnergy, energy + 40);
            showNotification(t.levelUp.replace("{level}", level), "achievement");
            updateUI();
            checkAchievements();
            updateLevel();
        }
    }
    
    // ==================== TAP EN BILLY ====================
    function tapBilly(event) {
        if(!gameStarted) return;
        if(energy <= 0) { showNotification(t.noEnergy); return; }
        
        const streakBonus = updateQuickTapStreak();
        addCombo();
        totalTaps++;
        if(window.navigator && window.navigator.vibrate) window.navigator.vibrate(50);
        
        let critChance = 12 + Math.floor(combo / 2.5) + getLuckBonus();
        if(activePet === 'owl') critChance += pets.owl.effect;
        if(noCritCounter >= 8) { critChance = 100; noCritCounter = 0; showNotification(t.critGuaranteed, "crit"); }
        
        const isCrit = Math.random() * 100 < critChance;
        if(isCrit) { noCritCounter = 0; totalCrits++; challenges.crits++; }
        else noCritCounter++;
        
        let gain = tapPower * multiplier * (isCrit ? 4 : 1) * (1 + combo * 0.03) * streakBonus * getTapPowerBonus() * getEconomyBonus() * getDragonBonus();
        if(superComboActive) gain *= 1.5;
        if(doubleEventActive) gain *= 2;
        gain = Math.floor(Math.max(1, gain));
        coins += gain;
        
        let energyCost = Math.max(1, Math.floor(combo / 8));
        energy = Math.max(0, energy - energyCost);
        
        updateUI();
        updateLevel();
        billyTokens += Math.floor(gain / 10);
        
        const billyDiv = document.getElementById('billy');
        billyDiv.style.transform = 'scale(0.92)';
        setTimeout(() => billyDiv.style.transform = 'scale(1)', 100);
        
        const clickX = event.clientX || (event.touches ? event.touches[0].clientX : billyX);
        const clickY = event.clientY || (event.touches ? event.touches[0].clientY : billyY);
        
        createRipple(clickX, clickY);
        createParticles(clickX, clickY, isCrit ? '#FFD966' : '#A5F0A0');
        floatingNumber(gain, clickX, clickY, isCrit);
        
        updateChallenges();
        checkAchievements();
        playSound(isCrit ? 880 : 660);
    }
    
    function playSound(freq) {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.frequency.value = freq;
            gainNode.gain.value = 0.08;
            osc.start();
            gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.2);
            osc.stop(audioCtx.currentTime + 0.2);
        } catch(e) {}
    }
    
    // ==================== RATONES ====================
    function spawnMouse() {
        if(!gameStarted || mice.length > 10) return;
        const rand = Math.random();
        let isGolden = goldenHourActive ? true : rand < 0.12;
        let isBoss = !isGolden && rand < 0.2 && level >= 3;
        
        const size = isBoss ? 70 : 45;
        const yPos = 100 + Math.random() * (window.innerHeight - 220);
        const fromLeft = Math.random() < 0.5;
        const xStart = fromLeft ? -70 : window.innerWidth + 70;
        const dir = fromLeft ? 1 : -1;
        let valueMulti = isBoss ? 12 : (isGolden ? 7 : 2.5);
        const value = Math.floor(tapPower * multiplier * valueMulti * getEconomyBonus() * getDragonBonus());
        
        mice.push({ x: xStart, y: yPos, size: size, dir: dir, speed: isBoss ? 0.9 : 1.4 + Math.random() * 1.2, isGolden: isGolden, isBoss: isBoss, value: value });
    }
    
    function updateMice() {
        for(let i = mice.length - 1; i >= 0; i--) {
            mice[i].x += mice[i].speed * mice[i].dir;
            if((mice[i].dir === 1 && mice[i].x > window.innerWidth + 100) || (mice[i].dir === -1 && mice[i].x < -100)) mice.splice(i, 1);
        }
    }
    
    function catchMouse(index, clickX, clickY) {
        if(index >= mice.length) return;
        const m = mice[index];
        const gain = Math.floor(m.value);
        coins += gain;
        totalMiceCaught++;
        challenges.mice++;
        mouseStreak++;
        
        if(mouseStreak >= 3) {
            let bonus = Math.floor(gain * 0.4);
            coins += bonus;
            floatingNumber(bonus, clickX, clickY - 30, false);
            showNotification(t.mouseStreak);
            mouseStreak = 0;
        }
        
        createParticles(clickX, clickY, m.isGolden ? '#FFD966' : '#F59E0B');
        floatingNumber(gain, clickX, clickY, m.isGolden);
        billyTokens += Math.floor(gain / 10);
        
        updateUI();
        updateLevel();
        updateChallenges();
        checkAchievements();
        
        mice.splice(index, 1);
        renderEntities();
    }
    
    // ==================== BURBUJAS ====================
    function spawnBubble() {
        if(!gameStarted || bubbles.length > 6) return;
        const size = 45 + Math.random() * 35;
        bubbles.push({
            x: 40 + Math.random() * (window.innerWidth - size - 40),
            y: 120 + Math.random() * (window.innerHeight - 240),
            size: size,
            value: Math.floor(tapPower * multiplier * (Math.random() < 0.25 ? 5 : 2.2) * getEconomyBonus() * getDragonBonus()),
            life: 8000, created: Date.now()
        });
    }
    
    function updateBubbles() {
        const now = Date.now();
        for(let i = bubbles.length - 1; i >= 0; i--) {
            if(now - bubbles[i].created > bubbles[i].life) bubbles.splice(i, 1);
        }
    }
    
    function catchBubble(index, clickX, clickY) {
        if(index >= bubbles.length) return;
        const b = bubbles[index];
        const gain = Math.floor(b.value);
        coins += gain;
        createParticles(clickX, clickY, '#FFD966');
        floatingNumber(gain, clickX, clickY, true);
        billyTokens += Math.floor(gain / 10);
        updateUI();
        updateLevel();
        bubbles.splice(index, 1);
        renderEntities();
    }
    
    function renderEntities() {
        const container = document.getElementById('gameArea');
        const existing = container.querySelectorAll('.game-entity');
        existing.forEach(el => el.remove());
        
        mice.forEach((m, idx) => {
            const div = document.createElement('div');
            let className = 'game-entity ';
            if(m.isBoss) className += 'mouse-boss';
            else if(m.isGolden) className += 'mouse-golden';
            else className += 'mouse-normal';
            div.className = className;
            div.style.left = (m.x - m.size/2) + 'px';
            div.style.top = (m.y - m.size/2) + 'px';
            div.style.width = m.size + 'px';
            div.style.height = m.size + 'px';
            div.style.fontSize = (m.size/2.2) + 'px';
            div.textContent = m.isBoss ? '🐀👑' : (m.isGolden ? '🐭✨' : '🐭');
            div.dataset.type = 'mouse';
            div.dataset.idx = idx;
            container.appendChild(div);
        });
        
        bubbles.forEach((b, idx) => {
            const div = document.createElement('div');
            div.className = 'game-entity bubble';
            div.style.left = (b.x - b.size/2) + 'px';
            div.style.top = (b.y - b.size/2) + 'px';
            div.style.width = b.size + 'px';
            div.style.height = b.size + 'px';
            div.style.fontSize = (b.size/2) + 'px';
            div.textContent = '🎁';
            div.dataset.type = 'bubble';
            div.dataset.idx = idx;
            container.appendChild(div);
        });
    }
    
    // ==================== DESAFÍOS ====================
    function updateChallenges() {
        const panel = document.getElementById('challengesPanel');
        if(panel) {
            panel.innerHTML = `
                <div class="challenge-item">${t.mouse} ${challenges.mice}/${weeklyRewards.mice}</div>
                <div class="challenge-item">${t.crits} ${challenges.crits}/${weeklyRewards.crits}</div>
                <div class="challenge-item">🔥 ${challenges.maxCombo}/${weeklyRewards.combo}</div>
            `;
        }
        
        if(challenges.mice >= weeklyRewards.mice) { coins += 250; challenges.mice = 0; showNotification(t.challengeMice?.replace("{reward}", 250), "achievement"); updateUI(); }
        if(challenges.crits >= weeklyRewards.crits) { coins += 200; challenges.crits = 0; showNotification(t.challengeCrits?.replace("{reward}", 200), "achievement"); updateUI(); }
        if(challenges.maxCombo >= weeklyRewards.combo) { coins += 350; challenges.maxCombo = 0; showNotification(t.challengeCombo?.replace("{reward}", 350), "achievement"); updateUI(); }
    }
    
    // ==================== LOGROS ====================
    function checkAchievements() {
        let newAchievement = false;
        if(!achievements.taps100 && totalTaps >= 100) { achievements.taps100 = true; billyTokens += 100; newAchievement = true; showNotification(t.achievement1 + " +100 BILLY", "achievement"); }
        if(!achievements.taps500 && totalTaps >= 500) { achievements.taps500 = true; billyTokens += 300; newAchievement = true; showNotification(t.achievement2 + " +300 BILLY", "achievement"); }
        if(!achievements.taps1000 && totalTaps >= 1000) { achievements.taps1000 = true; billyTokens += 500; newAchievement = true; showNotification(t.achievement3 + " +500 BILLY", "achievement"); }
        if(!achievements.mice50 && totalMiceCaught >= 50) { achievements.mice50 = true; billyTokens += 150; newAchievement = true; showNotification(t.achievement4 + " +150 BILLY", "achievement"); }
        if(!achievements.mice200 && totalMiceCaught >= 200) { achievements.mice200 = true; billyTokens += 400; newAchievement = true; showNotification(t.achievement5 + " +400 BILLY", "achievement"); }
        if(!achievements.combo20 && bestCombo >= 20) { achievements.combo20 = true; billyTokens += 250; newAchievement = true; showNotification(t.achievement6 + " +250 BILLY", "achievement"); }
        if(!achievements.level10 && level >= 10) { achievements.level10 = true; billyTokens += 500; newAchievement = true; showNotification(t.achievement7 + " +500 BILLY", "achievement"); }
        if(!achievements.crits100 && totalCrits >= 100) { achievements.crits100 = true; billyTokens += 200; newAchievement = true; showNotification(t.achievement8 + " +200 BILLY", "achievement"); }
        if(newAchievement) { updateUI(); saveGame(); }
    }
    
    // ==================== EVENTOS ESPECIALES ====================
    setInterval(() => {
        if(gameStarted && Math.random() < 0.15 && !goldenHourActive) {
            goldenHourActive = true;
            showNotification(t.goldenHour);
            setTimeout(() => { goldenHourActive = false; showNotification(t.goldenHourEnd); }, 10000);
        }
    }, 35000);
    
    setInterval(() => {
        if(gameStarted && Math.random() < 0.1 && !doubleEventActive) {
            doubleEventActive = true;
            showNotification(t.doubleEvent);
            setTimeout(() => { doubleEventActive = false; showNotification(t.doubleEnd); updateUI(); }, 15000);
            updateUI();
        }
    }, 50000);
    
    // ==================== CARGA Y GUARDADO ====================
    function loadGame() {
        const saved = localStorage.getItem('billyClickerV5');
        if(saved) {
            try {
                const data = JSON.parse(saved);
                coins = data.coins || 0;
                level = data.level || 1;
                tapPower = data.tapPower || 1;
                billyTokens = data.billyTokens || 0;
                bestCombo = data.bestCombo || 0;
                highScore = data.highScore || 0;
                totalMiceCaught = data.totalMiceCaught || 0;
                totalCrits = data.totalCrits || 0;
                skins = data.skins || skins;
                currentSkin = data.currentSkin || 0;
                achievements = data.achievements || achievements;
                skills = data.skills || skills;
                pets = data.pets || pets;
                activePet = data.activePet || null;
                if(activePet) pets[activePet].equipped = true;
                multiplier = 1 + Math.floor(level / 4);
                updateSkillBonuses();
                maxEnergy = 100 + Math.floor(level / 2) * 5 + skills.energy.bonus;
                energy = Math.min(maxEnergy, data.energy || 100);
            } catch(e) {}
        }
        // Sincronizar con recursos globales
        window.addCoins(0);
        window.addTokens(billyTokens);
    }
    
    function saveGame() {
        localStorage.setItem('billyClickerV5', JSON.stringify({
            coins, level, tapPower, billyTokens, bestCombo, highScore,
            totalMiceCaught, totalCrits, skins, currentSkin, achievements,
            skills, pets, activePet, energy
        }));
    }
    
    // ==================== POSICIÓN DE BILLY ====================
    function updateBillyPosition() {
        if(!gameStarted) return;
        billyX += (targetX - billyX) * 0.12;
        billyY += (targetY - billyY) * 0.12;
        const billyDiv = document.getElementById('billy');
        billyDiv.style.left = (billyX - billyDiv.offsetWidth / 2) + 'px';
        billyDiv.style.top = (billyY - billyDiv.offsetHeight / 2) + 'px';
        if(activePet) {
            const follower = document.getElementById('petFollower');
            follower.style.left = (billyX - 45) + 'px';
            follower.style.top = (billyY - 35) + 'px';
        }
        requestAnimationFrame(updateBillyPosition);
    }
    
    // ==================== BOTONES DEL JUEGO ====================
    function setupButtons() {
        document.getElementById('upgradeBtn').onclick = () => {
            let cost = Math.floor(60 * Math.pow(1.42, tapPower - 1));
            if(coins >= cost) {
                coins -= cost;
                tapPower++;
                updateUI();
                showNotification(t.powerUp.replace("{power}", tapPower), "achievement");
                createParticles(billyX, billyY, '#FFD966');
            } else {
                showNotification(t.upgradeCost.replace("{cost}", Math.floor(cost - coins)));
            }
        };
        
        document.getElementById('lootBtn').onclick = () => {
            if(coins >= 45) {
                coins -= 45;
                let reward = 60 + Math.floor(Math.random() * 180);
                reward = Math.floor(reward * getEconomyBonus() * getDragonBonus());
                coins += reward;
                updateUI();
                updateLevel();
                showNotification(t.lootReward.replace("{reward}", reward), "achievement");
                createParticles(billyX, billyY, '#FFD966');
            } else {
                showNotification(t.needCoins?.replace("{cost}", 45) || `💔 Necesitas 45 monedas`);
            }
        };
        
        document.getElementById('skillsBtn').onclick = () => openShop();
        document.getElementById('petsBtn').onclick = () => openShop();
        document.getElementById('shopBtn').onclick = () => openShop();
        
        document.getElementById('toggleMusicBtn').onclick = () => {
            musicEnabled = !musicEnabled;
            document.getElementById('toggleMusicBtn').innerHTML = `${t.music} ${musicEnabled ? 'ON' : 'OFF'}`;
        };
        
        document.getElementById('shareXBtn').onclick = () => {
            const shareText = currentLang === 'es' ?
                `🐱 ¡Billy El Gato! Nivel ${level} | ${Math.floor(coins)} monedas | Mejor combo ${bestCombo} | Atrapé ${totalMiceCaught} ratones! 🎮 #BillyElGato #Solana` :
                `🐱 Billy The Cat! Level ${level} | ${Math.floor(coins)} coins | Best combo ${bestCombo} | Caught ${totalMiceCaught} mice! 🎮 #BillyTheCat #Solana`;
            window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}`, '_blank');
        };
        
        document.getElementById('tokenBar').onclick = () => showNotification(t.tokenMessage?.replace("{tokens}", Math.floor(billyTokens)) || `💰 ${Math.floor(billyTokens)} BILLY tokens`);
        document.querySelector('.records-panel').onclick = () => openStats();
        document.querySelector('.pet-panel').onclick = () => openShop();
    }
    
    function openStats() {
        const critRate = totalTaps > 0 ? ((totalCrits / totalTaps) * 100).toFixed(1) : 0;
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="modal-content">
                <h2>${t.stats || '📊 Estadísticas'}</h2>
                <div class="stat-line" style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid rgba(255,255,255,0.2);color:white;"><span>${t.totalTaps || 'Toques'}:</span><span>${totalTaps}</span></div>
                <div class="stat-line" style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid rgba(255,255,255,0.2);color:white;"><span>${t.totalMice || 'Ratones'}:</span><span>${totalMiceCaught}</span></div>
                <div class="stat-line" style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid rgba(255,255,255,0.2);color:white;"><span>${t.totalCrits || 'Críticos'}:</span><span>${totalCrits}</span></div>
                <div class="stat-line" style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid rgba(255,255,255,0.2);color:white;"><span>${t.critRate || 'Tasa crítica'}:</span><span>${critRate}%</span></div>
                <div class="stat-line" style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid rgba(255,255,255,0.2);color:white;"><span>${t.bestCombo}:</span><span>${bestCombo}</span></div>
                <button class="close-modal" onclick="this.closest('.modal').remove()">${t.close}</button>
            </div>
        `;
        document.body.appendChild(modal);
    }
    
    // ==================== INICIAR JUEGO CLICKER ====================
    function startClickerGame() {
        gameStarted = true;
        loadGame();
        updateUI();
        updateChallenges();
        setupButtons();
        startPetEffects();
        
        const billyDiv = document.getElementById('billy');
        billyDiv.addEventListener('click', tapBilly);
        billyDiv.addEventListener('touchstart', (e) => { e.preventDefault(); tapBilly(e); });
        
        document.addEventListener('mousemove', (e) => { targetX = e.clientX; targetY = e.clientY; });
        document.addEventListener('touchmove', (e) => { e.preventDefault(); const t = e.touches[0]; targetX = t.clientX; targetY = t.clientY; }, { passive: false });
        
        document.getElementById('gameArea').addEventListener('click', (e) => {
            let target = e.target;
            while(target && target !== document.getElementById('gameArea')) {
                if(target.classList && target.classList.contains('game-entity')) {
                    const type = target.dataset.type;
                    const idx = parseInt(target.dataset.idx);
                    if(type === 'mouse') catchMouse(idx, e.clientX, e.clientY);
                    else if(type === 'bubble') catchBubble(idx, e.clientX, e.clientY);
                    e.stopPropagation();
                    return;
                }
                target = target.parentElement;
            }
        });
        
        updateBillyPosition();
        
        setInterval(() => spawnMouse(), 3800);
        setInterval(() => spawnBubble(), 6000);
        setInterval(() => { updateMice(); updateBubbles(); renderEntities(); }, 50);
        
        setInterval(() => {
            if(gameStarted) {
                let regen = Math.max(1, Math.floor(combo / 5)) + Math.floor(skills.energy.level / 2);
                energy = Math.min(maxEnergy, energy + regen);
                updateUI();
            }
        }, 1500);
        
        setInterval(() => saveGame(), 10000);
        
        showNotification(t.startDesc || "🐱 ¡Toca a Billy para comenzar!");
        
        // Botón volver
        const backBtn = document.createElement('button');
        backBtn.className = 'menu-btn';
        backBtn.style.position = 'fixed';
        backBtn.style.bottom = '15px';
        backBtn.style.left = '15px';
        backBtn.style.zIndex = '100';
        backBtn.style.padding = '8px 16px';
        backBtn.style.background = 'rgba(0,0,0,0.7)';
        backBtn.innerHTML = '← ' + t.back;
        backBtn.onclick = () => {
            gameStarted = false;
            saveGame();
            backToMenu();
        };
        document.getElementById('clickerGameContainer').appendChild(backBtn);
    }
    
    // ==================== CREAR UI DEL CLICKER ====================
    function createClickerUI() {
        const container = document.getElementById('clickerGameContainer');
        const uiHTML = `
            <div class="top-panel">
                <div class="stat-card">😺 <span id="levelText">${t.level}</span> <span id="level">1</span></div>
                <div class="stat-card">💰 <span id="coins">0</span></div>
                <div class="stat-card">⚡ x<span id="multiplier">1</span></div>
                <div class="stat-card">💪 <span id="tapPower">1</span></div>
            </div>
            <div class="token-bar" id="tokenBar">
                <span>🐱 ${t.tokensLabel}</span>
                <span><span id="billyTokens">0</span> BILLY</span>
            </div>
            <div class="combo-panel">🔥 <span id="comboCount">0</span> <span id="comboLabel">${t.combo}</span></div>
            <div class="pet-panel" id="petPanel"><div class="pet-avatar">🐾</div><span>${t.pets}</span></div>
            <div class="records-panel">🏆 <span id="bestComboLabel">${t.bestCombo}</span>: <span id="bestCombo">0</span><br>⭐ <span id="recordLabel">${t.record}</span>: <span id="highScore">0</span></div>
            <div class="energy-container">
                <div style="display:flex;justify-content:space-between;margin-bottom:5px;"><span>⚡ ${t.energy}</span><span><span id="energyCurrent">100</span>/<span id="energyMax">100</span></span></div>
                <div class="energy-bg"><div class="energy-fill" id="energyFill"></div></div>
            </div>
            <div class="streak-indicator" id="streakIndicator" style="display:none;"></div>
            <div class="challenges-panel" id="challengesPanel"></div>
            <div class="action-buttons">
                <button class="btn" id="upgradeBtn">💪 <span id="upgradeText">${t.upgrade}</span></button>
                <button class="btn btn-primary" id="lootBtn">🎁 <span id="lootText">${t.loot}</span></button>
                <button class="btn btn-skill" id="skillsBtn">🌳 <span id="skillsText">${t.skills}</span></button>
                <button class="btn btn-pet" id="petsBtn">🐾 <span id="petsText">${t.pets}</span></button>
                <button class="btn btn-shop" id="shopBtn">🏪 ${t.shop}</button>
                <button class="btn btn-sound" id="toggleMusicBtn">🎵 ON</button>
                <button class="btn btn-solana" id="shareXBtn">🐦 ${t.share}</button>
            </div>
        `;
        container.insertAdjacentHTML('beforeend', uiHTML);
        
        function updateGameTexts() {
            document.getElementById('levelText').textContent = t.level;
            document.getElementById('comboLabel').textContent = t.combo;
            document.getElementById('bestComboLabel').textContent = t.bestCombo;
            document.getElementById('recordLabel').textContent = t.record;
            document.getElementById('upgradeText').textContent = t.upgrade;
            document.getElementById('lootText').textContent = t.loot;
            document.getElementById('skillsText').textContent = t.skills;
            document.getElementById('petsText').textContent = t.pets;
            document.getElementById('shopBtn').innerHTML = `🏪 ${t.shop}`;
        }
        window.updateGameTexts = updateGameTexts;
    }
    
    createClickerUI();
    
    // Exponer funciones globales
    window.startClickerGame = startClickerGame;
    window.saveClickerGame = saveGame;
    window.unlockPet = unlockPet;
    window.upgradePet = upgradePet;
    window.equipPet = equipPet;
    window.upgradeSkill = upgradeSkill;
    window.buySkin = buySkin;
    window.equipSkin = equipSkin;
    window.openShop = openShop;
    
    // Añadir estilo de glow
    const glowStyle = document.createElement('style');
    glowStyle.textContent = `@keyframes glow { from { text-shadow: 0 0 0px orange; } to { text-shadow: 0 0 10px #ffaa44; } }`;
    document.head.appendChild(glowStyle);
</script>
</body>
</html>
