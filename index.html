<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>🐱 BILLY THE CAT - ID EDITION</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', 'Comic Neue', system-ui, sans-serif;
            min-height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #0a0a2a 0%, #050510 100%);
        }

        /* Animaciones globales */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        
        @keyframes glowPulse {
            0% { box-shadow: 0 0 5px rgba(255,200,100,0.3); }
            100% { box-shadow: 0 0 25px rgba(255,200,100,0.6); }
        }

        /* Pantalla de registro */
        .register-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0a1a, #1a1a2e);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .register-card {
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(20px);
            border-radius: 60px;
            padding: 40px 30px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            border: 2px solid #ffaa44;
            animation: slideUp 0.5s ease;
        }
        
        .register-card img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin-bottom: 20px;
            animation: float 3s infinite;
        }
        
        .register-card h2 {
            color: #FFD966;
            margin-bottom: 20px;
        }
        
        .register-input {
            width: 100%;
            padding: 15px 20px;
            border-radius: 50px;
            border: none;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 18px;
            text-align: center;
            margin-bottom: 15px;
        }
        
        .register-input:focus {
            outline: none;
            border: 1px solid #ffaa44;
        }
        
        .register-btn {
            background: linear-gradient(135deg, #14f195, #9945ff);
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s;
        }
        
        .register-btn:active {
            transform: scale(0.97);
        }
        
        .error-msg {
            color: #ff6b6b;
            font-size: 12px;
            margin-top: 10px;
        }

        /* Pantalla principal */
        .main-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #0a0a2a 0%, #050510 100%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
        }
        
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite alternate;
        }
        
        @keyframes twinkle {
            from { opacity: 0.3; transform: scale(1); }
            to { opacity: 1; transform: scale(1.2); }
        }
        
        .menu-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }
        
        .user-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            border-radius: 60px;
            padding: 12px 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,200,100,0.3);
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .user-avatar {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #fbbf24, #e67e22);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }
        
        .user-details h3 {
            color: #FFD966;
            font-size: 16px;
        }
        
        .user-details p {
            color: rgba(255,255,255,0.6);
            font-size: 11px;
        }
        
        .user-stats {
            display: flex;
            gap: 15px;
        }
        
        .user-stat {
            text-align: center;
        }
        
        .user-stat-value {
            color: #FFD966;
            font-weight: bold;
            font-size: 18px;
        }
        
        .user-stat-label {
            color: rgba(255,255,255,0.5);
            font-size: 10px;
        }
        
        .billy-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .billy-logo img {
            width: 140px;
            height: 140px;
            object-fit: contain;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
            animation: float 3s infinite;
        }
        
        .billy-logo h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #FFD966, #FFA500);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-top: 10px;
        }
        
        .game-modes {
            display: flex;
            gap: 20px;
            margin: 25px 0;
        }
        
        .mode-card {
            flex: 1;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid rgba(255,200,100,0.3);
        }
        
        .mode-card:hover {
            transform: translateY(-5px);
            border-color: #ffaa44;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        
        .mode-card:active {
            transform: scale(0.98);
        }
        
        .mode-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        
        .mode-card h3 {
            color: #FFD966;
            font-size: 20px;
        }
        
        .mode-card p {
            color: rgba(255,255,255,0.6);
            font-size: 11px;
            margin-top: 5px;
        }
        
        .resources-bar {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            border-radius: 60px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            margin: 20px 0;
        }
        
        .resource {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .resource-icon {
            font-size: 32px;
        }
        
        .resource-info {
            text-align: left;
        }
        
        .resource-value {
            font-size: 20px;
            font-weight: bold;
            color: #FFD966;
        }
        
        .resource-label {
            font-size: 10px;
            color: rgba(255,255,255,0.6);
        }
        
        .menu-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .menu-btn {
            flex: 1;
            background: rgba(30,41,59,0.9);
            backdrop-filter: blur(5px);
            border: none;
            padding: 12px;
            border-radius: 50px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.1s;
            text-align: center;
        }
        
        .menu-btn:active {
            transform: scale(0.97);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #fbbf24, #e67e22);
            color: #1e1a2f;
        }
        
        .btn-solana {
            background: linear-gradient(135deg, #14f195, #9945ff);
        }
        
        /* Contenedores de juegos */
        .game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1100;
            display: none;
            background: radial-gradient(circle at center, #0a0a2a 0%, #050510 100%);
        }
        
        .game-container.active {
            display: block;
        }
        
        .game-header {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            z-index: 50;
        }
        
        .back-btn {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            padding: 10px 20px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            border: none;
        }
        
        /* Tienda modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }
        
        .modal-content {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-radius: 40px;
            padding: 25px;
            width: 90%;
            max-width: 450px;
            max-height: 85vh;
            overflow-y: auto;
            border: 2px solid #ffaa44;
        }
        
        .modal-content h2 {
            color: #FFD966;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .shop-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .shop-tab {
            flex: 1;
            padding: 8px;
            background: rgba(0,0,0,0.5);
            border-radius: 30px;
            text-align: center;
            cursor: pointer;
            color: white;
            font-size: 12px;
        }
        
        .shop-tab.active {
            background: linear-gradient(135deg, #fbbf24, #e67e22);
            color: #1e1a2f;
        }
        
        .shop-section {
            display: none;
        }
        
        .shop-section.active {
            display: block;
        }
        
        .shop-item {
            background: rgba(0,0,0,0.5);
            border-radius: 20px;
            padding: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,200,100,0.3);
        }
        
        .shop-item.equipped {
            border: 2px solid #14f195;
        }
        
        .item-info {
            flex: 1;
        }
        
        .item-name {
            font-weight: bold;
            color: white;
        }
        
        .item-desc {
            font-size: 10px;
            color: #FFD966;
        }
        
        .item-price {
            font-size: 11px;
            color: #aaa;
        }
        
        .shop-btn {
            background: linear-gradient(135deg, #fbbf24, #e67e22);
            border: none;
            padding: 6px 15px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            font-size: 11px;
        }
        
        .close-modal {
            margin-top: 20px;
            background: #334155;
            padding: 10px 30px;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            border: none;
            color: white;
        }
        
        /* Perfil modal */
        .profile-stats {
            margin: 15px 0;
        }
        
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            color: white;
        }
        
        .change-nick {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        .change-nick input {
            flex: 1;
            padding: 10px;
            border-radius: 30px;
            border: none;
            background: rgba(255,255,255,0.1);
            color: white;
        }
        
        /* Misiones diarias */
        .daily-missions {
            background: rgba(0,0,0,0.6);
            border-radius: 20px;
            padding: 12px;
            margin: 15px 0;
        }
        
        .mission-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .mission-name {
            color: #FFD966;
            font-size: 12px;
        }
        
        .mission-reward {
            font-size: 10px;
            color: #aaa;
        }
        
        .mission-completed {
            color: #22c55e;
            font-size: 12px;
        }
        
        /* Estilos del juego Clicker (mantener los existentes) */
        .top-panel {
            position: fixed;
            top: 70px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            z-index: 30;
        }
        
        .stat-card {
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: bold;
            color: #FFE484;
        }
        
        .token-bar {
            position: fixed;
            top: 130px;
            left: 10px;
            right: 10px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            border-radius: 60px;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            z-index: 30;
            cursor: pointer;
            font-weight: bold;
        }
        
        .combo-panel {
            position: fixed;
            top: 180px;
            right: 10px;
            background: rgba(0,0,0,0.85);
            padding: 8px 16px;
            border-radius: 40px;
            font-weight: bold;
            color: #ff884d;
            z-index: 30;
        }
        
        .energy-container {
            position: fixed;
            bottom: 100px;
            left: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            border-radius: 20px;
            padding: 8px 12px;
            z-index: 30;
        }
        
        .energy-bg {
            height: 12px;
            background: #2d2a3e;
            border-radius: 20px;
            overflow: hidden;
        }
        
        .energy-fill {
            height: 100%;
            background: linear-gradient(90deg, #22c55e, #facc15);
            border-radius: 20px;
            transition: width 0.2s;
        }
        
        .action-buttons {
            position: fixed;
            bottom: 15px;
            left: 10px;
            right: 10px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            z-index: 30;
        }
        
        .btn {
            flex: 1;
            padding: 10px 6px;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 10px;
            cursor: pointer;
            background: linear-gradient(145deg, #1e293b, #0f172a);
            color: white;
            text-align: center;
        }
        
        #billy {
            position: fixed;
            width: 130px;
            height: 130px;
            background: radial-gradient(circle, #FFD966, #FFA500);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 70px;
            cursor: pointer;
            z-index: 20;
            transition: transform 0.05s;
        }
        
        #billy:active {
            transform: scale(0.92);
        }
        
        .pet-follower {
            position: fixed;
            z-index: 18;
            font-size: 32px;
            pointer-events: none;
            animation: float 2s infinite;
        }
        
        #gameArea {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 15;
        }
        
        .game-entity {
            position: fixed;
            cursor: pointer;
            z-index: 25;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            animation: bounceIn 0.3s ease;
        }
        
        @keyframes bounceIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }
        
        .mouse-normal {
            background: radial-gradient(circle, #8B5A2B, #5D3A1A);
            border-radius: 50%;
            width: 45px;
            height: 45px;
        }
        
        .mouse-golden {
            background: radial-gradient(circle, #FBBF24, #E67E22);
            border-radius: 50%;
            animation: pulseGold 0.8s infinite;
        }
        
        .bubble {
            background: radial-gradient(circle, #FFE484, #F59E0B);
            border-radius: 50%;
            animation: float 2s infinite;
        }
        
        .notification {
            position: fixed;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #facc15, #f59e0b);
            color: #0c0a1a;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: bold;
            z-index: 200;
            animation: fadeOutUp 1s forwards;
        }
        
        @keyframes fadeOutUp {
            0% { opacity: 1; transform: translate(-50%, -50%); }
            100% { opacity: 0; transform: translate(-50%, -70%); }
        }
        
        .floating-number {
            position: fixed;
            font-weight: bold;
            font-size: 24px;
            pointer-events: none;
            z-index: 150;
            animation: floatUp 0.8s forwards;
        }
        
        @keyframes floatUp {
            to { transform: translateY(-50px); opacity: 0; }
        }
        
        @keyframes pulseGold {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        /* Estilos del minijuego Jump */
        .jump-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #0a0a2a, #1a2a3a);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .jump-canvas {
            background: linear-gradient(180deg, #1a2a3a, #2a3a4a);
            border-radius: 30px;
            border: 3px solid #FFD966;
            cursor: pointer;
        }
        
        .jump-stats {
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
        }
        
        .jump-score-card {
            background: rgba(0,0,0,0.8);
            padding: 10px 20px;
            border-radius: 40px;
            color: #FFD966;
            font-weight: bold;
        }
        
        .jump-powerups {
            position: absolute;
            bottom: 100px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        
        .powerup-btn {
            background: rgba(0,0,0,0.8);
            padding: 8px 15px;
            border-radius: 30px;
            color: white;
            font-size: 12px;
            cursor: pointer;
            border: 1px solid #ffaa44;
        }
        
        .powerup-btn:active {
            transform: scale(0.95);
        }
        
        @media (max-width: 600px) {
            .mode-card { padding: 15px; }
            .mode-icon { font-size: 36px; }
            .resource-icon { font-size: 24px; }
            .resource-value { font-size: 16px; }
            .btn { font-size: 9px; padding: 8px 4px; }
            #billy { width: 100px; height: 100px; font-size: 55px; }
        }
    </style>
</head>
<body>

<div class="stars" id="stars"></div>

<!-- Pantalla de registro -->
<div class="register-screen" id="registerScreen">
    <div class="register-card">
        <img src="billy.gif" alt="Billy" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%23FFD966%22/%3E%3Ctext x=%2250%22 y=%2270%22 text-anchor=%22middle%22 fill=%22%23FFA500%22 font-size=%2240%22%3E🐱%3C/text%3E%3C/svg%3E'">
        <h2>🐱 BILLY ID</h2>
        <p style="color:rgba(255,255,255,0.7); margin-bottom:20px;">¡Crea tu identidad en el mundo de Billy!</p>
        <input type="text" class="register-input" id="nicknameInput" placeholder="Tu nickname (mínimo 3 caracteres)" maxlength="15">
        <button class="register-btn" id="registerBtn">🎮 COMENZAR AVENTURA</button>
        <div id="registerError" class="error-msg"></div>
    </div>
</div>

<!-- Menú principal -->
<div class="main-menu" id="mainMenu" style="display: none;">
    <div class="menu-container">
        <div class="user-header">
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">🐱</div>
                <div class="user-details">
                    <h3 id="userNickname">BillyMaster</h3>
                    <p>🐱 BILLY ID</p>
                </div>
            </div>
            <div class="user-stats">
                <div class="user-stat">
                    <div class="user-stat-value" id="userLevel">1</div>
                    <div class="user-stat-label">Nivel</div>
                </div>
                <div class="user-stat">
                    <div class="user-stat-value" id="userStreak">0</div>
                    <div class="user-stat-label">Racha</div>
                </div>
            </div>
        </div>
        
        <div class="billy-logo">
            <img src="billy.gif" alt="Billy" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%23FFD966%22/%3E%3Ctext x=%2250%22 y=%2270%22 text-anchor=%22middle%22 fill=%22%23FFA500%22 font-size=%2240%22%3E🐱%3C/text%3E%3C/svg%3E'">
            <h1>BILLY THE CAT</h1>
        </div>
        
        <div class="game-modes">
            <div class="mode-card" id="selectClickerBtn">
                <div class="mode-icon">🐱</div>
                <h3>BILLY CLICKER</h3>
                <p>Toca a Billy, atrapa ratones, mejora habilidades</p>
            </div>

    function updateLanguage() {
        t = translations[currentLang];

            if(t[key]) el.textContent = t[key];
        });

        if(document.getElementById('profileBtn')) document.getElementById('profileBtn').innerHTML = `👤 ${t.profile}`;
    }
    
    // ==================== ESTRUCTURA DE DATOS DEL USUARIO ====================
    function createDefaultUser(nickname) {
        return {
            userId: Date.now().toString(),
            nickname: nickname,
            createdAt: Date.now(),
            lastLogin: Date.now(),
            dailyStreak: 1,
            lastPlayDate: new Date().toDateString(),
            language: 'es',
            resources: {
                coins: 500,
                tokens: 100
            },
            clicker: {
                level: 1,
                tapPower: 1,
                energy: 100,
                maxEnergy: 100,
                combo: 0,
                bestCombo: 0,
                totalTaps: 0,
                totalMice: 0,
                totalCrits: 0,
                activePet: null
            },
            jump: {
                bestScore: 0,
                totalJumps: 0
            },
            inventory: {
                skins: [{ id: 'original', name: 'Original', unlocked: true, equipped: true }],
                pets: [],
                skills: { strength: 0, energy: 0, luck: 0, economy: 0 },
                powerups: { shield: 0, magnet: 0, double: 0 }
            },
            dailyMissions: {
                date: new Date().toDateString(),
                missions: [],
                completed: []
            },
            achievements: {}
        };
    }
    
    function saveUser() {
        if(currentUser) {
            localStorage.setItem('billyUser_' + currentUser.userId, JSON.stringify(currentUser));
            localStorage.setItem('billyCurrentUser', currentUser.userId);
        }
    }
    
    function loadUser(userId) {
        const saved = localStorage.getItem('billyUser_' + userId);
        if(saved) {
            currentUser = JSON.parse(saved);
            return true;
        }
        return false;
    }
    
    function getAllNicknames() {
        const nicknames = [];
        for(let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if(key && key.startsWith('billyUser_')) {
                try {
                    const user = JSON.parse(localStorage.getItem(key));
                    nicknames.push(user.nickname);
                } catch(e) {}
            }
        }
        return nicknames;
    }
    
    function registerUser(nickname) {
        if(nickname.length < 3) {
            document.getElementById('registerError').textContent = t.needMoreChars;
            return false;
        }
        const existingNicknames = getAllNicknames();
        if(existingNicknames.includes(nickname)) {
            document.getElementById('registerError').textContent = t.nicknameExists;
            return false;
        }
        currentUser = createDefaultUser(nickname);
        saveUser();
        document.getElementById('registerError').textContent = '';
        return true;
    }
    
    // ==================== MISIONES DIARIAS ====================
    function generateDailyMissions() {
        const today = new Date().toDateString();
        if(currentUser.dailyMissions.date !== today) {
            currentUser.dailyMissions.date = today;
            currentUser.dailyMissions.missions = [
                { id: 'tap', type: 'tap', target: 50, progress: 0, reward: 100, completed: false },
                { id: 'mice', type: 'mice', target: 20, progress: 0, reward: 150, completed: false },
                { id: 'combo', type: 'combo', target: 15, progress: 0, reward: 200, completed: false }
            ];
            currentUser.dailyMissions.completed = [];
            saveUser();
        }
        updateDailyMissionsUI();
    }
    
    function updateDailyMissionsUI() {
        const container = document.getElementById('missionsList');
        if(!container) return;
        if(!currentUser.dailyMissions.missions) return;
        
        container.innerHTML = currentUser.dailyMissions.missions.map(mission => `
            <div class="mission-item">
                <div>
                    <div class="mission-name">
                        ${mission.type === 'tap' ? '👆' : mission.type === 'mice' ? '🐭' : '🔥'} 
                        ${mission.type === 'tap' ? t.missionTap.replace('{count}', mission.target) :
                          mission.type === 'mice' ? t.missionMice.replace('{count}', mission.target) :
                          t.missionCombo.replace('{count}', mission.target)}
                    </div>
                    <div class="mission-reward">${t.reward}: ${mission.reward} 🪙</div>
                </div>
                <div>
                    ${mission.completed ? 
                        `<span class="mission-completed">${t.completed}</span>` :
                        `<span>${mission.progress}/${mission.target}</span>`
                    }
                </div>
            </div>
        `).join('');
    }
    
    function updateMissionProgress(type, amount = 1) {
        if(!currentUser) return;
        const today = new Date().toDateString();
        if(currentUser.dailyMissions.date !== today) {
            generateDailyMissions();
        }
        let completedAny = false;
        currentUser.dailyMissions.missions.forEach(mission => {
            if(mission.type === type && !mission.completed) {
                mission.progress += amount;
                if(mission.progress >= mission.target) {
                    mission.completed = true;
                    currentUser.resources.coins += mission.reward;
                    completedAny = true;
                    showNotification(`🎉 ${t.missionComplete || '¡Misión completada!'} +${mission.reward} ${t.coins}`);
                }
            }
        });
        if(completedAny) {
            updateMenuResources();
            saveUser();
        }
        updateDailyMissionsUI();
    }
    
    // ==================== RACHA DIARIA ====================
    function checkDailyStreak() {
        const today = new Date().toDateString();
        const lastPlay = currentUser.lastPlayDate;
        if(lastPlay !== today) {
            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);
            if(lastPlay === yesterday.toDateString()) {
                currentUser.dailyStreak++;
                const bonus = 50 + (currentUser.dailyStreak * 10);
                currentUser.resources.coins += bonus;
                showNotification(t.dailyBonus.replace('{days}', currentUser.dailyStreak).replace('{bonus}', bonus));
            } else {
                currentUser.dailyStreak = 1;
            }
            currentUser.lastPlayDate = today;
            saveUser();
        }
        document.getElementById('userStreak').textContent = currentUser.dailyStreak;
    }
    
    // ==================== FUNCIONES DE UI ====================
    function updateMenuResources() {
        if(document.getElementById('menuCoins')) {
            document.getElementById('menuCoins').textContent = Math.floor(currentUser.resources.coins);
            document.getElementById('menuTokens').textContent = Math.floor(currentUser.resources.tokens);
            document.getElementById('userNickname').textContent = currentUser.nickname;
            document.getElementById('userLevel').textContent = currentUser.clicker.level;
            document.getElementById('userStreak').textContent = currentUser.dailyStreak;
        }
    }
    
    function showNotification(msg) {
        const div = document.createElement('div');
        div.className = 'notification';
        div.textContent = msg;
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 1500);
    }
    
    // ==================== TIENDA ====================
    function openShop() {
        const modal = document.createElement('div');
        modal.className = 'modal';

                        <button class="shop-btn" onclick="buySkin('original')">${currentUser.inventory.skins.find(s => s.id === 'original')?.unlocked ? (currentUser.inventory.skins.find(s => s.id === 'original')?.equipped ? t.equipped : t.equip) : t.buy}</button>

                        <button class="shop-btn" onclick="buySkin('golden')">${currentUser.inventory.skins.find(s => s.id === 'golden')?.unlocked ? (currentUser.inventory.skins.find(s => s.id === 'golden')?.equipped ? t.equipped : t.equip) : t.buy}</button>
                    </div>
                    <div class="shop-item ${currentUser.inventory.skins.find(s => s.equipped)?.id === 'elite' ? 'equipped' : ''}">

                        <button class="shop-btn" onclick="buySkin('elite')">${currentUser.inventory.skins.find(s => s.id === 'elite')?.unlocked ? (currentUser.inventory.skins.find(s => s.id === 'elite')?.equipped ? t.equipped : t.equip) : t.buy}</button>

            tab.onclick = () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                Object.values(sections).forEach(s => s.classList.remove('active'));
                sections[tab.dataset.tab].classList.add('active');
            };
        });

    function buySkin(skinId) {
        const skinPrices = { golden: 500, elite: 1500 };
        const existing = currentUser.inventory.skins.find(s => s.id === skinId);
        if(existing) {
            if(!existing.equipped) {
                currentUser.inventory.skins.forEach(s => s.equipped = false);
                existing.equipped = true;
                showNotification(`${skinId} ${t.equipped}`);
                saveUser();
                document.querySelector('.modal')?.remove();
                openShop();
            }
        } else {
            if(currentUser.resources.tokens >= skinPrices[skinId]) {
                currentUser.resources.tokens -= skinPrices[skinId];
                currentUser.inventory.skins.forEach(s => s.equipped = false);
                currentUser.inventory.skins.push({ id: skinId, name: skinId, unlocked: true, equipped: true });
                showNotification(`${skinId} ${t.buy}ed!`);
                saveUser();
                updateMenuResources();
                document.querySelector('.modal')?.remove();
                openShop();
            } else {
                showNotification(t.notEnoughTokens);
            }
        }
    }
    
    function buyPet(petId) {
        const petPrices = { dog: 300, owl: 400, bee: 250, dragon: 1000 };
        if(currentUser.inventory.pets.includes(petId)) {
            currentUser.clicker.activePet = petId;
            showNotification(`${petId} ${t.equipped}`);
            saveUser();
            document.querySelector('.modal')?.remove();
            openShop();
        } else {
            if(currentUser.resources.tokens >= petPrices[petId]) {
                currentUser.resources.tokens -= petPrices[petId];
                currentUser.inventory.pets.push(petId);
                currentUser.clicker.activePet = petId;
                showNotification(`${petId} ${t.buy}ed!`);
                saveUser();
                updateMenuResources();
                document.querySelector('.modal')?.remove();
                openShop();
            } else {
                showNotification(t.notEnoughTokens);
            }
        }
    }
    
    function upgradeSkill(skillId) {
        const costs = { strength: [40,80,150,300,500], energy: [30,60,120,250,400], luck: [50,100,200,400,600], economy: [40,80,150,300,500] };
        const currentLevel = currentUser.inventory.skills[skillId];
        if(currentLevel < 5) {
            const cost = costs[skillId][currentLevel];
            if(currentUser.resources.tokens >= cost) {
                currentUser.resources.tokens -= cost;
                currentUser.inventory.skills[skillId]++;
                showNotification(`${skillId} ${t.upgrade} a nivel ${currentUser.inventory.skills[skillId]}!`);
                saveUser();
                updateMenuResources();
                document.querySelector('.modal')?.remove();
                openShop();
            } else {
                showNotification(t.notEnoughTokens);
            }
        }
    }
    
    function buyPowerup(powerupId) {
        const prices = { shield: 100, magnet: 150, double: 200 };
        if(currentUser.resources.tokens >= prices[powerupId]) {
            currentUser.resources.tokens -= prices[powerupId];
            currentUser.inventory.powerups[powerupId] = (currentUser.inventory.powerups[powerupId] || 0) + 1;
            showNotification(`1x ${powerupId} ${t.buy}ed!`);
            saveUser();
            updateMenuResources();
            document.querySelector('.modal')?.remove();
            openShop();
        } else {
            showNotification(t.notEnoughTokens);
        }
    }
    
    // ==================== PERFIL ====================
    function openProfile() {
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="modal-content">
                <h2>👤 ${t.profile}</h2>
                <div class="profile-stats">
                    <div class="stat-row"><span>🐱 Nickname:</span><span>${currentUser.nickname}</span></div>
                    <div class="stat-row"><span>🆔 ID:</span><span>${currentUser.userId.slice(-6)}</span></div>
                    <div class="stat-row"><span>📅 Registro:</span><span>${new Date(currentUser.createdAt).toLocaleDateString()}</span></div>
                    <div class="stat-row"><span>🔥 Racha diaria:</span><span>${currentUser.dailyStreak} días</span></div>
                    <div class="stat-row"><span>👆 Toques totales:</span><span>${currentUser.clicker.totalTaps}</span></div>
                    <div class="stat-row"><span>🐭 Ratones atrapados:</span><span>${currentUser.clicker.totalMice}</span></div>
                    <div class="stat-row"><span>⚡ Mejor combo:</span><span>${currentUser.clicker.bestCombo}</span></div>
                    <div class="stat-row"><span>🦘 Mejor Jump:</span><span>${currentUser.jump.bestScore}</span></div>
                </div>
                <div class="change-nick">
                    <input type="text" id="newNickname" placeholder="Nuevo nickname" maxlength="15">
                    <button class="shop-btn" id="changeNickBtn">${t.changeNickname} (500 BILLY)</button>
                </div>
                <button class="close-modal" onclick="this.closest('.modal').remove()">${t.close}</button>
            </div>
        `;
        document.body.appendChild(modal);
        
        document.getElementById('changeNickBtn').onclick = () => {
            const newNick = document.getElementById('newNickname').value.trim();
            if(newNick.length < 3) {
                showNotification(t.needMoreChars);
                return;
            }
            if(getAllNicknames().includes(newNick) && newNick !== currentUser.nickname) {
                showNotification(t.nicknameExists);
                return;
            }
            if(currentUser.resources.tokens >= 500) {
                currentUser.resources.tokens -= 500;
                currentUser.nickname = newNick;
                saveUser();
                updateMenuResources();
                showNotification(t.nicknameChanged.replace('{name}', newNick));
                modal.remove();
            } else {
                showNotification(t.notEnoughTokens);
            }
        };
    }
    
    // ==================== INICIALIZACIÓN ====================
    function generateStars() {
        const starsDiv = document.getElementById('stars');
        for(let i = 0; i < 150; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.width = star.style.height = (1 + Math.random() * 2) + 'px';
            star.style.animationDelay = Math.random() * 2 + 's';
            starsDiv.appendChild(star);
        }
    }
    generateStars();
    
    // Eventos de navegación
    document.getElementById('registerBtn').onclick = () => {
        const nickname = document.getElementById('nicknameInput').value.trim();
        if(registerUser(nickname)) {
            showNotification(t.registered.replace('{name}', nickname));
            document.getElementById('registerScreen').style.display = 'none';
            document.getElementById('mainMenu').style.display = 'flex';
            updateMenuResources();
            generateDailyMissions();
            checkDailyStreak();
        }
    };
    
    document.getElementById('selectClickerBtn').onclick = () => {
        document.getElementById('mainMenu').style.display = 'none';
        document.getElementById('clickerContainer').classList.add('active');
        if(typeof startClickerGame === 'function') startClickerGame();
    };
    
    document.getElementById('selectJumpBtn').onclick = () => {
        document.getElementById('mainMenu').style.display = 'none';
        document.getElementById('jumpContainer').classList.add('active');
        if(typeof startJumpGame === 'function') startJumpGame();
    };
    
    document.getElementById('clickerBackBtn').onclick = () => {
        document.getElementById('clickerContainer').classList.remove('active');
        document.getElementById('mainMenu').style.display = 'flex';
        if(typeof saveClickerGame === 'function') saveClickerGame();
        updateMenuResources();
        checkDailyStreak();
    };
    
    document.getElementById('jumpBackBtn').onclick = () => {
        document.getElementById('jumpContainer').classList.remove('active');
        document.getElementById('mainMenu').style.display = 'flex';
        updateMenuResources();
        checkDailyStreak();
    };
    
    document.getElementById('shopBtn').onclick = openShop;
    document.getElementById('profileBtn').onclick = openProfile;
    document.getElementById('langEsBtn').onclick = () => { currentLang = 'es'; t = translations.es; updateLanguage(); updateMenuResources(); };
    document.getElementById('langEnBtn').onclick = () => { currentLang = 'en'; t = translations.en; updateLanguage(); updateMenuResources(); };
    
    // Verificar si hay usuario guardado
    const savedUserId = localStorage.getItem('billyCurrentUser');
    if(savedUserId && loadUser(savedUserId)) {
        document.getElementById('registerScreen').style.display = 'none';
        document.getElementById('mainMenu').style.display = 'flex';
        updateMenuResources();
        generateDailyMissions();
        checkDailyStreak();
    }
    
    // Exponer funciones globales
    window.updateMissionProgress = updateMissionProgress;
    window.getUser = () => currentUser;
    window.saveUser = saveUser;
    window.t = t;
</script>

<script>
    // ==================== JUEGO CLICKER (Simplificado pero con todas las mecánicas) ====================
    let clickerGameActive = false;
    let clickerCoins = 0, clickerTokens = 0, clickerLevel = 1, clickerTapPower = 1;
    let clickerEnergy = 100, clickerMaxEnergy = 100, clickerCombo = 0, clickerBestCombo = 0;
    let clickerTotalTaps = 0, clickerTotalMice = 0, clickerTotalCrits = 0;
    let clickerSuperCombo = false, clickerGoldenHour = false, clickerDoubleEvent = false;
    let clickerComboTimer = null;
    let clickerMice = [], clickerBubbles = [];
    let clickerTargetX = window.innerWidth/2, clickerTargetY = window.innerHeight/2;
    let clickerBillyX = window.innerWidth/2, clickerBillyY = window.innerHeight/2;
    
    function loadClickerData() {
        if(currentUser) {
            clickerCoins = currentUser.resources.coins;
            clickerTokens = currentUser.resources.tokens;
            clickerLevel = currentUser.clicker.level;
            clickerTapPower = currentUser.clicker.tapPower;
            clickerEnergy = currentUser.clicker.energy;
            clickerMaxEnergy = currentUser.clicker.maxEnergy;
            clickerBestCombo = currentUser.clicker.bestCombo;
            clickerTotalTaps = currentUser.clicker.totalTaps;
            clickerTotalMice = currentUser.clicker.totalMice;
            clickerTotalCrits = currentUser.clicker.totalCrits;
        }
        updateClickerUI();
    }
    
    function saveClickerData() {
        if(currentUser) {
            currentUser.resources.coins = clickerCoins;
            currentUser.resources.tokens = clickerTokens;
            currentUser.clicker.level = clickerLevel;
            currentUser.clicker.tapPower = clickerTapPower;
            currentUser.clicker.energy = clickerEnergy;
            currentUser.clicker.maxEnergy = clickerMaxEnergy;
            currentUser.clicker.bestCombo = clickerBestCombo;
            currentUser.clicker.totalTaps = clickerTotalTaps;
            currentUser.clicker.totalMice = clickerTotalMice;
            currentUser.clicker.totalCrits = clickerTotalCrits;
            saveUser();
        }
    }
    
    function updateClickerUI() {
        document.getElementById('clickerCoins').textContent = Math.floor(clickerCoins);
        document.getElementById('clickerLevel').textContent = clickerLevel;
        document.getElementById('clickerTapPower').textContent = clickerTapPower;
        document.getElementById('clickerCombo').textContent = clickerCombo;
        document.getElementById('clickerEnergy').textContent = Math.floor(clickerEnergy);
        document.getElementById('clickerMaxEnergy').textContent = clickerMaxEnergy;
        document.getElementById('clickerEnergyFill').style.width = (clickerEnergy / clickerMaxEnergy * 100) + '%';
        document.getElementById('clickerTokens').textContent = Math.floor(clickerTokens);
        document.getElementById('clickerBestCombo').textContent = clickerBestCombo;
    }
    
    function tapBillyClicker(event) {
        if(!clickerGameActive || clickerEnergy <= 0) {
            if(clickerEnergy <= 0) showNotification(t.noEnergy || "💤 Sin energía!");
            return;
        }
        
        clickerCombo++;
        if(clickerCombo > clickerBestCombo) clickerBestCombo = clickerCombo;
        clickerTotalTaps++;
        
        const skillBonus = currentUser?.inventory.skills || { strength:0, luck:0, economy:0 };
        let critChance = 10 + skillBonus.luck * 2 + Math.floor(clickerCombo / 3);
        if(currentUser?.clicker.activePet === 'owl') critChance += 10;
        const isCrit = Math.random() * 100 < critChance;
        if(isCrit) clickerTotalCrits++;
        
        let gain = clickerTapPower * (1 + skillBonus.strength * 0.05) * (isCrit ? 3 : 1) * (1 + clickerCombo * 0.02);
        if(clickerSuperCombo) gain *= 1.3;
        if(clickerDoubleEvent) gain *= 2;
        if(currentUser?.clicker.activePet === 'dragon') gain *= 1.1;
        gain = Math.floor(gain);
        
        clickerCoins += gain;
        clickerTokens += Math.floor(gain / 10);
        
        let energyCost = Math.max(1, Math.floor(clickerCombo / 10));
        clickerEnergy = Math.max(0, clickerEnergy - energyCost);
        
        updateClickerUI();
        updateMissionProgress('tap');
        
        if(clickerComboTimer) clearTimeout(clickerComboTimer);
        clickerComboTimer = setTimeout(() => {
            if(clickerCombo >= 3) showNotification("🔥 Combo perdido!");
            clickerCombo = 0;
            clickerSuperCombo = false;
            updateClickerUI();
        }, 2000);
        
        if(clickerCombo >= 12 && !clickerSuperCombo) {
            clickerSuperCombo = true;
            showNotification("✨ SUPER COMBO! x1.3 ✨");
            setTimeout(() => clickerSuperCombo = false, 5000);
        }
        
        const billyDiv = document.getElementById('billy');
        billyDiv.style.transform = 'scale(0.92)';
        setTimeout(() => billyDiv.style.transform = 'scale(1)', 100);
        
        const clickX = event.clientX || (event.touches ? event.touches[0].clientX : clickerBillyX);
        const clickY = event.clientY || (event.touches ? event.touches[0].clientY : clickerBillyY);
        createRipple(clickX, clickY);
        createParticles(clickX, clickY, isCrit ? '#FFD966' : '#A5F0A0');
        createFloatingNumber(gain, clickX, clickY, isCrit);
        
        let neededCoins = 100 * Math.pow(1.3, clickerLevel - 1);
        if(clickerCoins >= neededCoins) {
            clickerLevel++;
            clickerMaxEnergy = 100 + Math.floor(clickerLevel / 2) * 5 + (skillBonus.energy * 20);
            clickerEnergy = Math.min(clickerMaxEnergy, clickerEnergy + 40);
            showNotification(`🎉 NIVEL ${clickerLevel}! +40 energía 🎉`);
            updateClickerUI();
        }
        
        saveClickerData();
        updateMenuResources();
    }
    
    function createRipple(x, y) {
        const ripple = document.createElement('div');
        ripple.style.cssText = `position:fixed;left:${x-30}px;top:${y-30}px;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,rgba(251,191,36,0.6),transparent);pointer-events:none;z-index:90;animation:rippleAnim 0.5s ease-out forwards;`;
        document.body.appendChild(ripple);
        setTimeout(() => ripple.remove(), 500);
    }
    
    function createParticles(x, y, color) {
        for(let i=0;i<8;i++) {
            const p = document.createElement('div');
            p.style.cssText = `position:fixed;left:${x}px;top:${y}px;width:5px;height:5px;background:${color};border-radius:50%;pointer-events:none;z-index:100;`;
            const angle = Math.random() * Math.PI * 2;
            const speed = 2 + Math.random() * 4;
            let vx = Math.cos(angle) * speed, vy = Math.sin(angle) * speed - 2, life = 30;
            document.body.appendChild(p);
            function animate() {
                life--;
                if(life<=0) { p.remove(); return; }
                p.style.left = (parseFloat(p.style.left) + vx) + 'px';
                p.style.top = (parseFloat(p.style.top) + vy) + 'px';
                p.style.opacity = life/30;
                requestAnimationFrame(animate);
            }
            animate();
        }
    }
    
    function createFloatingNumber(value, x, y, isCrit) {
        const div = document.createElement('div');
        div.className = 'floating-number';
        div.textContent = `+${Math.floor(value)}`;
        div.style.left = x + 'px';
        div.style.top = y + 'px';
        div.style.color = isCrit ? '#FFD966' : 'white';
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 700);
    }
    
    function spawnMouse() {
        if(!clickerGameActive || clickerMice.length > 8) return;
        const isGolden = clickerGoldenHour || Math.random() < 0.1;
        const isBoss = !isGolden && Math.random() < 0.15 && clickerLevel >= 3;
        const size = isBoss ? 65 : 40;
        const yPos = 100 + Math.random() * (window.innerHeight - 200);
        const fromLeft = Math.random() < 0.5;
        const xStart = fromLeft ? -50 : window.innerWidth + 50;
        const dir = fromLeft ? 1 : -1;
        const value = Math.floor(clickerTapPower * (isBoss ? 10 : (isGolden ? 5 : 2)) * (1 + (currentUser?.inventory.skills.economy * 0.1 || 0)));
        clickerMice.push({ x: xStart, y: yPos, size, dir, speed: isBoss ? 1 : 1.5 + Math.random(), isGolden, isBoss, value });
    }
    
    function updateMice() {
        for(let i=clickerMice.length-1; i>=0; i--) {
            clickerMice[i].x += clickerMice[i].speed * clickerMice[i].dir;
            if((clickerMice[i].dir===1 && clickerMice[i].x > window.innerWidth+100) || 
               (clickerMice[i].dir===-1 && clickerMice[i].x < -100)) clickerMice.splice(i,1);
        }
    }
    
    function catchMouse(index, x, y) {
        if(index>=clickerMice.length) return;
        const m = clickerMice[index];
        const gain = Math.floor(m.value);
        clickerCoins += gain;
        clickerTotalMice++;
        updateMissionProgress('mice');
        createParticles(x, y, m.isGolden ? '#FFD966' : '#F59E0B');
        createFloatingNumber(gain, x, y, m.isGolden);
        clickerTokens += Math.floor(gain/10);
        updateClickerUI();
        clickerMice.splice(index,1);
        renderClickerEntities();
        saveClickerData();
        updateMenuResources();
    }
    
    function spawnBubble() {
        if(!clickerGameActive || clickerBubbles.length > 5) return;
        const size = 40 + Math.random() * 30;
        clickerBubbles.push({
            x: 40 + Math.random() * (window.innerWidth - size - 40),
            y: 120 + Math.random() * (window.innerHeight - 240),
            size, value: Math.floor(clickerTapPower * (2 + Math.random() * 3)),
            life: 8000, created: Date.now()
        });
    }
    
    function catchBubble(index, x, y) {
        if(index>=clickerBubbles.length) return;
        const b = clickerBubbles[index];
        clickerCoins += b.value;
        createParticles(x, y, '#FFD966');
        createFloatingNumber(b.value, x, y, true);
        clickerTokens += Math.floor(b.value/10);
        updateClickerUI();
        clickerBubbles.splice(index,1);
        renderClickerEntities();
        saveClickerData();
        updateMenuResources();
    }
    
    function renderClickerEntities() {
        const container = document.getElementById('gameArea');
        const existing = container.querySelectorAll('.game-entity');
        existing.forEach(el => el.remove());
        
        clickerMice.forEach((m, idx) => {
            const div = document.createElement('div');
            div.className = `game-entity ${m.isBoss ? 'mouse-boss' : (m.isGolden ? 'mouse-golden' : 'mouse-normal')}`;
            div.style.cssText = `left:${m.x - m.size/2}px;top:${m.y - m.size/2}px;width:${m.size}px;height:${m.size}px;font-size:${m.size/2.2}px;`;
            div.textContent = m.isBoss ? '🐀👑' : (m.isGolden ? '🐭✨' : '🐭');
            div.dataset.type = 'mouse';
            div.dataset.idx = idx;
            container.appendChild(div);
        });
        
        clickerBubbles.forEach((b, idx) => {
            const div = document.createElement('div');
            div.className = 'game-entity bubble';
            div.style.cssText = `left:${b.x - b.size/2}px;top:${b.y - b.size/2}px;width:${b.size}px;height:${b.size}px;font-size:${b.size/2}px;`;
            div.textContent = '🎁';
            div.dataset.type = 'bubble';
            div.dataset.idx = idx;
            container.appendChild(div);
        });
    }
    
    function updateBillyPosition() {
        if(!clickerGameActive) return;
        clickerBillyX += (clickerTargetX - clickerBillyX) * 0.12;
        clickerBillyY += (clickerTargetY - clickerBillyY) * 0.12;
        const billy = document.getElementById('billy');
        billy.style.left = (clickerBillyX - billy.offsetWidth/2) + 'px';
        billy.style.top = (clickerBillyY - billy.offsetHeight/2) + 'px';
        requestAnimationFrame(updateBillyPosition);
    }
    
    function startClickerGame() {
        clickerGameActive = true;
        loadClickerData();
        updateClickerUI();
        
        document.getElementById('gameArea').innerHTML = '';
        
        const billy = document.getElementById('billy');
        billy.onclick = tapBillyClicker;
        billy.ontouchstart = (e) => { e.preventDefault(); tapBillyClicker(e); };
        
        document.onmousemove = (e) => { clickerTargetX = e.clientX; clickerTargetY = e.clientY; };
        document.ontouchmove = (e) => { e.preventDefault(); const t = e.touches[0]; clickerTargetX = t.clientX; clickerTargetY = t.clientY; };
        
        document.getElementById('gameArea').onclick = (e) => {
            let target = e.target;
            while(target && target !== document.getElementById('gameArea')) {
                if(target.classList?.contains('game-entity')) {
                    const type = target.dataset.type;
                    const idx = parseInt(target.dataset.idx);
                    if(type === 'mouse') catchMouse(idx, e.clientX, e.clientY);
                    else if(type === 'bubble') catchBubble(idx, e.clientX, e.clientY);
                    return;
                }
                target = target.parentElement;
            }
        };
        
        updateBillyPosition();
        
        setInterval(() => spawnMouse(), 3500);
        setInterval(() => spawnBubble(), 6000);
        setInterval(() => { updateMice(); renderClickerEntities(); }, 50);
        setInterval(() => {
            if(clickerGameActive) {
                let regen = Math.max(1, Math.floor(clickerCombo/8));
                clickerEnergy = Math.min(clickerMaxEnergy, clickerEnergy + regen);
                updateClickerUI();
            }
        }, 2000);
        
        setInterval(() => {
            if(clickerGameActive && Math.random()<0.1 && !clickerGoldenHour) {
                clickerGoldenHour = true;
                showNotification("✨ ¡HORA DORADA! Ratones dorados ✨");
                setTimeout(() => { clickerGoldenHour = false; }, 10000);
            }
        }, 35000);
        
        setInterval(() => saveClickerData(), 10000);
    }
    
    // Crear UI del clicker
    const clickerContainer = document.getElementById('clickerContainer');
    clickerContainer.insertAdjacentHTML('beforeend', `
        <div class="top-panel">
            <div class="stat-card">😺 Nv <span id="clickerLevel">1</span></div>
            <div class="stat-card">💰 <span id="clickerCoins">0</span></div>
            <div class="stat-card">💪 <span id="clickerTapPower">1</span></div>
        </div>
        <div class="token-bar" id="clickerTokenBar">⭐ <span id="clickerTokens">0</span> BILLY</div>
        <div class="combo-panel">🔥 <span id="clickerCombo">0</span> COMBO</div>
        <div class="energy-container">
            <div style="display:flex;justify-content:space-between;"><span>⚡ Energía</span><span><span id="clickerEnergy">100</span>/<span id="clickerMaxEnergy">100</span></span></div>
            <div class="energy-bg"><div class="energy-fill" id="clickerEnergyFill"></div></div>
        </div>
        <div class="action-buttons">
            <button class="btn" id="clickerUpgradeBtn">💪 Mejorar</button>
            <button class="btn btn-primary" id="clickerLootBtn">🎁 Cofre</button>
        </div>
    `);
    
    document.getElementById('clickerUpgradeBtn').onclick = () => {
        let cost = Math.floor(50 * Math.pow(1.4, clickerTapPower - 1));
        if(clickerCoins >= cost) {
            clickerCoins -= cost;
            clickerTapPower++;
            updateClickerUI();
            saveClickerData();
            showNotification(`💪 Poder aumentado a ${clickerTapPower}!`);
        } else {
            showNotification(`💰 Faltan ${Math.floor(cost - clickerCoins)} monedas`);
        }
    };
    
    document.getElementById('clickerLootBtn').onclick = () => {
        if(clickerCoins >= 50) {
            clickerCoins -= 50;
            let reward = 80 + Math.floor(Math.random() * 200);
            clickerCoins += reward;
            updateClickerUI();
            showNotification(`🎁 +${reward} monedas!`);
            saveClickerData();
        } else {
            showNotification(`💔 Necesitas 50 monedas`);
        }
    };
    
    document.getElementById('clickerTokenBar').onclick = () => showNotification(`⭐ ${Math.floor(clickerTokens)} BILLY tokens`);
    
    window.startClickerGame = startClickerGame;
    window.saveClickerGame = saveClickerData;
    
    // ==================== JUEGO JUMP ====================
    let jumpGameActive = false;
    let jump = { canvas: null, ctx: null, width: 0, height: 0, score: 0, bestScore: 0, gameOver: false, animationId: null,
        player: { x: 80, y: 0, width: 32, height: 32, vy: 0, gravity: 0.7, jumpPower: -10, grounded: true },
        obstacles: [], spawnCounter: 0, frameCount: 0, activePowerups: { shield: false, magnet: false, double: false }
    };
    
    function startJumpGame() {
        if(jumpGameActive) return;
        jumpGameActive = true;
        jump.width = Math.min(window.innerWidth - 40, 380);
        jump.height = 500;
        jump.player.y = jump.height - 70;
        jump.score = 0;
        jump.bestScore = currentUser?.jump.bestScore || 0;
        jump.gameOver = false;
        jump.obstacles = [];
        jump.spawnCounter = 0;
        jump.activePowerups = { shield: false, magnet: false, double: false };
        
        const container = document.getElementById('jumpContainer');
        container.innerHTML = `
            <div class="game-header"><button class="back-btn" id="jumpBackBtnGame">← VOLVER AL MENÚ</button></div>
            <div class="jump-container">
                <div class="jump-stats">
                    <div class="jump-score-card">🏆 BEST: ${jump.bestScore}</div>
                    <div class="jump-score-card">⭐ SCORE: <span id="jumpScore">0</span></div>
                </div>
                <canvas id="jumpCanvas" class="jump-canvas" width="${jump.width}" height="${jump.height}"></canvas>
                <div class="jump-powerups">
                    <div class="powerup-btn" id="useShield">🛡️ Escudo (${currentUser?.inventory.powerups.shield || 0})</div>
                    <div class="powerup-btn" id="useMagnet">🧲 Iman (${currentUser?.inventory.powerups.magnet || 0})</div>
                    <div class="powerup-btn" id="useDouble">✨ Doble (${currentUser?.inventory.powerups.double || 0})</div>
                </div>
                <div class="jump-instruction" style="color:white;margin-top:15px;">¡Toca la pantalla para saltar!</div>
            </div>
        `;
        
        jump.canvas = document.getElementById('jumpCanvas');
        jump.ctx = jump.canvas.getContext('2d');
        
        document.getElementById('jumpBackBtnGame').onclick = () => {
            cancelAnimationFrame(jump.animationId);
            jumpGameActive = false;
            document.getElementById('jumpContainer').classList.remove('active');
            document.getElementById('mainMenu').style.display = 'flex';
            updateMenuResources();
        };
        
        document.getElementById('useShield').onclick = () => usePowerup('shield');
        document.getElementById('useMagnet').onclick = () => usePowerup('magnet');
        document.getElementById('useDouble').onclick = () => usePowerup('double');
        
        jump.canvas.onclick = () => jumpAction();
        jump.canvas.ontouchstart = (e) => { e.preventDefault(); jumpAction(); };
        
        jump.animationId = requestAnimationFrame(updateJump);
    }
    
    function usePowerup(type) {
        if(currentUser?.inventory.powerups[type] > 0 && !jump.activePowerups[type] && !jump.gameOver) {
            currentUser.inventory.powerups[type]--;
            jump.activePowerups[type] = true;
            saveUser();
            showNotification(`✨ ${type} activado!`);
            document.getElementById(`use${type.charAt(0).toUpperCase() + type.slice(1)}`).textContent = 
                `${type === 'shield' ? '🛡️' : type === 'magnet' ? '🧲' : '✨'} ${type} (${currentUser.inventory.powerups[type]})`;
            setTimeout(() => { jump.activePowerups[type] = false; }, 10000);
        } else if(!jump.gameOver) {
            showNotification(`No tienes ${type} o ya está activo`);
        }
    }
    
    function jumpAction() {
        if(!jump.gameOver && jump.player.grounded) {
            jump.player.vy = jump.player.jumpPower;
            jump.player.grounded = false;
        } else if(jump.gameOver) {
            restartJump();
        }
    }
    
    function restartJump() {
        jump.player.y = jump.height - 70;
        jump.player.vy = 0;
        jump.player.grounded = true;
        jump.obstacles = [];
        jump.score = 0;
        jump.gameOver = false;
        jump.spawnCounter = 0;
        document.getElementById('jumpScore').textContent = 0;
        jump.activePowerups = { shield: false, magnet: false, double: false };
    }
    
    function updateJump() {
        if(!jump.canvas) return;
        const ctx = jump.ctx, w = jump.width, h = jump.height;
        ctx.clearRect(0, 0, w, h);
        
        // Fondo
        const grad = ctx.createLinearGradient(0,0,0,h);
        grad.addColorStop(0, '#1a2a3a');
        grad.addColorStop(1, '#2a3a4a');
        ctx.fillStyle = grad;
        ctx.fillRect(0,0,w,h);
        
        // Suelo
        ctx.fillStyle = '#5D3A1A';
        ctx.fillRect(0, h-45, w, 45);
        ctx.fillStyle = '#8B5A2B';
        ctx.fillRect(0, h-48, w, 3);
        
        if(!jump.gameOver) {
            jump.player.vy += jump.player.gravity;
            jump.player.y += jump.player.vy;
            if(jump.player.y >= h-45-jump.player.height) {
                jump.player.y = h-45-jump.player.height;
                jump.player.vy = 0;
                jump.player.grounded = true;
            }
            if(jump.player.y < 0) { jump.player.y = 0; if(jump.player.vy<0) jump.player.vy=0; }
            
            jump.spawnCounter++;
            let spawnRate = Math.max(40, 65 - Math.floor(jump.score/30));
            if(jump.spawnCounter > spawnRate) {
                jump.spawnCounter = 0;
                jump.obstacles.push({ x: w, y: h-45-40, width: 28, height: 40, type: 'rock' });
            }
            
            for(let i=0; i<jump.obstacles.length; i++) {
                const obs = jump.obstacles[i];
                obs.x -= 4.5 + Math.floor(jump.score/80);
                if(obs.x + obs.width < 0) {
                    jump.obstacles.splice(i,1);
                    let addScore = jump.activePowerups.double ? 2 : 1;
                    jump.score += addScore;
                    document.getElementById('jumpScore').textContent = jump.score;
                    i--;
                }
                
                if(obs.x < jump.player.x + jump.player.width && obs.x + obs.width > jump.player.x &&
                   obs.y < jump.player.y + jump.player.height && obs.y + obs.height > jump.player.y) {
                    if(jump.activePowerups.shield) {
                        jump.activePowerups.shield = false;
                        jump.obstacles.splice(i,1);
                        showNotification("🛡️ Escudo usado!");
                    } else {
                        jump.gameOver = true;
                        if(jump.score > jump.bestScore) {
                            jump.bestScore = jump.score;
                            if(currentUser) currentUser.jump.bestScore = jump.score;
                            saveUser();
                        }
                        const reward = Math.floor(jump.score * 5);
                        clickerCoins += reward;
                        updateClickerUI();
                        saveClickerData();
                        updateMenuResources();
                        showNotification(`🎉 +${reward} monedas!`);
                    }
                }
            }
        }
        
        // Dibujar obstáculos
        for(const obs of jump.obstacles) {
            ctx.fillStyle = '#6B4E2E';
            ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            ctx.fillStyle = '#4A2A1A';
            ctx.fillRect(obs.x+8, obs.y+10, 6, 12);
            ctx.fillRect(obs.x+16, obs.y+6, 6, 16);
        }
        
        // Dibujar jugador (gato negro)
        ctx.fillStyle = '#1a1a2a';
        ctx.beginPath();
        ctx.ellipse(jump.player.x + jump.player.width/2, jump.player.y + jump.player.height/2, 16, 16, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#FFD966';
        ctx.beginPath();
        ctx.ellipse(jump.player.x + 10, jump.player.y + 12, 3, 4, 0, 0, Math.PI*2);
        ctx.ellipse(jump.player.x + 22, jump.player.y + 12, 3, 4, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.ellipse(jump.player.x + 9, jump.player.y + 11, 1.5, 2, 0, 0, Math.PI*2);
        ctx.ellipse(jump.player.x + 21, jump.player.y + 11, 1.5, 2, 0, 0, Math.PI*2);
        ctx.fill();
        
        if(jump.gameOver) {
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0,0,w,h);
            ctx.fillStyle = 'white';
            ctx.font = 'bold 24px "Segoe UI"';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', w/2, h/2-30);
            ctx.font = '16px "Segoe UI"';
            ctx.fillText('Toca para reiniciar', w/2, h/2+30);
            ctx.fillStyle = '#FFD966';
            ctx.fillText(`⭐ ${jump.score} pts`, w/2, h/2+80);
        }
        
        jump.frameCount++;
        jump.animationId = requestAnimationFrame(updateJump);
    }
    
    window.startJumpGame = startJumpGame;
    
    // Añadir estilo de ripple
    const style = document.createElement('style');
    style.textContent = `@keyframes rippleAnim { from { transform: scale(0); opacity: 0.7; } to { transform: scale(5); opacity: 0; } }`;
    document.head.appendChild(style);
</script>
</body>
</html>
