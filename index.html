<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>🐈‍⬛ BYLLI - 2 JUEGOS EN 1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', 'Comic Neue', system-ui, sans-serif;
            min-height: 100vh;
            overflow: hidden;
            background: #0a0a2a;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }

        @keyframes bounceIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes floatUp {
            to { transform: translateY(-70px); opacity: 0; }
        }

        @keyframes fadeOutUp {
            to { opacity: 0; transform: translate(-50%, -80%); }
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #0a0a2a 0%, #050510 100%);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .start-logo {
            text-align: center;
            margin-bottom: 30px;
            animation: float 3s infinite;
        }

        .start-logo img {
            width: 280px;
            max-width: 80%;
            border-radius: 30px;
            filter: drop-shadow(0 10px 25px rgba(0,0,0,0.5));
        }

        .start-card {
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(20px);
            border-radius: 60px;
            padding: 30px 35px;
            text-align: center;
            width: 85%;
            max-width: 380px;
            border: 2px solid rgba(255,200,100,0.5);
            animation: slideUp 0.5s ease;
        }

        .register-input {
            width: 100%;
            padding: 15px 20px;
            border-radius: 50px;
            border: none;
            background: rgba(255,255,255,0.12);
            color: white;
            font-size: 16px;
            text-align: center;
            margin-bottom: 18px;
        }

        .register-input:focus {
            outline: none;
            background: rgba(255,255,255,0.2);
            box-shadow: 0 0 15px rgba(255,200,100,0.4);
        }

        .register-btn {
            background: linear-gradient(135deg, #fbbf24, #e67e22);
            border: none;
            padding: 15px 25px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            color: #1e1a2f;
            cursor: pointer;
            width: 100%;
        }

        .register-btn:active { transform: scale(0.97); }
        .error-msg { color: #ff6b6b; font-size: 12px; margin-top: 12px; }

        /* Menú principal */
        .main-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #0a0a2a 0%, #050510 100%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
        }

        .menu-container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }

        .user-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(12px);
            border-radius: 70px;
            padding: 12px 22px;
            margin-bottom: 25px;
            border: 1px solid rgba(255,200,100,0.4);
        }

        .user-info { display: flex; align-items: center; gap: 14px; }
        .user-avatar {
            width: 52px; height: 52px;
            background: linear-gradient(135deg, #fbbf24, #e67e22);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }
        .user-details h3 { color: #FFD966; font-size: 16px; }
        .user-details p { color: rgba(255,255,255,0.5); font-size: 11px; }
        .user-stats { display: flex; gap: 18px; }
        .user-stat { text-align: center; }
        .user-stat-value { color: #FFD966; font-weight: bold; font-size: 18px; }
        .user-stat-label { color: rgba(255,255,255,0.5); font-size: 10px; }

        .game-modes { display: flex; gap: 18px; margin: 25px 0; }
        .mode-card {
            flex: 1;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            border-radius: 45px;
            padding: 20px 12px;
            text-align: center;
            cursor: pointer;
            border: 1px solid rgba(255,200,100,0.3);
            transition: transform 0.1s;
        }
        .mode-card:active { transform: scale(0.97); }
        .mode-icon { font-size: 48px; margin-bottom: 10px; }
        .mode-card h3 { color: #FFD966; font-size: 18px; }
        .mode-card p { color: rgba(255,255,255,0.5); font-size: 10px; margin-top: 6px; }

        .resources-bar {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            border-radius: 60px;
            padding: 12px 22px;
            display: flex;
            justify-content: space-between;
            margin: 18px 0;
        }
        .resource { display: flex; align-items: center; gap: 12px; }
        .resource-icon { font-size: 30px; }
        .resource-value { font-size: 18px; font-weight: bold; color: #FFD966; }
        .resource-label { font-size: 10px; color: rgba(255,255,255,0.5); }

        .menu-buttons { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
        .menu-btn {
            flex: 1;
            background: rgba(30,41,59,0.9);
            backdrop-filter: blur(8px);
            border: none;
            padding: 12px;
            border-radius: 45px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }
        .menu-btn:active { transform: scale(0.97); }
        .btn-primary { background: linear-gradient(135deg, #fbbf24, #e67e22); color: #1e1a2f; }

        /* Contenedores de juego */
        .game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1100;
            display: none;
            background: linear-gradient(180deg, #0a0a2a 0%, #1a1a3e 100%);
        }
        .game-container.active { display: block; }
        .game-header {
            position: fixed;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            z-index: 60;
        }
        .back-btn {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            padding: 10px 20px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            border: none;
            font-size: 13px;
        }

        /* JUEGO JUMP */
        .jump-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .jump-canvas {
            display: block;
            border-radius: 25px;
            box-shadow: 0 0 35px rgba(0,0,0,0.5);
            cursor: pointer;
        }
        .jump-ui {
            position: fixed;
            top: 65px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 60;
            pointer-events: none;
        }
        .jump-score-card {
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(12px);
            padding: 8px 18px;
            border-radius: 35px;
            color: #FFD966;
            font-weight: bold;
            font-size: 14px;
            border: 1px solid rgba(255,200,100,0.5);
        }
        .jump-lives {
            display: flex;
            gap: 8px;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(12px);
            padding: 6px 18px;
            border-radius: 35px;
        }
        .life-heart { font-size: 20px; }
        .jump-combo {
            position: fixed;
            top: 125px;
            right: 15px;
            background: rgba(0,0,0,0.85);
            padding: 8px 18px;
            border-radius: 35px;
            color: #FF6B6B;
            font-weight: bold;
            font-size: 18px;
            z-index: 60;
            border: 1px solid #FF6B6B;
        }
        .powerup-indicator {
            position: fixed;
            top: 125px;
            left: 15px;
            background: rgba(0,0,0,0.85);
            padding: 6px 14px;
            border-radius: 35px;
            color: white;
            font-size: 12px;
            z-index: 60;
        }
        .mobile-controls {
            position: fixed;
            bottom: 25px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 50px;
            z-index: 70;
        }
        .control-btn {
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,200,100,0.5);
            border-radius: 50%;
            width: 65px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            cursor: pointer;
        }
        .control-btn:active { transform: scale(0.88); }

        /* JUEGO CLICKER */
        #clickerBilly {
            position: fixed;
            width: 130px;
            height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 20;
            transition: transform 0.05s linear;
        }
        #clickerBilly img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 8px 15px rgba(0,0,0,0.4));
        }
        .clicker-mouse {
            position: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 25;
            transition: transform 0.05s;
        }
        .clicker-mouse:active { transform: scale(0.95); }
        .energy-bar {
            position: fixed;
            bottom: 20px;
            left: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            border-radius: 20px;
            padding: 8px 12px;
            z-index: 30;
        }
        .energy-fill {
            height: 12px;
            background: linear-gradient(90deg, #22c55e, #facc15);
            border-radius: 20px;
            transition: width 0.2s;
        }

        .floating-number {
            position: fixed;
            font-weight: bold;
            font-size: 22px;
            text-shadow: 0 0 5px black;
            pointer-events: none;
            z-index: 150;
            animation: floatUp 0.8s forwards;
            color: #FFD966;
        }
        .notification {
            position: fixed;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #facc15, #f59e0b);
            color: #0c0a1a;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: bold;
            z-index: 200;
            animation: fadeOutUp 1s forwards;
            white-space: nowrap;
            font-size: 14px;
        }
        .notification.achievement {
            background: linear-gradient(135deg, #14f195, #9945ff);
            color: white;
        }
        .game-over-screen {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(18px);
            border-radius: 50px;
            padding: 30px;
            text-align: center;
            z-index: 200;
            min-width: 300px;
            border: 2px solid #ffaa44;
            animation: bounceIn 0.3s ease;
        }
        .restart-btn {
            background: linear-gradient(135deg, #fbbf24, #e67e22);
            border: none;
            padding: 12px 28px;
            border-radius: 45px;
            font-weight: bold;
            cursor: pointer;
            margin: 6px;
        }
        .sound-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            font-size: 24px;
            border: 1px solid #ffaa44;
        }

        /* Modal tienda */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(12px);
        }
        .modal-content {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-radius: 50px;
            padding: 25px;
            width: 90%;
            max-width: 480px;
            max-height: 85vh;
            overflow-y: auto;
            border: 2px solid #ffaa44;
        }
        .modal-content h2 { color: #FFD966; margin-bottom: 20px; text-align: center; }
        .shop-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .shop-tab {
            flex: 1;
            padding: 10px;
            background: rgba(0,0,0,0.5);
            border-radius: 35px;
            text-align: center;
            cursor: pointer;
            color: white;
            font-size: 12px;
        }
        .shop-tab.active { background: linear-gradient(135deg, #fbbf24, #e67e22); color: #1e1a2f; }
        .shop-section { display: none; }
        .shop-section.active { display: block; }
        .shop-item {
            background: rgba(0,0,0,0.5);
            border-radius: 25px;
            padding: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,200,100,0.3);
            cursor: pointer;
        }
        .shop-item:active { transform: scale(0.98); }
        .item-info { flex: 1; }
        .item-name { font-weight: bold; color: white; }
        .item-desc { font-size: 10px; color: #FFD966; }
        .shop-btn {
            background: linear-gradient(135deg, #fbbf24, #e67e22);
            border: none;
            padding: 8px 18px;
            border-radius: 35px;
            font-weight: bold;
            cursor: pointer;
            font-size: 11px;
        }
        .close-modal {
            margin-top: 20px;
            background: #334155;
            padding: 12px 30px;
            border-radius: 35px;
            cursor: pointer;
            width: 100%;
            border: none;
            color: white;
        }

        @media (max-width: 600px) {
            .mode-card { padding: 14px 10px; }
            .mode-icon { font-size: 36px; }
            .control-btn { width: 55px; height: 55px; font-size: 30px; }
            #clickerBilly { width: 100px; height: 100px; }
        }
    </style>
</head>
<body>

<div class="sound-toggle" id="soundToggle">🔊</div>

<!-- Pantalla de inicio -->
<div class="start-screen" id="startScreen">
    <div class="start-logo">
        <img id="startLogoImg" src="https://raw.githubusercontent.com/billyzatanas/billy-run/main/billy_inicio.png" alt="BYLLI" onerror="this.outerHTML='<div style=\'font-size:48px;color:#FFD966;\'>🐈‍⬛ BYLLI<br><span style=\'font-size:20px;\'>2 JUEGOS EN 1</span></div>'">
    </div>
    <div class="start-card">
        <input type="text" class="register-input" id="nicknameInput" placeholder="Tu nombre" maxlength="15">
        <button class="register-btn" id="startBtn">🎮 COMENZAR AVENTURA</button>
        <div id="startError" class="error-msg"></div>
    </div>
</div>

<!-- Menú principal -->
<div class="main-menu" id="mainMenu" style="display: none;">
    <div class="menu-container">
        <div class="user-header">
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">🐱</div>
                <div class="user-details">
                    <h3 id="userNickname">Jugador</h3>
                    <p>🐈‍⬛ BYLLI</p>
                </div>
            </div>
            <div class="user-stats">
                <div class="user-stat"><div class="user-stat-value" id="userLevel">1</div><div class="user-stat-label">Nivel</div></div>
                <div class="user-stat"><div class="user-stat-value" id="userLives">3</div><div class="user-stat-label">Vidas</div></div>
            </div>
        </div>
        <div class="game-modes">
            <div class="mode-card" id="playJumpBtn">
                <div class="mode-icon">🐈‍⬛</div>
                <h3>BILLY JUMP</h3>
                <p>Salta, aplasta, sube</p>
            </div>
            <div class="mode-card" id="playClickerBtn">
                <div class="mode-icon">💰</div>
                <h3>BILLY CLICKER</h3>
                <p>Toca, atrapa, mejora</p>
            </div>
        </div>
        <div class="resources-bar">
            <div class="resource"><div class="resource-icon">🪙</div><div class="resource-info"><div class="resource-value" id="menuCoins">0</div><div class="resource-label">Monedas</div></div></div>
            <div class="resource"><div class="resource-icon">⭐</div><div class="resource-info"><div class="resource-value" id="menuTokens">0</div><div class="resource-label">BILLY Tokens</div></div></div>
            <div class="resource"><div class="resource-icon">🏆</div><div class="resource-info"><div class="resource-value" id="menuRecord">0</div><div class="resource-label">Récord Jump</div></div></div>
        </div>
        <div class="menu-buttons">
            <button class="menu-btn" id="statsBtn">📊 Estadísticas</button>
            <button class="menu-btn btn-primary" id="shopBtn">🛒 Tienda</button>
            <button class="menu-btn" id="rankingBtn">🏆 Ranking</button>
            <button class="menu-btn" id="missionsBtn">📅 Misiones</button>
            <button class="menu-btn" id="codeBtn">🔑 Código</button>
        </div>
    </div>
</div>

<!-- Contenedor Jump -->
<div class="game-container" id="jumpContainer">
    <div class="game-header"><button class="back-btn" id="jumpBackBtn">← MENÚ</button></div>
    <div class="jump-ui">
        <div class="jump-score-card">⭐ SCORE: <span id="jumpScore">0</span></div>
        <div class="jump-lives" id="jumpLivesContainer"></div>
    </div>
    <div class="jump-combo" id="jumpComboDisplay" style="display: none;">🔥 x<span id="comboMultiplier">1</span></div>
    <div class="powerup-indicator" id="powerupIndicator" style="display: none;"></div>
    <div class="jump-wrapper" id="jumpGameArea"></div>
    <div class="mobile-controls">
        <div class="control-btn" id="leftBtn">◀</div>
        <div class="control-btn" id="rightBtn">▶</div>
    </div>
    <div id="gameOverModal" style="display: none;"></div>
</div>

<!-- Contenedor Clicker -->
<div class="game-container" id="clickerContainer">
    <div class="game-header"><button class="back-btn" id="clickerBackBtn">← MENÚ</button></div>
    <div style="position: fixed; top: 80px; left: 0; right: 0; text-align: center; z-index: 30;">
        <div style="display: flex; justify-content: center; gap: 20px; flex-wrap: wrap;">
            <div class="jump-score-card">💰 <span id="clickerCoins">0</span> monedas</div>
            <div class="jump-score-card">⭐ <span id="clickerTokens">0</span> BILLY</div>
            <div class="jump-score-card">💪 Poder: <span id="clickerPower">1</span></div>
            <div class="jump-score-card">⚡ Crítico: <span id="clickerCrit">5</span>%</div>
        </div>
    </div>
    <div id="clickerGameArea" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 15;"></div>
    <div id="clickerBilly"><img id="clickerBillyImg" src="https://raw.githubusercontent.com/billyzatanas/billy-run/main/billy-normal.png" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%23FFD966%22/%3E%3Ctext x=%2250%22 y=%2270%22 text-anchor=%22middle%22 fill=%22%23FFA500%22 font-size=%2240%22%3E🐱%3C/text%3E%3C/svg%3E'"></div>
    <div class="energy-bar">
        <div style="display: flex; justify-content: space-between; color: white; font-size: 12px;"><span>⚡ Energía</span><span id="clickerEnergyText">100/100</span></div>
        <div style="background: #2d2a3e; border-radius: 20px; overflow: hidden; margin-top: 4px;"><div class="energy-fill" id="clickerEnergyFill" style="width: 100%;"></div></div>
    </div>
    <div style="position: fixed; bottom: 90px; left: 10px; right: 10px; display: flex; gap: 10px; z-index: 30;">
        <button class="menu-btn" id="clickerUpgradeBtn" style="flex:1; background:#fbbf24; color:#1e1a2f;">💪 Mejorar</button>
        <button class="menu-btn" id="clickerAutoBtn" style="flex:1;">🤖 Auto-click</button>
    </div>
</div>

<script>
    // ==================== CONFIGURACIÓN ====================
    let soundEnabled = true;
    let currentUser = null;
    let audioCtx = null;
    
    // URLs de imágenes
    const IMG = {
        normal: 'https://raw.githubusercontent.com/billyzatanas/billy-run/main/billy-normal.png',
        jump: 'https://raw.githubusercontent.com/billyzatanas/billy-run/main/bylli-jumpin.png',
        fall: 'https://raw.githubusercontent.com/billyzatanas/billy-run/main/billy-abajo.png',
        happy: 'https://raw.githubusercontent.com/billyzatanas/billy-run/main/bylli-alegre.png',
        angry: 'https://raw.githubusercontent.com/billyzatanas/billy-run/main/bylli-enojado.png',
        run: 'https://raw.githubusercontent.com/billyzatanas/billy-run/main/bylli-hacia-delante.png',
        sad: 'https://raw.githubusercontent.com/billyzatanas/billy-run/main/bylli-llorando.png',
        relax: 'https://raw.githubusercontent.com/billyzatanas/billy-run/main/bylli-relax.png',
        surprised: 'https://raw.githubusercontent.com/billyzatanas/billy-run/main/bylli-sorprendido.png',
        star: 'https://raw.githubusercontent.com/billyzatanas/billy-run/main/estrella.png'
    };
    
    // Sonidos
    function initAudio() { if(!audioCtx && soundEnabled) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    function playSound(freq, duration = 0.12, type = 'sine') {
        if(!soundEnabled) return;
        try {
            initAudio();
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            osc.type = type;
            gain.gain.value = 0.12;
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }
    function playJumpSound() { playSound(523, 0.1, 'sine'); }
    function playLandSound() { playSound(330, 0.08, 'triangle'); }
    function playStompSound() { playSound(220, 0.15, 'sawtooth'); }
    function playHitSound() { playSound(164, 0.2, 'sawtooth'); }
    function playPowerUpSound() { playSound(880, 0.15, 'sine'); playSound(1046, 0.15, 'sine'); }
    function playGameOverSound() { playSound(220, 0.3, 'sawtooth'); playSound(164, 0.3, 'sawtooth'); }
    function playClickSound() { playSound(440, 0.05, 'sine'); }
    function playCoinSound() { playSound(660, 0.08, 'sine'); }
    function playCritSound() { playSound(1046, 0.1, 'sine'); }

    function saveUser() {
        if(currentUser) {
            localStorage.setItem('billyUser_' + currentUser.userId, JSON.stringify(currentUser));
            localStorage.setItem('billyCurrentUser', currentUser.userId);
        }
    }
    
    function loadUser(userId) {
        const saved = localStorage.getItem('billyUser_' + userId);
        if(saved) { currentUser = JSON.parse(saved); return true; }
        return false;
    }
    
    function getAllNicknames() {
        let nicknames = [];
        for(let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if(key && key.startsWith('billyUser_')) {
                try { nicknames.push(JSON.parse(localStorage.getItem(key)).nickname); } catch(e) {}
            }
        }
        return nicknames;
    }
    
    function registerUser(nickname) {
        if(nickname.length < 3) { document.getElementById('startError').textContent = "Mínimo 3 caracteres"; return false; }
        if(getAllNicknames().includes(nickname)) { document.getElementById('startError').textContent = "Nombre ya existe"; return false; }
        currentUser = createDefaultUser(nickname);
        saveUser();
        return true;
    }

    // ==================== SISTEMA DE MISIONES ====================
    function checkDailyMissions() {
        const today = new Date().toDateString();
        if(!currentUser.dailyMissions || currentUser.dailyMissions.date !== today) {
            currentUser.dailyMissions = {
                date: today, taps: 0, mice: 0, jumpScore: 0,
                completed: []
            };
            saveUser();
        }
    }
    
    function updateMissionProgress(type, amount = 1) {
        if(!currentUser) return;
        checkDailyMissions();
        const mission = currentUser.dailyMissions;
        if(type === 'tap') mission.taps += amount;
        if(type === 'mice') mission.mice += amount;
        if(type === 'jump') mission.jumpScore += amount;
        
        let rewards = 0;
        if(mission.taps >= 50 && !mission.completed.includes('tap')) {
            mission.completed.push('tap');
            rewards = 100;
            showNotification("🎉 Misión: 50 taps completada! +100 monedas", "achievement");
        }
        if(mission.mice >= 20 && !mission.completed.includes('mice')) {
            mission.completed.push('mice');
            rewards += 150;
            showNotification("🎉 Misión: 20 ratones completada! +150 monedas", "achievement");
        }
        if(mission.jumpScore >= 500 && !mission.completed.includes('jump')) {
            mission.completed.push('jump');
            rewards += 200;
            showNotification("🎉 Misión: 500 puntos en Jump completada! +200 monedas", "achievement");
        }
        if(rewards > 0) {
            currentUser.resources.coins += rewards;
            saveUser();
            updateMenuUI();
        }
    }

    function spawnClickerMouse() {
        if(!clickerActive) return;
        const size = 45;
        const y = 150 + Math.random() * (window.innerHeight - 250);
        const fromLeft = Math.random() < 0.5;
        const xStart = fromLeft ? -60 : window.innerWidth + 60;
        const dir = fromLeft ? 1 : -1;
        const value = Math.floor((clickerPower || 1) * (2 + Math.random() * 3));
        clickerMice.push({ x: xStart, y: y, size: size, dir: dir, speed: 1.2 + Math.random() * 0.8, value: value });
        renderClickerMice();
    }
    
    function renderClickerMice() {
        const container = document.getElementById('clickerGameArea');
        const existing = container.querySelectorAll('.clicker-mouse');
        existing.forEach(el => el.remove());
        
        clickerMice.forEach((m, idx) => {
            const div = document.createElement('div');
            div.className = 'clicker-mouse';
            div.style.cssText = `left:${m.x - m.size/2}px;top:${m.y - m.size/2}px;width:${m.size}px;height:${m.size}px;background:radial-gradient(circle,#8B5A2B,#5D3A1A);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;border:2px solid #b97f44;`;
            div.textContent = '🐭';
            div.onclick = (e) => {
                e.stopPropagation();
                if(clickerEnergy >= 5) {
                    clickerEnergy -= 5;
                    currentUser.resources.coins += m.value;
                    currentUser.resources.tokens += Math.floor(m.value / 10);
                    currentUser.clicker.totalMice++;
                    createFloatingNumber(m.value, e.clientX, e.clientY, true);
                    playCoinSound();
                    clickerMice.splice(idx, 1);
                    updateClickerUI();
                    saveUser();
                    updateMenuUI();
                    renderClickerMice();
                    updateMissionProgress('mice');
                } else {
                    showNotification("💤 Sin energía! Espera un momento", "normal");
                }
            };
            container.appendChild(div);
        });

    function startClickerGame() {

        clickerActive = true;
        if(currentUser) {
            clickerPower = currentUser.clicker.tapPower;

        updateClickerUI();
        
        const billyDiv = document.getElementById('clickerBilly');
        const billyImg = document.getElementById('clickerBillyImg');
        
        const handleTap = (e) => {
            e.stopPropagation();
            if(clickerEnergy < 10) {
                showNotification("💤 Sin energía! Espera un momento", "normal");
                return;
            }
            
            clickerEnergy -= 10;
            let gain = clickerPower;
            
            // Sistema de combo
            clickerCombo++;
            if(clickerComboTimer) clearTimeout(clickerComboTimer);
            clickerComboTimer = setTimeout(() => {
                if(clickerCombo >= 5) showNotification(`🔥 Combo de ${clickerCombo} perdido!`, "normal");
                clickerCombo = 0;
            }, 2000);
            
            // Multiplicador por combo
            let comboMulti = 1 + Math.min(clickerCombo / 20, 0.5);
            gain *= comboMulti;
            
            // Crítico
            let critChance = 5 + (currentUser?.inventory.skills.luck * 3 || 0);
            if(currentUser?.inventory.activePet === 'owl') critChance += 10;
            const isCrit = Math.random() * 100 < critChance;
            if(isCrit) {
                gain *= 3;
                currentUser.clicker.totalCrits++;
                playCritSound();
                createFloatingNumber(gain, e.clientX || window.innerWidth/2, e.clientY || window.innerHeight/2, true);
            } else {
                createFloatingNumber(gain, e.clientX || window.innerWidth/2, e.clientY || window.innerHeight/2, false);
            }
            
            // Bono por mascota dragón
            if(currentUser?.inventory.activePet === 'dragon') gain *= 1.1;
            
            // Bono por habilidad economía
            gain *= (1 + (currentUser?.inventory.skills.economy * 0.1 || 0));
            
            currentUser.resources.coins += Math.floor(gain);
            currentUser.resources.tokens += Math.floor(gain / 15);
            currentUser.clicker.totalTaps++;
            
            updateClickerUI();
            saveUser();
            updateMenuUI();
            
            // Efecto visual
            billyDiv.style.transform = 'scale(0.92)';
            setTimeout(() => billyDiv.style.transform = 'scale(1)', 100);
            billyImg.src = currentUser?.inventory.skins.find(s => s.equipped)?.id === 'golden' ? IMG.happy : IMG.happy;
            setTimeout(() => billyImg.src = currentUser?.inventory.skins.find(s => s.equipped)?.id === 'golden' ? IMG.happy : IMG.normal, 150);
            
            playClickSound();
            updateMissionProgress('tap');
        };
        
        billyDiv.onclick = handleTap;
        billyDiv.ontouchstart = (e) => { e.preventDefault(); handleTap(e); };
        
        // Auto-click
        if(window.clickerAutoInterval) clearInterval(window.clickerAutoInterval);
        if(clickerAutoPower > 0) {
            window.clickerAutoInterval = setInterval(() => {
                if(clickerActive && clickerEnergy >= 10) {
                    clickerEnergy -= 10;
                    let gain = clickerAutoPower;
                    currentUser.resources.coins += gain;
                    saveUser();
                    updateClickerUI();
                    updateMenuUI();
                }
            }, 1000);
        }
        
        // Regeneración de energía
        if(window.energyInterval) clearInterval(window.energyInterval);
        window.energyInterval = setInterval(regenerateEnergy, 2000);
        
        // Spawn de ratones
        if(window.mouseInterval) clearInterval(window.mouseInterval);
        window.mouseInterval = setInterval(() => spawnClickerMouse(), 3500);
        if(window.mouseMoveInterval) clearInterval(window.mouseMoveInterval);
        window.mouseMoveInterval = setInterval(() => updateClickerMice(), 50);

    }

    function getBillySprite() {

        if(activePowerups.shield > 0) return billyImages.surprised;
        if(player.state === 'hit') return billyImages.angry;
        if(!player.grounded) return player.vy < -2 ? billyImages.jump : billyImages.fall;
        if(Math.abs(player.vx) > 0.5) return billyImages.run;
        if(combo >= 3) return billyImages.happy;
        return billyImages.normal;
    }
    
    function generateJumpPlatforms() {
        platforms = [];
        platforms.push({ x: jumpWidth/2 - 45, y: jumpHeight - 30, width: 90, height: 14, type: 0 });
        let lastY = jumpHeight - 80;
        let platformCount = 18 + Math.floor(difficulty * 2);
        for(let i = 0; i < platformCount; i++) {
            let typeRand = Math.random();
            let platformType = typeRand < 0.55 ? 0 : (typeRand < 0.7 ? 1 : (typeRand < 0.82 ? 2 : (typeRand < 0.92 ? 3 : 4)));
            let x = 15 + Math.random() * (jumpWidth - 90);
            let y = lastY - (38 + Math.random() * 48);
            lastY = y;
            platforms.push({ x, y, width: 70, height: 12, type: platformType, breaking: false, blinkCounter: 0 });
        }
        
        monsters = []; powerups = [];
        platforms.forEach((platform, idx) => {
            if(idx > 0 && idx < platforms.length - 2) {
                let monsterChance = 0.25 + (difficulty * 0.05);
                if(Math.random() < monsterChance) {
                    monsters.push({
                        x: platform.x + platform.width/2 - 16, y: platform.y - 28,
                        width: 32, height: 28, patrolDirection: Math.random() > 0.5 ? 1 : -1,
                        patrolX: platform.x + platform.width/2 - 16
                    });
                }
                if(Math.random() < 0.18) {
                    const types = ['jetpack', 'shield', 'magnet', 'slowmo'];
                    powerups.push({
                        x: platform.x + platform.width/2 - 14, y: platform.y - 32,
                        width: 28, height: 28, type: types[Math.floor(Math.random() * types.length)],
                        floatOffset: Math.random() * Math.PI * 2
                    });
                }
            }
        });
    }

    function updateJumpGame() {
        if(!jumpCanvas || !jumpCtx || gameOver || !jumpGameActive) {
            if(jumpAnimationId) requestAnimationFrame(updateJumpGame);
            return;
        }
        
        const ctx = jumpCtx, w = jumpWidth, h = jumpHeight;
        let deltaSpeed = activePowerups.slowmo > 0 ? 0.55 : 1;
        
        // Actualizar dificultad basada en puntuación
        difficulty = 1 + Math.floor(score / 400);
        let currentMoveSpeed = 3.5 + (difficulty * 0.2);
        
        // Fondo
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#0a0a2a');
        grad.addColorStop(0.6, '#1a1a3e');
        grad.addColorStop(1, '#0a0a1a');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
        
        // Movimiento
        if(leftPressed) player.vx = -currentMoveSpeed;
        else if(rightPressed) player.vx = currentMoveSpeed;
        else player.vx *= 0.95;
        if(player.vx > 0) player.facingRight = true;
        if(player.vx < 0) player.facingRight = false;
        
        player.vy += player.gravity * deltaSpeed;
        if(activePowerups.jetpack > 0) {
            player.vy = -5.2 * deltaSpeed;
            activePowerups.jetpack -= deltaSpeed;
        }
        
        player.y += player.vy * deltaSpeed;
        player.x += player.vx * deltaSpeed;
        player.x = Math.max(5, Math.min(w - player.width - 5, player.x));
        
        let targetCameraY = player.y < h * 0.4 ? Math.min(0, player.y - h * 0.4) : 0;
        cameraY += (targetCameraY - cameraY) * 0.12;
        
        // Colisiones plataformas
        player.grounded = false;
        for(let i = 0; i < platforms.length; i++) {
            const p = platforms[i];
            const platformY = p.y + cameraY;
            if(p.type === 4 && p.breaking) { p.blinkCounter++; if(p.blinkCounter > 35) { platforms.splice(i,1); i--; continue; } }
            
            if(player.vy >= 0 && player.x + player.width - 5 > p.x && player.x + 5 < p.x + p.width &&
               player.y + player.height > platformY && player.y + player.height < platformY + p.height + 8) {
                player.y = platformY - player.height;
                player.vy = 0;
                player.grounded = true;
                
                if(player.vy > 4) playLandSound();
                
                if(p.y < lastPlatformY - 35) {
                    comboCounter++;
                    combo = Math.min(3, Math.floor(comboCounter / 4) + 1);
                } else comboCounter = Math.max(0, comboCounter - 0.8);
                lastPlatformY = p.y;
                
                switch(p.type) {
                    case 1: platforms.splice(i,1); i--; break;
                    case 2: player.vy = -13.5; playJumpSound(); break;
                    case 3: player.vx = (player.vx || (player.facingRight ? 1 : -1)) * 1.6; break;
                    case 4: p.breaking = true; break;
                }
                
                // PUNTOS BALANCEADOS
                let basePoints = 3 + Math.floor(score / 800);
                let points = basePoints * combo;
                score += points;
                createFloatingNumber(points, player.x + player.width/2, player.y, true);
                updateJumpUI();
                updateMissionProgress('jump', points);
                break;
            }
        }
        
        player.state = player.grounded ? 'idle' : 'fall';
        if(player.y > h + 80) applyDamage();
        
        // Monstruos
        for(let i = 0; i < monsters.length; i++) {
            const m = monsters[i];
            m.x += m.patrolDirection * 1.2 * deltaSpeed;
            if(m.x < m.patrolX - 30) m.patrolDirection = 1;
            if(m.x > m.patrolX + 30) m.patrolDirection = -1;
            
            const monsterY = m.y + cameraY;
            if(player.x + player.width - 5 > m.x && player.x + 5 < m.x + m.width &&
               player.y + player.height > monsterY && player.y < monsterY + m.height) {
                if(player.vy > 0 && player.y + player.height < monsterY + m.height/2 + 5) {
                    monsters.splice(i,1); i--;
                    player.vy = -7.5;
                    // PUNTOS POR APLASTAR BALANCEADOS
                    let stompPoints = 8 + Math.floor(score / 600);
                    score += stompPoints * combo;
                    updateJumpUI();
                    playStompSound();
                    createFloatingNumber(stompPoints * combo, m.x + m.width/2, monsterY, true);
                    if(currentUser) currentUser.jump.totalStomps++;
                } else applyDamage();
            }
        }
        
        // Power-ups
        for(let i = 0; i < powerups.length; i++) {
            const p = powerups[i];
            p.floatOffset += 0.06;
            const powerY = p.y + cameraY + Math.sin(p.floatOffset) * 4;
            if(player.x + player.width - 5 > p.x && player.x + 5 < p.x + p.width &&
               player.y + player.height > powerY && player.y < powerY + p.height) {
                activePowerups[p.type] = p.type === 'jetpack' ? 160 : (p.type === 'shield' ? 280 : (p.type === 'magnet' ? 340 : 220));
                powerups.splice(i,1); i--;
                playPowerUpSound();
                showNotification(`✨ POWER-UP: ${p.type.toUpperCase()}!`, "achievement");
                if(currentUser) currentUser.jump.totalPowerups++;
                updateJumpUI();
            }
        }
        
        // Actualizar duración de power-ups
        if(activePowerups.magnet > 0) activePowerups.magnet -= deltaSpeed;
        if(activePowerups.jetpack > 0) activePowerups.jetpack -= deltaSpeed;
        if(activePowerups.shield > 0) activePowerups.shield -= deltaSpeed;
        if(activePowerups.slowmo > 0) activePowerups.slowmo -= deltaSpeed;
        
        // Dibujado
        for(const p of platforms) {
            const y = p.y + cameraY;
            if(y > h + 100 || y < -80) continue;
            ctx.fillStyle = p.type === 0 ? '#4CAF50' : (p.type === 1 ? '#f44336' : (p.type === 2 ? '#2196F3' : (p.type === 3 ? '#FFC107' : '#FF9800')));
            if(p.type === 4 && p.breaking) ctx.globalAlpha = 0.5;
            ctx.fillRect(p.x, y, p.width, p.height);
            ctx.fillStyle = 'rgba(255,255,255,0.25)';
            ctx.fillRect(p.x, y, p.width, 3);
            ctx.globalAlpha = 1;
        }
        
        for(const p of powerups) {
            const y = p.y + cameraY + Math.sin(p.floatOffset) * 4;
            if(starImage && starImage.complete) ctx.drawImage(starImage, p.x, y, p.width, p.height);
            ctx.fillStyle = 'white';
            ctx.font = `${p.width-6}px "Segoe UI"`;
            ctx.fillText(p.type === 'jetpack' ? '🚀' : (p.type === 'shield' ? '🛡️' : (p.type === 'magnet' ? '🧲' : '⏱️')), p.x + 6, y + p.height - 6);
        }
        
        for(const m of monsters) {
            const y = m.y + cameraY;
            ctx.fillStyle = '#5D2E2E';
            ctx.beginPath();
            ctx.ellipse(m.x + m.width/2, y + m.height/2, m.width/2, m.height/2, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#FF6666';
            ctx.beginPath();
            ctx.arc(m.x + m.width - 10, y + m.height/2 - 6, 2.5, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(m.x + 10, y + m.height/2 - 6, 2.5, 0, Math.PI*2);
            ctx.fill();
        }
        
        const sprite = getBillySprite();
        ctx.save();
        if(!player.facingRight && sprite) {
            ctx.translate(player.x + player.width/2, player.y + player.height/2);
            ctx.scale(-1, 1);
            ctx.translate(-(player.x + player.width/2), -(player.y + player.height/2));
        }
        if(sprite && sprite.complete) ctx.drawImage(sprite, player.x, player.y, player.width, player.height);
        ctx.restore();
        
        if(activePowerups.shield > 0) {
            ctx.beginPath();
            ctx.arc(player.x + player.width/2, player.y + player.height/2, player.width/2 + 6, 0, Math.PI*2);
            ctx.strokeStyle = '#4CAF50';
            ctx.lineWidth = 3;
            ctx.stroke();
        }
        
        jumpAnimationId = requestAnimationFrame(updateJumpGame);
    }
    
    function startJumpGame() {
        if(jumpGameActive) return;
        jumpGameActive = true;
        jumpWidth = Math.min(window.innerWidth - 30, 420);
        jumpHeight = Math.min(window.innerHeight - 100, 640);
        
        const container = document.getElementById('jumpGameArea');
        container.innerHTML = `<canvas id="jumpMainCanvas" width="${jumpWidth}" height="${jumpHeight}" class="jump-canvas"></canvas>`;
        jumpCanvas = document.getElementById('jumpMainCanvas');
        jumpCtx = jumpCanvas.getContext('2d');
        
        resetJumpGame();
        
        const handleJump = (e) => {
            e.preventDefault();
            if(!gameOver && player.grounded && activePowerups.jetpack <= 0) {
                player.vy = player.jumpPower;
                player.grounded = false;
                playJumpSound();
                if(currentUser) currentUser.jump.totalJumps++;
            }
        };
        
        jumpCanvas.onclick = handleJump;
        jumpCanvas.ontouchstart = handleJump;
        
        window.onkeydown = (e) => {
            if(e.key === 'ArrowLeft') leftPressed = true;
            if(e.key === 'ArrowRight') rightPressed = true;
            if(e.key === 'ArrowUp' || e.key === ' ') {
                e.preventDefault();
                if(!gameOver && player.grounded && activePowerups.jetpack <= 0) {
                    player.vy = player.jumpPower;
                    player.grounded = false;
                    playJumpSound();
                }
            }
        };
        window.onkeyup = (e) => {
            if(e.key === 'ArrowLeft') leftPressed = false;
            if(e.key === 'ArrowRight') rightPressed = false;
        };
        
        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');
        leftBtn.onmousedown = () => leftPressed = true;
        leftBtn.onmouseup = () => leftPressed = false;
        leftBtn.ontouchstart = () => leftPressed = true;
        leftBtn.ontouchend = () => leftPressed = false;
        rightBtn.onmousedown = () => rightPressed = true;
        rightBtn.onmouseup = () => rightPressed = false;
        rightBtn.ontouchstart = () => rightPressed = true;
        rightBtn.ontouchend = () => rightPressed = false;
        
        jumpAnimationId = requestAnimationFrame(updateJumpGame);
    }

            saveUser();
            updateClickerUI();
            updateMenuUI();
            showNotification(`💪 Poder aumentado a ${currentUser.clicker.tapPower}!`, "achievement");
        } else showNotification(`💰 Necesitas ${cost} monedas`, "normal");
    };
    
    document.getElementById('clickerAutoBtn').onclick = () => {
        const cost = 200 + (currentUser.clicker.autoPower * 50);
        if(currentUser.resources.coins >= cost) {
            currentUser.resources.coins -= cost;
            currentUser.clicker.autoPower++;
            saveUser();
            updateClickerUI();
            updateMenuUI();
            if(window.clickerAutoInterval) clearInterval(window.clickerAutoInterval);
            window.clickerAutoInterval = setInterval(() => {
                if(clickerActive) {
                    currentUser.resources.coins += currentUser.clicker.autoPower;
                    saveUser();
                    updateClickerUI();
                    updateMenuUI();
                }
            }, 1000);
            showNotification(`🤖 Auto-click nivel ${currentUser.clicker.autoPower}!`, "achievement");
        } else showNotification(`💰 Necesitas ${cost} monedas`, "normal");
    };
    
    document.getElementById('statsBtn').onclick = () => {
        if(!currentUser) return;
        showNotification(`📊 ${currentUser.nickname} | 🗡️ Aplastados: ${currentUser.jump.totalStomps} | 🦘 Saltos: ${currentUser.jump.totalJumps} | ⚡ Power-ups: ${currentUser.jump.totalPowerups} | 🎮 Partidas: ${currentUser.stats.gamesPlayed} | ✨ Críticos: ${currentUser.clicker.totalCrits}`, "normal");
    };
    
    document.getElementById('shopBtn').onclick = openShop;
    document.getElementById('rankingBtn').onclick = openRanking;
    document.getElementById('missionsBtn').onclick = () => {
        checkDailyMissions();
        showNotification(`📅 Misiones hoy: Taps: ${currentUser.dailyMissions.taps}/50 | Ratones: ${currentUser.dailyMissions.mice}/20 | Jump: ${currentUser.dailyMissions.jumpScore}/500`, "normal");
    };
    document.getElementById('codeBtn').onclick = openCodeModal;
    
    const savedUserId = localStorage.getItem('billyCurrentUser');
    if(savedUserId && loadUser(savedUserId)) {
        document.getElementById('startScreen').style.display = 'none';
        document.getElementById('mainMenu').style.display = 'flex';
        updateMenuUI();
        updateGlobalRanking();
        checkDailyMissions();
    }
</script>
</body>
</html>
