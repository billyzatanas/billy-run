<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>🐱 BILLY THE CAT - ULTIMATE EDITION</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Segoe UI', 'Comic Neue', system-ui, sans-serif;
            min-height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #0a0a2a 0%, #050510 100%);
            transition: background 0.5s ease;
        }
        body.day-mode {
            background: radial-gradient(circle at center, #87CEEB 0%, #4A90D9 100%);
        }
        /* Animaciones */
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        @keyframes floatPet { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        @keyframes pulseGold { 0%, 100% { box-shadow: 0 0 20px gold; transform: scale(1); } 50% { box-shadow: 0 0 40px #ffaa44; transform: scale(1.02); } }
        @keyframes bounceIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes floatUp { to { transform: translateY(-60px); opacity: 0; } }
        @keyframes fadeOutUp { to { opacity: 0; transform: translate(-50%, -70%); } }
        @keyframes rippleAnim { to { transform: scale(5); opacity: 0; } }
        @keyframes twinkle { from { opacity: 0.3; transform: scale(1); } to { opacity: 1; transform: scale(1.2); } }
        @keyframes shakeAnim { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
        @keyframes confetti { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(100px) rotate(720deg); opacity: 0; } }
        @keyframes spinCoin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle 2s infinite alternate; }
        
        /* Pantalla registro */
        .register-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #0a0a1a, #1a1a2e); z-index: 2000; display: flex; align-items: center; justify-content: center; }
        .register-card { background: rgba(0,0,0,0.85); backdrop-filter: blur(20px); border-radius: 60px; padding: 40px 30px; text-align: center; width: 90%; max-width: 400px; border: 2px solid #ffaa44; animation: slideUp 0.5s ease; }
        .register-card img { width: 120px; height: 120px; object-fit: contain; margin-bottom: 20px; animation: float 3s infinite; }
        .register-card h2 { color: #FFD966; margin-bottom: 20px; }
        .register-input { width: 100%; padding: 15px 20px; border-radius: 50px; border: none; background: rgba(255,255,255,0.1); color: white; font-size: 18px; text-align: center; margin-bottom: 15px; }
        .register-input:focus { outline: none; border: 1px solid #ffaa44; }
        .register-btn { background: linear-gradient(135deg, #14f195, #9945ff); border: none; padding: 15px 40px; border-radius: 50px; font-size: 18px; font-weight: bold; color: white; cursor: pointer; width: 100%; transition: transform 0.1s; }
        .register-btn:active { transform: scale(0.97); }
        .error-msg { color: #ff6b6b; font-size: 12px; margin-top: 10px; }
        
        /* Menú principal */
        .main-menu { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, #0a0a2a 0%, #050510 100%); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow-y: auto; }
        .menu-container { position: relative; z-index: 10; width: 100%; max-width: 500px; padding: 20px; }
        .user-header { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); border-radius: 60px; padding: 12px 20px; margin-bottom: 20px; border: 1px solid rgba(255,200,100,0.3); }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .user-avatar { width: 50px; height: 50px; background: linear-gradient(135deg, #fbbf24, #e67e22); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; }
        .user-details h3 { color: #FFD966; font-size: 16px; }
        .user-details p { color: rgba(255,255,255,0.6); font-size: 11px; }
        .user-stats { display: flex; gap: 15px; }
        .user-stat { text-align: center; }
        .user-stat-value { color: #FFD966; font-weight: bold; font-size: 18px; }
        .user-stat-label { color: rgba(255,255,255,0.5); font-size: 10px; }
        .billy-logo { text-align: center; margin-bottom: 30px; }
        .billy-logo img { width: 140px; height: 140px; object-fit: contain; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5)); animation: float 3s infinite; }
        .billy-logo h1 { font-size: 28px; background: linear-gradient(135deg, #FFD966, #FFA500); -webkit-background-clip: text; background-clip: text; color: transparent; margin-top: 10px; }
        .game-modes { display: flex; gap: 20px; margin: 25px 0; }
        .mode-card { flex: 1; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); border-radius: 40px; padding: 20px; text-align: center; cursor: pointer; transition: all 0.3s; border: 1px solid rgba(255,200,100,0.3); }
        .mode-card:hover { transform: translateY(-5px); border-color: #ffaa44; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .mode-card:active { transform: scale(0.98); }
        .mode-icon { font-size: 48px; margin-bottom: 10px; }
        .mode-card h3 { color: #FFD966; font-size: 20px; }
        .mode-card p { color: rgba(255,255,255,0.6); font-size: 11px; margin-top: 5px; }
        .resources-bar { background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); border-radius: 60px; padding: 15px 20px; display: flex; justify-content: space-between; margin: 20px 0; }
        .resource { display: flex; align-items: center; gap: 12px; }
        .resource-icon { font-size: 32px; }
        .resource-info { text-align: left; }
        .resource-value { font-size: 20px; font-weight: bold; color: #FFD966; }
        .resource-label { font-size: 10px; color: rgba(255,255,255,0.6); }
        .daily-missions { background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); border-radius: 30px; padding: 15px; margin: 15px 0; }
        .daily-missions h4 { color: #FFD966; margin-bottom: 10px; font-size: 14px; }
        .mission-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .mission-name { color: #FFD966; font-size: 12px; }
        .mission-reward { font-size: 10px; color: #aaa; }
        .mission-progress { font-size: 11px; color: #FFD966; }
        .mission-completed { color: #22c55e; font-size: 12px; }
        .menu-buttons { display: flex; gap: 12px; flex-wrap: wrap; }
        .menu-btn { flex: 1; background: rgba(30,41,59,0.9); backdrop-filter: blur(5px); border: none; padding: 12px; border-radius: 50px; color: white; font-weight: bold; cursor: pointer; transition: all 0.1s; text-align: center; font-size: 13px; }
        .menu-btn:active { transform: scale(0.97); }
        .btn-primary { background: linear-gradient(135deg, #fbbf24, #e67e22); color: #1e1a2f; }
        .btn-solana { background: linear-gradient(135deg, #14f195, #9945ff); }
        .btn-x { background: #000000; color: white; }
        .btn-telegram { background: #26A5E4; color: white; }
        .game-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1100; display: none; background: radial-gradient(circle at center, #0a0a2a 0%, #050510 100%); }
        .game-container.active { display: block; }
        .game-header { position: fixed; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; z-index: 50; }
        .back-btn { background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); padding: 10px 20px; border-radius: 40px; color: white; cursor: pointer; font-weight: bold; border: none; }
        .back-btn:active { transform: scale(0.95); }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .modal-content { background: linear-gradient(135deg, #1e293b, #0f172a); border-radius: 40px; padding: 25px; width: 90%; max-width: 450px; max-height: 85vh; overflow-y: auto; border: 2px solid #ffaa44; }
        .modal-content h2 { color: #FFD966; margin-bottom: 20px; text-align: center; }
        .shop-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .shop-tab { flex: 1; padding: 8px; background: rgba(0,0,0,0.5); border-radius: 30px; text-align: center; cursor: pointer; color: white; font-size: 12px; }
        .shop-tab.active { background: linear-gradient(135deg, #fbbf24, #e67e22); color: #1e1a2f; }
        .shop-section { display: none; }
        .shop-section.active { display: block; }
        .shop-item { background: rgba(0,0,0,0.5); border-radius: 20px; padding: 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,200,100,0.3); cursor: pointer; }
        .shop-item:active { transform: scale(0.98); }
        .shop-item.equipped { border: 2px solid #14f195; background: rgba(20,241,149,0.1); }
        .item-info { flex: 1; }
        .item-name { font-weight: bold; color: white; }
        .item-desc { font-size: 10px; color: #FFD966; }
        .item-price { font-size: 11px; color: #aaa; }
        .shop-btn { background: linear-gradient(135deg, #fbbf24, #e67e22); border: none; padding: 6px 15px; border-radius: 30px; font-weight: bold; cursor: pointer; font-size: 11px; }
        .close-modal { margin-top: 20px; background: #334155; padding: 10px 30px; border-radius: 30px; cursor: pointer; width: 100%; border: none; color: white; }
        .profile-stats { margin: 15px 0; }
        .stat-row { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); color: white; }
        .change-nick { display: flex; gap: 10px; margin-top: 15px; }
        .change-nick input { flex: 1; padding: 10px; border-radius: 30px; border: none; background: rgba(255,255,255,0.1); color: white; }
        
        /* Clicker UI */
        .top-panel { position: fixed; top: 70px; left: 10px; right: 10px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; z-index: 30; }
        .stat-card { background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); padding: 6px 12px; border-radius: 40px; font-size: 12px; font-weight: bold; color: #FFE484; border: 1px solid rgba(255,200,100,0.5); }
        .token-bar { position: fixed; top: 130px; left: 10px; right: 10px; background: linear-gradient(135deg, #fbbf24, #f59e0b); border-radius: 60px; padding: 8px 16px; display: flex; justify-content: space-between; z-index: 30; cursor: pointer; font-weight: bold; }
        .token-bar:active { transform: scale(0.98); }
        .combo-panel { position: fixed; top: 180px; right: 10px; background: rgba(0,0,0,0.85); padding: 8px 16px; border-radius: 40px; font-weight: bold; color: #ff884d; z-index: 30; border: 1px solid #ffaa44; }
        .combo-bar-container { position: fixed; top: 220px; left: 10px; right: 10px; background: rgba(0,0,0,0.5); border-radius: 10px; height: 8px; z-index: 30; overflow: hidden; }
        .combo-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #fbbf24, #ff4444); border-radius: 10px; transition: width 0.1s ease; }
        .pet-panel { position: fixed; top: 240px; left: 10px; background: rgba(0,0,0,0.85); padding: 6px 12px; border-radius: 20px; font-size: 11px; color: #FFD966; display: flex; align-items: center; gap: 8px; cursor: pointer; z-index: 30; }
        .records-panel { position: fixed; top: 290px; left: 10px; background: rgba(0,0,0,0.85); padding: 8px 12px; border-radius: 20px; font-size: 10px; color: #FFD966; text-align: center; cursor: pointer; z-index: 30; }
        .energy-container { position: fixed; bottom: 100px; left: 10px; right: 10px; background: rgba(0,0,0,0.7); border-radius: 20px; padding: 8px 12px; z-index: 30; }
        .energy-bg { height: 12px; background: #2d2a3e; border-radius: 20px; overflow: hidden; }
        .energy-fill { height: 100%; background: linear-gradient(90deg, #22c55e, #facc15); border-radius: 20px; transition: width 0.2s; }
        .challenges-panel { position: fixed; bottom: 160px; left: 10px; right: 10px; background: rgba(0,0,0,0.8); border-radius: 20px; padding: 8px; z-index: 30; display: flex; justify-content: space-around; gap: 8px; }
        .challenge-item { font-size: 10px; color: #FFD966; text-align: center; flex: 1; background: rgba(0,0,0,0.5); padding: 4px; border-radius: 12px; }
        .action-buttons { position: fixed; bottom: 15px; left: 10px; right: 10px; display: flex; gap: 8px; flex-wrap: wrap; z-index: 30; }
        .btn { flex: 1; padding: 10px 6px; border: none; border-radius: 50px; font-weight: bold; font-size: 10px; cursor: pointer; background: linear-gradient(145deg, #1e293b, #0f172a); color: white; text-align: center; transition: transform 0.05s; }
        .btn:active { transform: translateY(2px); }
        .btn-primary { background: linear-gradient(145deg, #fbbf24, #e67e22); color: #1e1a2f; }
        
        /* FIX PARA CLICS EN PC - IMPORTANTE */
        .game-entity {
            cursor: pointer !important;
            pointer-events: auto !important;
            z-index: 999 !important;
        }
        #gameArea {
            pointer-events: none !important;
        }
        #billy {
            pointer-events: auto !important;
            z-index: 20 !important;
        }
        .game-entity:active {
            transform: scale(0.95);
        }
        
        #billy { position: fixed; width: 130px; height: 130px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 20; transition: transform 0.05s linear, left 0.1s ease-out, top 0.1s ease-out; }
        #billy img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 8px 15px rgba(0,0,0,0.4)); }
        #billy:active { transform: scale(0.92) !important; }
        .shake { animation: shakeAnim 0.2s ease-in-out 0s 2; }
        .billy-golden img { filter: drop-shadow(0 0 20px gold); animation: pulseGold 0.5s infinite; }
        .pet-follower { position: fixed; z-index: 18; font-size: 32px; pointer-events: none; animation: floatPet 2s infinite; }
        #gameArea { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 15; }
        .game-entity { position: fixed; display: flex; align-items: center; justify-content: center; font-weight: bold; animation: bounceIn 0.3s ease; }
        .mouse-normal { background: radial-gradient(circle, #8B5A2B, #5D3A1A); border-radius: 50%; border: 2px solid #b97f44; }
        .mouse-golden { background: radial-gradient(circle, #FBBF24, #E67E22); border-radius: 50%; border: 3px solid gold; animation: pulseGold 0.8s infinite; }
        .mouse-boss { background: radial-gradient(circle, #4a2a1a, #2a1a0a); border-radius: 50%; border: 3px solid #c97e3a; font-size: 32px !important; }
        .bubble { background: radial-gradient(circle, #FFE484, #F59E0B); border-radius: 50%; box-shadow: 0 0 15px gold; animation: float 2s infinite; }
        .notification { position: fixed; top: 45%; left: 50%; transform: translate(-50%, -50%); background: linear-gradient(135deg, #facc15, #f59e0b); color: #0c0a1a; padding: 12px 24px; border-radius: 50px; font-weight: bold; z-index: 200; animation: fadeOutUp 1s forwards; white-space: nowrap; }
        .notification.crit { background: linear-gradient(135deg, #ff6b6b, #ff4444); color: white; }
        .notification.achievement { background: linear-gradient(135deg, #14f195, #9945ff); color: white; }
        .notification.pet { background: linear-gradient(135deg, #ec489a, #db2777); color: white; }
        .floating-number { position: fixed; font-weight: bold; font-size: 24px; text-shadow: 0 0 5px black; pointer-events: none; z-index: 150; animation: floatUp 0.8s forwards; color: white; }
        .ripple { position: fixed; border-radius: 50%; background: radial-gradient(circle, rgba(251,191,36,0.6), transparent); pointer-events: none; animation: rippleAnim 0.5s ease-out forwards; z-index: 90; }
        .confetti-piece { position: fixed; width: 10px; height: 10px; background: #ffaa44; pointer-events: none; z-index: 300; animation: confetti 1s ease-out forwards; }
        .sound-toggle { position: fixed; bottom: 20px; right: 20px; background: rgba(0,0,0,0.7); border-radius: 50%; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 1000; font-size: 24px; border: 1px solid #ffaa44; }
        
        /* Jump game mejorado */
        .jump-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(180deg, #87CEEB 0%, #4A90D9 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .jump-canvas { background: linear-gradient(180deg, #87CEEB, #4A90D9); border-radius: 30px; border: 3px solid #FFD966; cursor: pointer; }
        .jump-stats { position: absolute; top: 20px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 20px; }
        .jump-score-card { background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 40px; color: #FFD966; font-weight: bold; }
        .jump-powerups { position: absolute; bottom: 100px; left: 0; right: 0; display: flex; justify-content: center; gap: 15px; }
        .powerup-btn { background: rgba(0,0,0,0.8); padding: 8px 15px; border-radius: 30px; color: white; font-size: 12px; cursor: pointer; border: 1px solid #ffaa44; transition: transform 0.05s; }
        .powerup-btn:active { transform: scale(0.95); }
        .jump-instruction { position: absolute; bottom: 30px; text-align: center; color: rgba(0,0,0,0.7); font-size: 12px; background: rgba(255,255,255,0.5); padding: 5px 15px; border-radius: 20px; }
        
        @media (max-width: 600px) {
            .mode-card { padding: 15px; }
            .mode-icon { font-size: 36px; }
            .mode-card h3 { font-size: 16px; }
            .resource-icon { font-size: 24px; }
            .resource-value { font-size: 16px; }
            .btn { font-size: 9px; padding: 8px 4px; }
            #billy { width: 100px; height: 100px; }
            .stat-card { font-size: 10px; padding: 4px 8px; }
            .combo-panel { font-size: 14px; top: 170px; }
            .combo-bar-container { top: 210px; }
            .pet-panel { top: 230px; }
            .records-panel { top: 280px; }
        }
        @media (min-width: 601px) { #billy { width: 150px; height: 150px; } }
    </style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="sound-toggle" id="soundToggle">🔊</div>

<!-- Pantalla de registro -->
<div class="register-screen" id="registerScreen">
    <div class="register-card">
        <img src="billy.gif" alt="Billy" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%23FFD966%22/%3E%3Ctext x=%2250%22 y=%2270%22 text-anchor=%22middle%22 fill=%22%23FFA500%22 font-size=%2240%22%3E🐱%3C/text%3E%3C/svg%3E'">
        <h2 id="registerTitle">🐱 BILLY ID</h2>
        <p id="registerSubtitle" style="color:rgba(255,255,255,0.7); margin-bottom:20px;">¡Crea tu identidad en el mundo de Billy!</p>
        <input type="text" class="register-input" id="nicknameInput" placeholder="Tu nickname (mínimo 3 caracteres)" maxlength="15">
        <button class="register-btn" id="registerBtn">🎮 COMENZAR AVENTURA</button>
        <div id="registerError" class="error-msg"></div>
    </div>
</div>

<!-- Menú principal -->
<div class="main-menu" id="mainMenu" style="display: none;">
    <div class="menu-container">
        <div class="user-header">
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">🐱</div>
                <div class="user-details">
                    <h3 id="userNickname">BillyMaster</h3>
                    <p>🐱 BILLY ID</p>
                </div>
            </div>
            <div class="user-stats">
                <div class="user-stat"><div class="user-stat-value" id="userLevel">1</div><div class="user-stat-label" id="userLevelLabel">Nivel</div></div>
                <div class="user-stat"><div class="user-stat-value" id="userStreak">0</div><div class="user-stat-label" id="userStreakLabel">Racha</div></div>
            </div>
        </div>
        <div class="billy-logo">
            <img src="billy.gif" alt="Billy" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%23FFD966%22/%3E%3Ctext x=%2250%22 y=%2270%22 text-anchor=%22middle%22 fill=%22%23FFA500%22 font-size=%2240%22%3E🐱%3C/text%3E%3C/svg%3E'">
            <h1>BILLY THE CAT</h1>
        </div>
        <div class="game-modes">
            <div class="mode-card" id="selectClickerBtn"><div class="mode-icon">🐱</div><h3 id="clickerModeTitle">BILLY CLICKER</h3><p id="clickerModeDesc">Toca a Billy, atrapa ratones, mejora habilidades</p></div>
            <div class="mode-card" id="selectJumpBtn"><div class="mode-icon">🦘</div><h3 id="jumpModeTitle">BILLY JUMP</h3><p id="jumpModeDesc">Salta obstáculos, consigue récords, usa power-ups</p></div>
        </div>
        <div class="resources-bar">
            <div class="resource"><div class="resource-icon">💰</div><div class="resource-info"><div class="resource-value" id="menuCoins">0</div><div class="resource-label" id="coinsLabel">Monedas</div></div></div>
            <div class="resource"><div class="resource-icon">⭐</div><div class="resource-info"><div class="resource-value" id="menuTokens">0</div><div class="resource-label" id="tokensLabel">BILLY Tokens</div></div></div>
        </div>
        <div class="daily-missions" id="dailyMissionsPanel"><h4 id="missionsTitle">📅 Misiones Diarias</h4><div id="missionsList"></div></div>
        <div class="menu-buttons" id="menuButtonsContainer"></div>
    </div>
</div>

<!-- Contenedor juego Clicker -->
<div class="game-container" id="clickerContainer">

    // ==================== SISTEMA DE SONIDOS ====================
    let audioCtx = null;
    
    function initAudio() { if(!audioCtx && soundEnabled) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } }
    
    function playSound(freq, duration = 0.15, type = 'sine') {
        if(!soundEnabled) return;
        try {
            initAudio();
            if(!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            osc.type = type;
            gain.gain.value = 0.15;
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, now + duration);
            osc.stop(now + duration);
        } catch(e) {}
    }
    
    function playSoundMelody(frequencies, durations) {
        if(!soundEnabled) return;
        try {
            initAudio();
            if(!audioCtx) return;
            let time = audioCtx.currentTime;
            for(let i = 0; i < frequencies.length; i++) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = frequencies[i];
                osc.type = 'sine';
                gain.gain.value = 0.15;
                osc.start(time);
                gain.gain.exponentialRampToValueAtTime(0.00001, time + durations[i]);
                osc.stop(time + durations[i]);
                time += durations[i];
            }
        } catch(e) {}
    }
    
    function playTapSound(isCrit) { playSound(isCrit ? 880 : 660, 0.1, 'sine'); }
    function playMouseSound(isGolden, isBoss) { if(isBoss) playSound(110, 0.3, 'sawtooth'); else if(isGolden) playSoundMelody([880, 1318], [0.1, 0.1]); else playSound(440, 0.15, 'triangle'); }
    function playChestSound() { playSoundMelody([523, 659], [0.12, 0.12]); }

    function playEventSound() { playSoundMelody([880, 1046], [0.15, 0.2]); }
    function playComboSound() { playSoundMelody([659, 880], [0.1, 0.15]); }

    function getWeekNumber() { const d = new Date(); const date = new Date(d.getFullYear(), 0, 1); return Math.ceil(((d - date) / 86400000 + date.getDay() + 1) / 7); }
    
    function saveUser() { 
        if(currentUser) { 
            localStorage.setItem('billyUser_' + currentUser.userId, JSON.stringify(currentUser)); 
            localStorage.setItem('billyCurrentUser', currentUser.userId);
            updateGlobalRanking();
        } 
    }
    
    function loadUser(userId) { 
        const saved = localStorage.getItem('billyUser_' + userId); 
        if(saved) { 
            currentUser = JSON.parse(saved); 
            return true; 
        } 
        return false; 
    }
    
    function getAllNicknames() { 
        const nicknames = []; 
        for(let i = 0; i < localStorage.length; i++) { 
            const key = localStorage.key(i); 
            if(key && key.startsWith('billyUser_')) { 
                try { 
                    const user = JSON.parse(localStorage.getItem(key)); 
                    nicknames.push(user.nickname); 
                } catch(e) {} 
            } 
        } 
        return nicknames; 
    }
    
    function registerUser(nickname) { 
        if(nickname.length < 3) { 
            document.getElementById('registerError').textContent = t.needMoreChars; 
            return false; 
        } 
        if(getAllNicknames().includes(nickname)) { 
            document.getElementById('registerError').textContent = t.nicknameExists; 
            return false; 
        } 
        currentUser = createDefaultUser(nickname); 
        saveUser(); 
        document.getElementById('registerError').textContent = ''; 
        return true; 
    }
    
    // ==================== RANKING GLOBAL ====================
    function updateGlobalRanking() {
        if(!currentUser) return;
        const score = currentUser.clicker.totalMice + Math.floor(currentUser.clicker.totalTaps / 10) + (currentUser.clicker.level * 100);
        const existing = globalRanking.find(r => r.userId === currentUser.userId);
        if(existing) { existing.score = score; existing.nickname = currentUser.nickname; existing.level = currentUser.clicker.level; existing.mice = currentUser.clicker.totalMice; }
        else { globalRanking.push({ userId: currentUser.userId, nickname: currentUser.nickname, score: score, level: currentUser.clicker.level, mice: currentUser.clicker.totalMice, taps: currentUser.clicker.totalTaps }); }
        globalRanking.sort((a,b) => b.score - a.score);
        globalRanking = globalRanking.slice(0, 50);
        localStorage.setItem('billyGlobalRanking', JSON.stringify(globalRanking));
        sendScoreToTelegram(score);
    }
    
    function loadGlobalRanking() { const saved = localStorage.getItem('billyGlobalRanking'); if(saved) globalRanking = JSON.parse(saved); }
    
    async function sendScoreToTelegram(score) {
        try {
            const text = `🏆 ACTUALIZACIÓN DE RANKING 🏆\n\n👤 ${currentUser.nickname}\n📊 Puntuación: ${score}\n🐭 Ratones: ${currentUser.clicker.totalMice}\n⭐ Nivel: ${currentUser.clicker.level}\n👆 Taps: ${currentUser.clicker.totalTaps}`;
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
            await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: TELEGRAM_USER_CHAT_ID, text: text }) });
        } catch(e) { console.log("Telegram send error:", e); }
    }

        if(!TELEGRAM_GROUP_CHAT_ID) {
            showNotification("⚠️ Grupo no configurado. Contacta al administrador.", "normal");
            return;
        }
        const message = `🎮 ¡${currentUser.nickname} acaba de lograr!\n\n👆 Taps: ${currentUser.clicker.totalTaps}\n🐭 Ratones: ${currentUser.clicker.totalMice}\n⭐ Nivel: ${currentUser.clicker.level}\n🔥 Mejor combo: ${currentUser.clicker.bestCombo}\n\n🔗 Juega tú también: ¡Billy te espera! #BillyTheCat`;
        try {
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
            await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: TELEGRAM_GROUP_CHAT_ID, text: message })
            });
            showNotification("📢 ¡Publicado en el grupo de Billy!", "achievement");
        } catch(e) { showNotification("❌ Error al publicar", "normal"); }
    }

    function redeemCode(code) {
        const upperCode = code.toUpperCase();
        if(!SECRET_CODES[upperCode]) { showNotification(t.invalidCode, "normal"); return false; }
        if(currentUser.usedCodes.includes(upperCode)) { showNotification(t.alreadyUsed, "normal"); return false; }
        const reward = SECRET_CODES[upperCode];
        currentUser.resources.coins += reward.coins;
        currentUser.resources.tokens += reward.tokens;
        currentUser.usedCodes.push(upperCode);
        saveUser();
        showNotification(t.codeRedeemed.replace('{coins}', reward.coins).replace('{tokens}', reward.tokens), "achievement");
        updateMenuResources();
        return true;
    }

        const modal = document.createElement('div');
        modal.className = 'modal';

                <button class="shop-btn" id="redeemCodeBtn" style="width:100%;padding:12px;">${t.redeem}</button>
                <button class="close-modal" onclick="this.closest('.modal').remove()" style="margin-top:15px;">${t.close}</button>
            </div>
        `;
        document.body.appendChild(modal);
        document.getElementById('redeemCodeBtn').onclick = () => {
            const code = document.getElementById('codeInput').value.trim();
            redeemCode(code);
            modal.remove();
        };
    }

        const today = new Date().toDateString();

            currentUser.dailyMissions = { date: today, missions: [
                { id: 'tap', type: 'tap', target: 50, progress: 0, reward: 100, completed: false },
                { id: 'mice', type: 'mice', target: 20, progress: 0, reward: 150, completed: false },
                { id: 'combo', type: 'combo', target: 15, progress: 0, reward: 200, completed: false }
            ], completed: [] };
            saveUser();
        }
        updateDailyMissionsUI();
    }
    
    function generateWeeklyMissions() {
        const week = getWeekNumber();
        if(!currentUser.weeklyMissions || currentUser.weeklyMissions.week !== week) {
            currentUser.weeklyMissions = { week: week, missions: [
                { id: 'week_tap', type: 'tap', target: 500, progress: 0, reward: 500, completed: false },
                { id: 'week_mice', type: 'mice', target: 150, progress: 0, reward: 750, completed: false },
                { id: 'week_crits', type: 'crits', target: 50, progress: 0, reward: 600, completed: false }
            ], completed: [] };
            saveUser();
        }
    }
    
    function updateDailyMissionsUI() {
        const container = document.getElementById('missionsList');
        if(!container || !currentUser?.dailyMissions?.missions) return;
        container.innerHTML = currentUser.dailyMissions.missions.map(mission => `
            <div class="mission-item"><div><div class="mission-name">${mission.type === 'tap' ? '👆' : mission.type === 'mice' ? '🐭' : '🔥'} ${mission.type === 'tap' ? t.missionTap.replace('{count}', mission.target) : mission.type === 'mice' ? t.missionMice.replace('{count}', mission.target) : t.missionCombo.replace('{count}', mission.target)}</div><div class="mission-reward">${t.reward}: ${mission.reward} 🪙</div></div><div>${mission.completed ? `<span class="mission-completed">${t.completed}</span>` : `<span class="mission-progress">${mission.progress}/${mission.target}</span>`}</div></div>
        `).join('');
    }
    
    function updateMissionProgress(type, amount = 1) {
        if(!currentUser) return;
        const today = new Date().toDateString();
        if(currentUser.dailyMissions.date !== today) generateDailyMissions();
        currentUser.dailyMissions.missions.forEach(mission => {
            if(mission.type === type && !mission.completed) {
                mission.progress += amount;
                if(mission.progress >= mission.target) { mission.completed = true; currentUser.resources.coins += mission.reward; showNotification(`🎉 Misión completada! +${mission.reward} ${t.coins}`, "achievement"); playChestSound(); }
            }
        });
        updateDailyMissionsUI();
        updateMenuResources();
        saveUser();
    }

    function tapBillyClicker(event) { 
        if(!clickerGameActive) return; 
        if(clickerEnergy <= 0) { showNotification(t.noEnergy); return; } 
        const now = Date.now(); 
        if(window.lastTapTime && now - window.lastTapTime < 800) { window.quickTapStreak = (window.quickTapStreak || 0) + 1; if(window.quickTapStreak > 10) window.quickTapStreak = 10; } else { window.quickTapStreak = 1; } 
        window.lastTapTime = now; 
        const streakBonus = 1 + ((window.quickTapStreak || 1) * 0.05); 
        if(window.quickTapStreak >= 5 && window.quickTapStreak % 5 === 0) { currentUser.resources.tokens += window.quickTapStreak * 5; showNotification(t.quickStreak.replace('{amount}', window.quickTapStreak * 5), "achievement"); } 
        clickerCombo++; 
        if(clickerCombo > clickerBestCombo) { clickerBestCombo = clickerCombo; if(clickerCombo > clickerChallenges.maxCombo) clickerChallenges.maxCombo = clickerCombo; } 
        clickerTotalTaps++; 
        const skills = getSkillBonus(); 
        const activePet = getActivePet(); 
        let critChance = 10 + skills.luck * 2 + Math.floor(clickerCombo / 3); 
        if(activePet === 'owl') critChance += 10; 
        if(noCritCounter >= 8) { critChance = 100; noCritCounter = 0; showNotification("💥 ¡CRÍTICO GARANTIZADO!", "crit"); } 
        const isCrit = Math.random() * 100 < critChance; 
        if(isCrit) { noCritCounter = 0; clickerTotalCrits++; clickerChallenges.crits++; } else { noCritCounter++; } 
        let gain = clickerTapPower * (isCrit ? 3 : 1) * (1 + clickerCombo * 0.02) * streakBonus; 
        gain *= (1 + skills.strength * 0.05); 
        gain *= (1 + skills.economy * 0.1); 
        if(activePet === 'dragon') gain *= 1.1; 
        if(clickerSuperCombo) gain *= 1.5; 
        if(clickerDoubleEvent) gain *= 2; 
        gain = Math.floor(Math.max(1, gain)); 
        clickerCoins += gain; 
        clickerTokens += Math.floor(gain / 10); 
        let energyCost = Math.max(1, Math.floor(clickerCombo / 10)); 
        clickerEnergy = Math.max(0, clickerEnergy - energyCost); 
        updateClickerUI(); 
        updateMissionProgress('tap'); 
        if(clickerComboTimer) clearTimeout(clickerComboTimer); 
        clickerComboTimer = setTimeout(() => { if(clickerCombo >= 3) showNotification(t.comboLost.replace('{combo}', clickerCombo)); clickerCombo = 0; clickerSuperCombo = false; updateClickerUI(); }, 2000); 
        if(clickerCombo >= 12 && !clickerSuperCombo) { clickerSuperCombo = true; showNotification(t.superCombo); playComboSound(); setTimeout(() => { clickerSuperCombo = false; showNotification(t.superComboEnd); }, 5000); }

        setTimeout(() => billyDiv.style.transform = 'scale(1)', 100); 
        const clickX = event.clientX || (event.touches ? event.touches[0].clientX : clickerBillyX); 
        const clickY = event.clientY || (event.touches ? event.touches[0].clientY : clickerBillyY); 
        createRipple(clickX, clickY); 
        createParticles(clickX, clickY, isCrit ? '#FFD966' : '#A5F0A0'); 
        createFloatingNumber(gain, clickX, clickY, isCrit); 
        playTapSound(isCrit); 
        let neededCoins = 100 * Math.pow(1.28, clickerLevel - 1); 
        if(clickerCoins >= neededCoins) { clickerLevel++; clickerMaxEnergy = 100 + Math.floor(clickerLevel / 2) * 5 + (skills.energy * 20); clickerEnergy = Math.min(clickerMaxEnergy, clickerEnergy + 40); showNotification(t.levelUp.replace('{level}', clickerLevel), "achievement"); playLevelUpSound(); createConfetti(); updateClickerUI(); checkAchievements(); } 
        checkAchievements(); 
        updateChallenges(); 
        saveClickerData(); 
        updateMenuResources(); 
    }

        ctx.fillStyle = '#FFA500'; ctx.beginPath(); ctx.ellipse(x + w/2, y + h/2 - 8, 4, 2, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff'; for(let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(x + w/2 - 15 + i*5, y + h/2 - 5); ctx.lineTo(x + w/2 - 20 + i*5, y + h/2 - 8); ctx.lineTo(x + w/2 - 10 + i*5, y + h/2 - 8); ctx.fill(); ctx.beginPath(); ctx.moveTo(x + w/2 + 5 + i*5, y + h/2 - 5); ctx.lineTo(x + w/2 + i*5, y + h/2 - 8); ctx.lineTo(x + w/2 + 10 + i*5, y + h/2 - 8); ctx.fill(); }
        if(isJumping) { ctx.fillStyle = '#FFD966'; ctx.beginPath(); ctx.ellipse(x + w/2 - 12, y + h - 8, 4, 2, -0.5, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(x + w/2 + 12, y + h - 8, 4, 2, 0.5, 0, Math.PI*2); ctx.fill(); }
        ctx.restore();
    }
    
    function startJumpGame() { 
        if(jumpGameActive) return; 
        jumpGameActive = true; 
        jumpState.width = Math.min(window.innerWidth - 40, 400); 
        jumpState.height = 500; 
        jumpState.player.y = jumpState.height - 70; 
        jumpState.score = 0; 
        jumpState.bestScore = currentUser?.jump.bestScore || 0; 
        jumpState.gameOver = false; 
        jumpState.obstacles = []; 
        jumpState.coins = []; 
        jumpState.powerups = []; 
        jumpState.spawnCounter = 0; 
        jumpState.activePowerups = { shield: false, magnet: false, double: false }; 
        jumpState.speed = 4; 
        jumpState.clouds = []; 
        for(let i = 0; i < 3; i++) jumpState.clouds.push({ x: Math.random() * jumpState.width, y: 30 + Math.random() * 100, size: 40 + Math.random() * 30 }); 
        const container = document.getElementById('jumpContainer'); 
        container.innerHTML = `<div class="game-header"><button class="back-btn" id="jumpBackBtnGame">← ${t.back}</button></div><div class="jump-container"><div class="jump-stats"><div class="jump-score-card">🏆 ${t.jumpBestLabel} ${jumpState.bestScore}</div><div class="jump-score-card">⭐ ${t.jumpScoreLabel} <span id="jumpScore">0</span></div></div><canvas id="jumpCanvas" class="jump-canvas" width="${jumpState.width}" height="${jumpState.height}"></canvas><div class="jump-powerups"><div class="powerup-btn" id="useShield">🛡️ ${t.jumpShield} (${currentUser?.inventory.powerups.shield || 0})</div><div class="powerup-btn" id="useMagnet">🧲 ${t.jumpMagnet} (${currentUser?.inventory.powerups.magnet || 0})</div><div class="powerup-btn" id="useDouble">✨ ${t.jumpDouble} (${currentUser?.inventory.powerups.double || 0})</div></div><div class="jump-instruction">${t.jumpInstruction}</div></div>`; 
        jumpState.canvas = document.getElementById('jumpCanvas'); 
        jumpState.ctx = jumpState.canvas.getContext('2d'); 
        document.getElementById('jumpBackBtnGame').onclick = () => { cancelAnimationFrame(jumpState.animationId); jumpGameActive = false; document.getElementById('jumpContainer').classList.remove('active'); document.getElementById('mainMenu').style.display = 'flex'; updateMenuResources(); }; 
        document.getElementById('useShield').onclick = () => useJumpPowerup('shield'); 
        document.getElementById('useMagnet').onclick = () => useJumpPowerup('magnet'); 
        document.getElementById('useDouble').onclick = () => useJumpPowerup('double'); 
        jumpState.canvas.onclick = () => jumpActionJump(); 
        jumpState.canvas.ontouchstart = (e) => { e.preventDefault(); jumpActionJump(); }; 
        jumpState.animationId = requestAnimationFrame(updateJumpGame); 
        if(window.updateJumpUITexts) window.updateJumpUITexts(); 
    }
    
    function useJumpPowerup(type) { if(currentUser?.inventory.powerups[type] > 0 && !jumpState.activePowerups[type] && !jumpState.gameOver) { currentUser.inventory.powerups[type]--; jumpState.activePowerups[type] = true; saveUser(); showNotification(t.powerupActivated.replace('{type}', type), "achievement"); updateJumpUITexts(); setTimeout(() => { jumpState.activePowerups[type] = false; }, 10000); } else if(!jumpState.gameOver) { showNotification(t.powerupNoStock.replace('{type}', type)); } }
    
    function jumpActionJump() { if(!jumpState.gameOver && jumpState.player.grounded) { jumpState.player.vy = jumpState.player.jumpPower; jumpState.player.grounded = false; playJumpSound(); } else if(jumpState.gameOver) restartJump(); }
    
    function restartJump() { jumpState.player.y = jumpState.height - 70; jumpState.player.vy = 0; jumpState.player.grounded = true; jumpState.obstacles = []; jumpState.coins = []; jumpState.powerups = []; jumpState.score = 0; jumpState.gameOver = false; jumpState.spawnCounter = 0; jumpState.speed = 4; document.getElementById('jumpScore').textContent = 0; jumpState.activePowerups = { shield: false, magnet: false, double: false }; updateJumpUITexts(); }
    
    function updateJumpGame() { 
        if(!jumpState.canvas) return; 
        const ctx = jumpState.ctx, w = jumpState.width, h = jumpState.height; 
        ctx.clearRect(0, 0, w, h); 
        const grad = ctx.createLinearGradient(0,0,0,h); grad.addColorStop(0, '#87CEEB'); grad.addColorStop(1, '#4A90D9'); ctx.fillStyle = grad; ctx.fillRect(0,0,w,h); 
        for(const cloud of jumpState.clouds) { ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.beginPath(); ctx.ellipse(cloud.x, cloud.y, cloud.size/2, cloud.size/3, 0, 0, Math.PI*2); ctx.fill(); cloud.x -= 0.5; if(cloud.x + cloud.size < 0) cloud.x = w + cloud.size; } 
        ctx.fillStyle = '#5D8A3C'; ctx.fillRect(0, h-45, w, 45); ctx.fillStyle = '#7CB342'; ctx.fillRect(0, h-48, w, 3); 
        for(let i = 0; i < 20; i++) { ctx.fillStyle = `rgba(0,0,0,${0.1 + Math.sin(Date.now()/500 + i)*0.05})`; ctx.fillRect(i*30, h-47, 5, 2); } 
        if(!jumpState.gameOver) { 
            jumpState.player.vy += jumpState.player.gravity; jumpState.player.y += jumpState.player.vy; 
            if(jumpState.player.y >= h-45-jumpState.player.height) { jumpState.player.y = h-45-jumpState.player.height; jumpState.player.vy = 0; jumpState.player.grounded = true; } 
            if(jumpState.player.y < 0) { jumpState.player.y = 0; if(jumpState.player.vy<0) jumpState.player.vy=0; } 
            jumpState.spawnCounter++; 
            let spawnRate = Math.max(35, 60 - Math.floor(jumpState.score/40)); 
            if(jumpState.spawnCounter > spawnRate) { 
                jumpState.spawnCounter = 0; 
                const type = Math.random(); 
                if(type < 0.6) jumpState.obstacles.push({ x: w, y: h-45-40, width: 28, height: 40, type: 'rock' }); 
                else if(type < 0.85) jumpState.obstacles.push({ x: w, y: h-45-35, width: 25, height: 35, type: 'mouse', color: '#8B5A2B' }); 
                else jumpState.obstacles.push({ x: w, y: h-45-50, width: 20, height: 50, type: 'box' }); 
                if(Math.random() < 0.3) jumpState.coins.push({ x: w + 20, y: h-45-50 + Math.random() * 40, width: 12, height: 12, collected: false }); 
                if(Math.random() < 0.15) jumpState.powerups.push({ x: w + 20, y: h-45-60, width: 20, height: 20, type: ['shield','magnet','double'][Math.floor(Math.random()*3)] }); 
            } 
            jumpState.speed = 4 + Math.floor(jumpState.score / 100); 
            for(let i=0; i<jumpState.obstacles.length; i++) { 
                const obs = jumpState.obstacles[i]; obs.x -= jumpState.speed; 
                if(obs.x + obs.width < 0) { jumpState.obstacles.splice(i,1); let addScore = jumpState.activePowerups.double ? 2 : 1; jumpState.score += addScore; document.getElementById('jumpScore').textContent = jumpState.score; i--; } 
                if(obs.x < jumpState.player.x + jumpState.player.width && obs.x + obs.width > jumpState.player.x && obs.y < jumpState.player.y + jumpState.player.height && obs.y + obs.height > jumpState.player.y) { 
                    if(jumpState.activePowerups.shield) { jumpState.activePowerups.shield = false; jumpState.obstacles.splice(i,1); showNotification("🛡️ Escudo usado!"); } 
                    else { 
                        jumpState.gameOver = true; 
                        if(jumpState.score > jumpState.bestScore) { jumpState.bestScore = jumpState.score; if(currentUser) currentUser.jump.bestScore = jumpState.score; saveUser(); } 
                        const reward = Math.floor(jumpState.score * 5); clickerCoins += reward; updateClickerUI(); saveClickerData(); updateMenuResources(); showNotification(`🎉 +${reward} ${t.coins}!`, "achievement"); playGameOverSound(); 
                    } 
                } 
            } 
            for(let i=0; i<jumpState.coins.length; i++) { 
                const coin = jumpState.coins[i]; coin.x -= jumpState.speed; ctx.fillStyle = '#FFD700'; ctx.beginPath(); ctx.ellipse(coin.x + coin.width/2, coin.y + coin.height/2, coin.width/2, coin.height/2, 0, 0, Math.PI*2); ctx.fill(); ctx.fillStyle = '#FFA500'; ctx.beginPath(); ctx.ellipse(coin.x + coin.width/2, coin.y + coin.height/2, coin.width/3, coin.height/3, 0, 0, Math.PI*2); ctx.fill(); 
                if(!coin.collected && coin.x < jumpState.player.x + jumpState.player.width && coin.x + coin.width > jumpState.player.x && coin.y < jumpState.player.y + jumpState.player.height && coin.y + coin.height > jumpState.player.y) { coin.collected = true; const coinValue = 5; clickerCoins += coinValue; updateClickerUI(); saveClickerData(); showNotification(`🪙 +${coinValue} monedas!`, "normal"); playChestSound(); } 
                if(coin.x + coin.width < 0 || coin.collected) { jumpState.coins.splice(i,1); i--; } 
            } 
            for(let i=0; i<jumpState.powerups.length; i++) { 
                const p = jumpState.powerups[i]; p.x -= jumpState.speed; ctx.fillStyle = p.type === 'shield' ? '#4CAF50' : (p.type === 'magnet' ? '#9C27B0' : '#FF9800'); ctx.fillRect(p.x, p.y, p.width, p.height); ctx.fillStyle = 'white'; ctx.font = `${p.width-4}px "Segoe UI"`; ctx.fillText(p.type === 'shield' ? '🛡️' : (p.type === 'magnet' ? '🧲' : '✨'), p.x+2, p.y+p.height-5); 
                if(p.x < jumpState.player.x + jumpState.player.width && p.x + p.width > jumpState.player.x && p.y < jumpState.player.y + jumpState.player.height && p.y + p.height > jumpState.player.y) { 
                    if(!jumpState.activePowerups[p.type]) { jumpState.activePowerups[p.type] = true; showNotification(t.powerupActivated.replace('{type}', p.type), "achievement"); setTimeout(() => { if(jumpState.activePowerups[p.type]) jumpState.activePowerups[p.type] = false; }, 10000); } 
                    jumpState.powerups.splice(i,1); i--; 
                } else if(p.x + p.width < 0) { jumpState.powerups.splice(i,1); i--; } 
            } 
        } 
        for(const obs of jumpState.obstacles) { 
            if(obs.type === 'rock') { ctx.fillStyle = '#6B4E2E'; ctx.fillRect(obs.x, obs.y, obs.width, obs.height); ctx.fillStyle = '#4A2A1A'; ctx.fillRect(obs.x+8, obs.y+10, 6, 12); ctx.fillRect(obs.x+16, obs.y+6, 6, 16); } 
            else if(obs.type === 'mouse') { ctx.fillStyle = obs.color; ctx.beginPath(); ctx.ellipse(obs.x + obs.width/2, obs.y + obs.height/2, obs.width/2, obs.height/2, 0, 0, Math.PI*2); ctx.fill(); ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(obs.x + obs.width-8, obs.y + obs.height/2-3, 2, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(obs.x + 8, obs.y + obs.height/2-3, 2, 0, Math.PI*2); ctx.fill(); } 
            else { ctx.fillStyle = '#8B4513'; ctx.fillRect(obs.x, obs.y, obs.width, obs.height); ctx.fillStyle = '#A0522D'; ctx.fillRect(obs.x+4, obs.y-3, obs.width-8, 5); } 
        } 
        drawBillyCat(ctx, jumpState.player.x, jumpState.player.y, jumpState.player.width, jumpState.player.height, !jumpState.player.grounded); 
        if(jumpState.gameOver) { ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0,0,w,h); ctx.fillStyle = 'white'; ctx.font = 'bold 24px "Segoe UI"'; ctx.textAlign = 'center'; ctx.fillText(t.jumpGameOver, w/2, h/2-30); ctx.font = '16px "Segoe UI"'; ctx.fillText(t.jumpTapRestart, w/2, h/2+30); ctx.fillStyle = '#FFD966'; ctx.fillText(t.jumpPoints.replace('{score}', jumpState.score), w/2, h/2+80); } 
        jumpState.animationId = requestAnimationFrame(updateJumpGame); 
    }
    
    function updateJumpUITexts() { const jumpScoreLabel = document.querySelector('.jump-stats .jump-score-card:last-child'); if(jumpScoreLabel) jumpScoreLabel.innerHTML = `⭐ ${t.jumpScoreLabel} <span id="jumpScore">${jumpState.score}</span>`; const jumpBestLabel = document.querySelector('.jump-stats .jump-score-card:first-child'); if(jumpBestLabel) jumpBestLabel.innerHTML = `🏆 ${t.jumpBestLabel} ${jumpState.bestScore}`; const powerupBtns = document.querySelectorAll('.powerup-btn'); if(powerupBtns.length >= 3 && currentUser) { powerupBtns[0].innerHTML = `🛡️ ${t.jumpShield} (${currentUser.inventory.powerups.shield || 0})`; powerupBtns[1].innerHTML = `🧲 ${t.jumpMagnet} (${currentUser.inventory.powerups.magnet || 0})`; powerupBtns[2].innerHTML = `✨ ${t.jumpDouble} (${currentUser.inventory.powerups.double || 0})`; } const instruction = document.querySelector('.jump-instruction'); if(instruction) instruction.textContent = t.jumpInstruction; }
    
    window.startJumpGame = startJumpGame;
    window.updateJumpUITexts = updateJumpUITexts;
    
    // ==================== INICIALIZACIÓN ====================
    function generateStars() { const starsDiv = document.getElementById('stars'); for(let i = 0; i < 150; i++) { const star = document.createElement('div'); star.className = 'star'; star.style.left = Math.random() * 100 + '%'; star.style.top = Math.random() * 100 + '%'; star.style.width = star.style.height = (1 + Math.random() * 2) + 'px'; star.style.animationDelay = Math.random() * 2 + 's'; starsDiv.appendChild(star); } }
    generateStars(); loadGlobalRanking(); updateDayNightMode(); setInterval(updateDayNightMode, 60000);
    
    document.getElementById('registerBtn').onclick = () => { const nickname = document.getElementById('nicknameInput').value.trim(); if(registerUser(nickname)) { showNotification(t.registered.replace('{name}', nickname), "achievement"); document.getElementById('registerScreen').style.display = 'none'; document.getElementById('mainMenu').style.display = 'flex'; updateMenuResources(); generateDailyMissions(); generateWeeklyMissions(); checkDailyStreak(); updateBillyMood(0, 100); updateLanguage(); playClickSound(); } };
    document.getElementById('selectClickerBtn').onclick = () => { document.getElementById('mainMenu').style.display = 'none'; document.getElementById('clickerContainer').classList.add('active'); if(typeof startClickerGame === 'function') startClickerGame(); playClickSound(); };
    document.getElementById('selectJumpBtn').onclick = () => { document.getElementById('mainMenu').style.display = 'none'; document.getElementById('jumpContainer').classList.add('active'); if(typeof startJumpGame === 'function') startJumpGame(); playClickSound(); };
    document.getElementById('clickerBackBtn').onclick = () => { document.getElementById('clickerContainer').classList.remove('active'); document.getElementById('mainMenu').style.display = 'flex'; if(typeof saveClickerGame === 'function') saveClickerGame(); updateMenuResources(); checkDailyStreak(); playClickSound(); };
    document.getElementById('jumpBackBtn').onclick = () => { document.getElementById('jumpContainer').classList.remove('active'); document.getElementById('mainMenu').style.display = 'flex'; updateMenuResources(); checkDailyStreak(); playClickSound(); };
    
    const savedUserId = localStorage.getItem('billyCurrentUser');
    if(savedUserId && loadUser(savedUserId)) { document.getElementById('registerScreen').style.display = 'none'; document.getElementById('mainMenu').style.display = 'flex'; updateMenuResources(); generateDailyMissions(); generateWeeklyMissions(); checkDailyStreak(); updateLanguage(); }
    
    window.updateMissionProgress = updateMissionProgress;
    window.getUser = () => currentUser;
    window.saveUser = saveUser;
    window.showNotification = showNotification;
    window.updateBillyMood = updateBillyMood;
    window.buySkin = buySkin;
    window.buyPet = buyPet;
    window.upgradeSkill = upgradeSkill;
    window.buyPowerup = buyPowerup;
    window.t = t;
</script>
